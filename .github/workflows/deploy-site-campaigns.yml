name: Deploy Central de Avisos e Campanhas

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-site-campaigns.yml'
      - 'src/components/admin/SiteCampaign*.tsx'
      - 'src/components/campaigns/**'
      - 'src/lib/siteCampaigns.ts'
      - 'src/types/siteCampaigns.ts'
      - 'supabase/migrations/*site_campaign*.sql'
      - 'scripts/check-site-campaign-contracts.ts'
      - 'scripts/check-site-campaign-migrations-runtime.cjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: deploy-site-campaigns-production
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_ID: ocgajvagxagutfvgxwsy
  SUPABASE_CLI_VERSION: 2.101.0

jobs:
  deploy:
    name: Validar e aplicar a Central no Supabase de produção
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Baixar main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar frontend e contratos da Central
        shell: bash
        run: |
          set -euo pipefail
          npm run test:site-campaigns 2>&1 | tee site-campaign-contracts.log
          npx tsc --noEmit 2>&1 | tee site-campaign-typescript.log
          npm run build 2>&1 | tee site-campaign-build.log

      - name: Validar configuração de produção
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test "$SUPABASE_PROJECT_ID" = "$EXPECTED_PROJECT_ID"

      - name: Preparar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Vincular projeto oficial
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Ler histórico remoto antes da implantação
        run: supabase migration list --linked 2>&1 | tee site-campaign-migrations-before.log

      - name: Aplicar somente migrations pendentes da Central
        shell: bash
        run: |
          set -euo pipefail
          : > site-campaign-migrations-apply.log

          remote_has_version() {
            awk -F'|' -v wanted="$1" '
              {
                remote=$2;
                gsub(/[^0-9]/,"",remote);
                if (remote == wanted) found=1;
              }
              END { exit found ? 0 : 1 }
            ' site-campaign-migrations-before.log
          }

          for spec in \
            '20260724223000:supabase/migrations/20260724223000_site_campaigns_schema.sql' \
            '20260724223100:supabase/migrations/20260724223100_site_campaigns_public_api.sql' \
            '20260724223200:supabase/migrations/20260724223200_site_campaigns_admin_api.sql' \
            '20260724223300:supabase/migrations/20260724223300_site_campaigns_security.sql' \
            '20260724223400:supabase/migrations/20260724223400_site_campaigns_delete_api.sql' \
            '20260724223500:supabase/migrations/20260724223500_site_campaigns_action_permissions.sql' \
            '20260724223600:supabase/migrations/20260724223600_site_campaigns_permission_visibility.sql' \
            '20260724223700:supabase/migrations/20260724223700_site_campaigns_permission_hardening.sql' \
            '20260725192000:supabase/migrations/20260725192000_harden_site_campaign_admin_rpc_privileges.sql'; do
              version="${spec%%:*}"
              file="${spec#*:}"

              if remote_has_version "$version"; then
                echo "Ignorando ${version}: já registrada no banco remoto." | tee -a site-campaign-migrations-apply.log
                continue
              fi

              echo "Aplicando ${version} (${file})" | tee -a site-campaign-migrations-apply.log
              supabase db query --linked --file "$file" 2>&1 | tee -a site-campaign-migrations-apply.log
          done

      - name: Reconciliar histórico das migrations aplicadas
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked 2>&1 | tee site-campaign-migrations-pre-repair.log

          for version in \
            20260724223000 \
            20260724223100 \
            20260724223200 \
            20260724223300 \
            20260724223400 \
            20260724223500 \
            20260724223600 \
            20260724223700 \
            20260725192000; do
              if ! awk -F'|' -v wanted="$version" '{ remote=$2; gsub(/[^0-9]/,"",remote); if(remote==wanted) found=1 } END{exit found?0:1}' site-campaign-migrations-pre-repair.log; then
                supabase migration repair --linked --status applied "$version" 2>&1 | tee -a site-campaign-migrations-apply.log
              fi
          done

          supabase migration list --linked 2>&1 | tee site-campaign-migrations-after.log

      - name: Verificar banco de produção
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/verify-site-campaigns.sql <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('public.gsa_site_campaigns') IS NULL
               OR to_regclass('public.gsa_site_campaign_events') IS NULL
               OR to_regclass('public.gsa_site_campaign_history') IS NULL
               OR to_regclass('public.gsa_site_campaign_permissions') IS NULL THEN
              RAISE EXCEPTION 'Tabelas obrigatórias da Central ausentes';
            END IF;

            IF to_regprocedure('public.gsa_public_site_campaigns(text,text,text,text,text,text)') IS NULL
               OR to_regprocedure('public.gsa_public_site_campaign_event(uuid,text,text,text,text,text,text,text,jsonb)') IS NULL
               OR to_regprocedure('public.gsa_admin_site_campaigns_overview(uuid,text)') IS NULL
               OR to_regprocedure('public.gsa_admin_upsert_site_campaign(uuid,jsonb,uuid,text)') IS NULL
               OR to_regprocedure('public.gsa_admin_set_site_campaign_status(uuid,text,uuid,text)') IS NULL
               OR to_regprocedure('public.gsa_admin_duplicate_site_campaign(uuid,uuid,text)') IS NULL
               OR to_regprocedure('public.gsa_admin_delete_site_campaign(uuid,uuid,text)') IS NULL
               OR to_regprocedure('public.gsa_admin_site_campaign_permission_overview(uuid,text)') IS NULL
               OR to_regprocedure('public.gsa_admin_set_site_campaign_permissions(uuid,boolean,text[],uuid,text)') IS NULL
               OR to_regprocedure('public.gsa_admin_site_campaign_my_permissions(uuid,text)') IS NULL THEN
              RAISE EXCEPTION 'RPCs obrigatórias da Central ausentes';
            END IF;

            IF NOT EXISTS (SELECT 1 FROM storage.buckets WHERE id = 'gsa-site-campaigns') THEN
              RAISE EXCEPTION 'Bucket de imagens da Central ausente';
            END IF;

            IF EXISTS (
              SELECT 1
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public'
                AND c.relname IN ('gsa_site_campaigns','gsa_site_campaign_events','gsa_site_campaign_history','gsa_site_campaign_permissions')
                AND NOT c.relrowsecurity
            ) THEN
              RAISE EXCEPTION 'RLS não está habilitado em todas as tabelas da Central';
            END IF;

            IF NOT has_function_privilege('anon', 'public.gsa_public_site_campaigns(text,text,text,text,text,text)', 'EXECUTE')
               OR NOT has_function_privilege('anon', 'public.gsa_public_site_campaign_event(uuid,text,text,text,text,text,text,text,jsonb)', 'EXECUTE') THEN
              RAISE EXCEPTION 'RPCs públicas da Central não estão disponíveis ao papel anon';
            END IF;

            IF EXISTS (
              SELECT 1 FROM unnest(ARRAY[
                'public.gsa_admin_site_campaigns_overview(uuid,text)',
                'public.gsa_admin_upsert_site_campaign(uuid,jsonb,uuid,text)',
                'public.gsa_admin_set_site_campaign_status(uuid,text,uuid,text)',
                'public.gsa_admin_duplicate_site_campaign(uuid,uuid,text)',
                'public.gsa_admin_delete_site_campaign(uuid,uuid,text)',
                'public.gsa_admin_site_campaign_permission_overview(uuid,text)',
                'public.gsa_admin_set_site_campaign_permissions(uuid,boolean,text[],uuid,text)',
                'public.gsa_admin_site_campaign_my_permissions(uuid,text)',
                'public.gsa_admin_site_campaigns_overview_internal(uuid,text)',
                'public.gsa_admin_upsert_site_campaign_internal(uuid,jsonb,uuid,text)',
                'public.gsa_admin_set_site_campaign_status_internal(uuid,text,uuid,text)',
                'public.gsa_admin_duplicate_site_campaign_internal(uuid,uuid,text)',
                'public.gsa_admin_delete_site_campaign_internal(uuid,uuid,text)'
              ]::text[]) AS signature
              WHERE has_function_privilege('anon', signature, 'EXECUTE')
            ) THEN
              RAISE EXCEPTION 'Existe RPC administrativa da Central exposta ao papel anon';
            END IF;

            IF EXISTS (
              SELECT 1 FROM unnest(ARRAY[
                'public.gsa_admin_site_campaigns_overview_internal(uuid,text)',
                'public.gsa_admin_upsert_site_campaign_internal(uuid,jsonb,uuid,text)',
                'public.gsa_admin_set_site_campaign_status_internal(uuid,text,uuid,text)',
                'public.gsa_admin_duplicate_site_campaign_internal(uuid,uuid,text)',
                'public.gsa_admin_delete_site_campaign_internal(uuid,uuid,text)'
              ]::text[]) AS signature
              WHERE has_function_privilege('authenticated', signature, 'EXECUTE')
            ) THEN
              RAISE EXCEPTION 'Existe RPC interna da Central exposta ao papel authenticated';
            END IF;

            IF EXISTS (
              SELECT 1 FROM unnest(ARRAY[
                'public.gsa_admin_site_campaigns_overview(uuid,text)',
                'public.gsa_admin_upsert_site_campaign(uuid,jsonb,uuid,text)',
                'public.gsa_admin_set_site_campaign_status(uuid,text,uuid,text)',
                'public.gsa_admin_duplicate_site_campaign(uuid,uuid,text)',
                'public.gsa_admin_delete_site_campaign(uuid,uuid,text)',
                'public.gsa_admin_site_campaign_permission_overview(uuid,text)',
                'public.gsa_admin_set_site_campaign_permissions(uuid,boolean,text[],uuid,text)',
                'public.gsa_admin_site_campaign_my_permissions(uuid,text)'
              ]::text[]) AS signature
              WHERE NOT has_function_privilege('authenticated', signature, 'EXECUTE')
            ) THEN
              RAISE EXCEPTION 'Existe wrapper administrativo sem permissão authenticated';
            END IF;
          END $$;

          SELECT public.gsa_public_site_campaigns(
            '/', 'desktop', 'guests',
            'production-deploy-viewer', 'production-deploy-session', NULL
          ) IS NOT NULL AS public_rpc_ok;

          SELECT 'SITE_CAMPAIGNS_PRODUCTION_VERIFIED' AS result;
          SQL

          supabase db query --linked --file /tmp/verify-site-campaigns.sql 2>&1 | tee site-campaign-production-verification.log
          grep -q 'SITE_CAMPAIGNS_PRODUCTION_VERIFIED' site-campaign-production-verification.log
          grep -q 'public_rpc_ok' site-campaign-production-verification.log

      - name: Guardar evidências da implantação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-campaigns-production-evidence-${{ github.run_id }}
          path: |
            site-campaign-*.log
          if-no-files-found: ignore
          retention-days: 30

  report:
    name: Registrar resultado da implantação
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publicar resultado na PR 332
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ needs.deploy.result }}';
            const success = result === 'success';
            const icon = success ? '✅' : '❌';
            const status = success ? 'concluída com sucesso' : `finalizada com resultado ${result}`;
            const details = success
              ? `- Supabase: projeto oficial validado\n` +
                `- Migrations: aplicação e reconciliação concluídas\n` +
                `- Banco: tabelas, RPCs, RLS, Storage e fronteiras públicas verificadas\n`
              : `- O workflow foi interrompido em uma etapa de validação ou implantação.\n` +
                `- Etapas posteriores ao ponto de falha não devem ser consideradas concluídas.\n`;
            const body = `${icon} **Implantação produtiva da Central de Avisos e Campanhas ${status}.**\n\n` +
              `- Commit: \`${context.sha}\`\n` +
              details +
              `- Evidências: disponíveis no workflow run ${context.runId}\n\n` +
              `[Abrir execução](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 332,
              body,
            });
            if (!success) core.setFailed(`Deploy da Central terminou com resultado: ${result}`);
