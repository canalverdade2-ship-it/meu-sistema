name: Verify Calculator Pro Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-calculator-pro-runtime.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ocgajvagxagutfvgxwsy
      GH_INFINITEPAY_HANDLE: ${{ secrets.INFINITEPAY_HANDLE }}
      GH_PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
      GH_ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
    steps:
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Synchronize available checkout secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$GH_INFINITEPAY_HANDLE" ]; then
            supabase secrets set INFINITEPAY_HANDLE="$GH_INFINITEPAY_HANDLE" --project-ref "$SUPABASE_PROJECT_REF"
            echo 'GITHUB_INFINITEPAY_HANDLE=AVAILABLE_AND_SYNCED'
          else
            echo 'GITHUB_INFINITEPAY_HANDLE=MISSING'
          fi

          if [ -n "$GH_PUBLIC_SITE_URL" ]; then
            supabase secrets set PUBLIC_SITE_URL="$GH_PUBLIC_SITE_URL" --project-ref "$SUPABASE_PROJECT_REF"
            echo 'GITHUB_PUBLIC_SITE_URL=AVAILABLE_AND_SYNCED'
          else
            echo 'GITHUB_PUBLIC_SITE_URL=MISSING'
          fi

          if [ -n "$GH_ALLOWED_ORIGINS" ]; then
            supabase secrets set ALLOWED_ORIGINS="$GH_ALLOWED_ORIGINS" --project-ref "$SUPABASE_PROJECT_REF"
            echo 'GITHUB_ALLOWED_ORIGINS=AVAILABLE_AND_SYNCED'
          else
            echo 'GITHUB_ALLOWED_ORIGINS=MISSING_OR_ALREADY_MANAGED_ONLY_IN_SUPABASE'
          fi

      - name: Report Supabase checkout secret status
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" --output json > /tmp/secrets.json
          jq -r '.[].name' /tmp/secrets.json | sort > /tmp/secret-names.txt
          for name in INFINITEPAY_HANDLE PUBLIC_SITE_URL ALLOWED_ORIGINS; do
            if grep -qx "$name" /tmp/secret-names.txt; then
              echo "$name=CONFIGURED"
            else
              echo "$name=MISSING"
            fi
          done

      - name: Compare production database with public function
        shell: bash
        run: |
          set -euo pipefail
          query="SELECT preco_centavos, duracao_acesso_minutos FROM public.gsa_calculator_pro_products WHERE tool_id='termination';"
          jq -n --arg query "$query" '{query:$query,read_only:true}' > /tmp/db-payload.json
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/db-payload.json \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" > /tmp/db.json

          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys" > /tmp/keys.json
          anon="$(jq -r '.[] | select(.name=="anon") | .api_key' /tmp/keys.json)"
          test -n "$anon"

          jq -n '{action:"status",payload:{tool_id:"termination",visitor_token:"gsa_runtime_diagnostic_12345678901234567890"}}' > /tmp/function-payload.json
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "apikey: $anon" \
            --header "Authorization: Bearer $anon" \
            --header 'Content-Type: application/json' \
            --header 'Origin: http://localhost:3000' \
            --data-binary @/tmp/function-payload.json \
            "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/gsa-free-tools-pro" > /tmp/function.json

          db_price="$(jq -r '.[0].preco_centavos' /tmp/db.json)"
          db_duration="$(jq -r '.[0].duracao_acesso_minutos' /tmp/db.json)"
          public_price="$(jq -r '.product.preco_centavos' /tmp/function.json)"
          public_duration="$(jq -r '.product.duracao_acesso_minutos' /tmp/function.json)"

          echo "DATABASE_PRICE_CENTS=$db_price"
          echo "PUBLIC_PRICE_CENTS=$public_price"
          echo "DATABASE_DURATION_MINUTES=$db_duration"
          echo "PUBLIC_DURATION_MINUTES=$public_duration"

          test "$db_price" = "$public_price"
          test "$db_duration" = "$public_duration"
          echo 'CALCULATOR_PRO_RUNTIME_SYNCHRONIZED'
