name: Deploy and Verify Calculator Pro Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-calculator-pro-runtime.yml'
      - 'supabase/functions/gsa-free-tools-pro/**'
      - 'supabase/functions/gsa-free-tools-pro-webhook/**'

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ocgajvagxagutfvgxwsy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Validate Calculator Pro functions
        shell: bash
        run: |
          set -euo pipefail
          deno check supabase/functions/gsa-free-tools-pro/index.ts
          deno check supabase/functions/gsa-free-tools-pro-webhook/index.ts
          grep -q 'MAX_PRODUCT_DURATION_MINUTES' supabase/functions/gsa-free-tools-pro/index.ts
          grep -q 'CLIENT_REVALIDATION_MINUTES' supabase/functions/gsa-free-tools-pro/index.ts
          if grep -q 'Math.min(productDuration, 120)' supabase/functions/gsa-free-tools-pro/index.ts; then
            echo 'Old hidden 120-minute cap still present'
            exit 1
          fi

      - name: Deploy Calculator Pro functions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          supabase functions deploy gsa-free-tools-pro \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt
          supabase functions deploy gsa-free-tools-pro-webhook \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt

      - name: Compare production database with public function
        shell: bash
        run: |
          set -euo pipefail
          query="SELECT preco_centavos, duracao_acesso_minutos FROM public.gsa_calculator_pro_products WHERE tool_id='termination';"
          jq -n --arg query "$query" '{query:$query,read_only:true}' > /tmp/db-payload.json
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/db-payload.json \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" > /tmp/db.json

          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys" > /tmp/keys.json
          anon="$(jq -r '.[] | select(.name=="anon") | .api_key' /tmp/keys.json)"
          test -n "$anon"

          jq -n '{action:"status",payload:{tool_id:"termination",visitor_token:"gsa_runtime_diagnostic_12345678901234567890"}}' > /tmp/function-payload.json
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "apikey: $anon" \
            --header "Authorization: Bearer $anon" \
            --header 'Content-Type: application/json' \
            --header 'Origin: http://localhost:3000' \
            --data-binary @/tmp/function-payload.json \
            "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/gsa-free-tools-pro" > /tmp/function.json

          db_price="$(jq -r '.[0].preco_centavos' /tmp/db.json)"
          db_duration="$(jq -r '.[0].duracao_acesso_minutos' /tmp/db.json)"
          public_price="$(jq -r '.product.preco_centavos' /tmp/function.json)"
          public_duration="$(jq -r '.product.duracao_acesso_minutos' /tmp/function.json)"

          echo "DATABASE_PRICE_CENTS=$db_price"
          echo "PUBLIC_PRICE_CENTS=$public_price"
          echo "DATABASE_DURATION_MINUTES=$db_duration"
          echo "PUBLIC_DURATION_MINUTES=$public_duration"

          test "$db_price" = "$public_price"
          test "$db_duration" = "$public_duration"
          echo 'CALCULATOR_PRO_RUNTIME_SYNCHRONIZED'
