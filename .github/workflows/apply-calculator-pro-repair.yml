name: Apply Calculator Pro Repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-calculator-pro-repair.yml'

permissions:
  contents: read

jobs:
  diagnose-sql-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ocgajvagxagutfvgxwsy

    steps:
      - name: Execute minimal SQL query
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          payload='{"query":"select 1 as connection_ok","read_only":true}'
          status="$(curl --silent --show-error \
            --output /tmp/response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query")"
          echo "HTTP_STATUS=$status"
          cat /tmp/response.json | jq . || cat /tmp/response.json
          test "$status" = '201'
