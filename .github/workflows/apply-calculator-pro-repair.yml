name: Apply Calculator Pro Repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-calculator-pro-repair.yml'

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ocgajvagxagutfvgxwsy

    steps:
      - name: Query final Calculator Pro state
        shell: bash
        run: |
          set -euo pipefail
          query="SELECT tool_id, nome, ativo, preco_centavos, duracao_acesso_minutos, liberar_cliente_com_fatura_paga FROM public.gsa_calculator_pro_products ORDER BY tool_id;"
          jq -n --arg query "$query" '{query: $query, read_only: true}' > /tmp/payload.json
          status="$(curl --silent --show-error --output /tmp/products.json --write-out '%{http_code}' --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header 'Content-Type: application/json' --data-binary @/tmp/payload.json "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query")"
          echo "HTTP_STATUS=$status"
          jq -c . /tmp/products.json
          test "$status" = '201'
          test "$(jq 'length' /tmp/products.json)" = '3'

      - name: Query required database objects
        shell: bash
        run: |
          set -euo pipefail
          query="SELECT (SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('gsa_calculator_pro_products','gsa_calculator_pro_payments','gsa_calculator_pro_vouchers','gsa_calculator_pro_grants','gsa_calculator_pro_sessions','gsa_calculator_pro_events')) AS tables, to_regprocedure('public.gsa_admin_ensure_calculator_pro_products(uuid,text)') IS NOT NULL AS ensure_rpc, to_regprocedure('public.gsa_admin_calculator_pro_snapshot(uuid,text)') IS NOT NULL AS snapshot_rpc, to_regprocedure('public.gsa_admin_save_calculator_pro_product(uuid,text,text,jsonb)') IS NOT NULL AS save_rpc, to_regprocedure('public.gsa_admin_create_calculator_pro_voucher(uuid,text,text,timestamptz,text)') IS NOT NULL AS voucher_rpc;"
          jq -n --arg query "$query" '{query: $query, read_only: true}' > /tmp/payload.json
          status="$(curl --silent --show-error --output /tmp/objects.json --write-out '%{http_code}' --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header 'Content-Type: application/json' --data-binary @/tmp/payload.json "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query")"
          echo "HTTP_STATUS=$status"
          jq -c . /tmp/objects.json
          test "$status" = '201'
          test "$(jq -r '.[0].tables' /tmp/objects.json)" = '6'
          test "$(jq -r '.[0].ensure_rpc' /tmp/objects.json)" = 'true'
          test "$(jq -r '.[0].snapshot_rpc' /tmp/objects.json)" = 'true'
          test "$(jq -r '.[0].save_rpc' /tmp/objects.json)" = 'true'
          test "$(jq -r '.[0].voucher_rpc' /tmp/objects.json)" = 'true'
          echo 'CALCULATOR_PRO_PRODUCTION_READY'
