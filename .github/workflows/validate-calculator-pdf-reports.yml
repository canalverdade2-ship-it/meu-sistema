name: Validate Calculator PDF Reports

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/freeToolsPdfReport.ts'
      - 'src/components/public/CalculatorPdfReportButton.tsx'
      - 'src/components/public/FreeToolsSimpleCalculators.tsx'
      - 'src/components/public/FreeToolsAdvancedCalculators.tsx'
      - 'src/components/public/FreeToolsAdditionalCalculators.tsx'
      - 'scripts/check-free-tools-pdf-contracts.ts'
      - 'package.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Calculators and PDF contracts
        run: npm run test:free-tools
      - name: Production build
        run: npm run build
