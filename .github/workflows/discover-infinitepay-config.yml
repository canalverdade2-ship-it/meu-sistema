name: Discover InfinitePay Configuration

on:
  push:
    branches: ['audit/calculadoras-pro-voucher-pagamento-20260724']
    paths: ['.github/workflows/discover-infinitepay-config.yml']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/discover-infinitepay-config.yml']

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ocgajvagxagutfvgxwsy
      GH_INFINITEPAY_HANDLE: ${{ secrets.INFINITEPAY_HANDLE }}
    steps:
      - uses: actions/checkout@v4
      - name: Report configuration sources
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$GH_INFINITEPAY_HANDLE" ]; then echo 'GITHUB_INFINITEPAY_HANDLE=CONFIGURED'; else echo 'GITHUB_INFINITEPAY_HANDLE=MISSING'; fi
          curl --fail-with-body --silent --show-error --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/secrets" > /tmp/secrets.json
          if jq -e '.[] | select(.name=="INFINITEPAY_HANDLE")' /tmp/secrets.json >/dev/null; then echo 'SUPABASE_INFINITEPAY_HANDLE=CONFIGURED'; else echo 'SUPABASE_INFINITEPAY_HANDLE=MISSING'; fi
          query="SELECT table_schema,table_name,column_name FROM information_schema.columns WHERE lower(column_name) LIKE '%infinitepay%' OR lower(column_name) IN ('handle','infinitepay_handle') ORDER BY 1,2,3; SELECT count(*)::integer AS checkout_rows FROM public.gsa_calculator_pro_payments WHERE checkout_url IS NOT NULL; SELECT regexp_replace(checkout_url, '([?&](lenc|token|key)=[^&]+)', '\\1=REDACTED', 'gi') AS checkout_preview FROM public.gsa_calculator_pro_payments WHERE checkout_url IS NOT NULL ORDER BY created_at DESC LIMIT 3;"
          jq -n --arg query "$query" '{query:$query,read_only:true}' > /tmp/query.json
          curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header 'Content-Type: application/json' --data-binary @/tmp/query.json "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" > /tmp/result.json
          echo 'DATABASE_CONFIGURATION_FINDINGS:'
          jq -c . /tmp/result.json
          echo 'REPOSITORY_REFERENCES:'
          grep -RIl --exclude-dir=node_modules --exclude='discover-infinitepay-config.yml' -E 'INFINITEPAY_HANDLE|api\.checkout\.infinitepay\.io|InfinitePay' . | sort | head -50
