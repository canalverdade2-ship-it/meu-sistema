name: Upgrade GSA TV Control Plane

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upgrade-gsa-control-plane-once.yml"

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-latest
    environment: gsa-tv-production
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.GSA_TV_VPS_HOST }}
      VPS_USER: ${{ secrets.GSA_TV_VPS_USER }}
    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.GSA_TV_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.GSA_TV_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/gsa-tv-deploy"
          chmod 600 "$HOME/.ssh/gsa-tv-deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy control plane 1.9.0
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/gsa-tv-deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/gsa-tv/control-plane
          sudo -n true
          sudo cp compose.yml "compose.yml.pre-1.9.0-$(date +%Y%m%d-%H%M%S)"
          sudo sed -i 's#gsa-tv/control-plane:1\.8\.0#gsa-tv/control-plane:1.9.0#' compose.yml
          sudo docker compose up -d --no-deps control-plane
          ok=0
          for i in $(seq 1 30); do
            s="$(sudo docker inspect gsa-tv-control-plane --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' 2>/dev/null || true)"
            echo "health=$s"
            if [ "$s" = "healthy" ]; then ok=1; break; fi
            if [ "$s" = "unhealthy" ]; then break; fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "ROLLBACK_TO_1.8.0"
            sudo sed -i 's#gsa-tv/control-plane:1\.9\.0#gsa-tv/control-plane:1.8.0#' compose.yml
            sudo docker compose up -d --no-deps control-plane
            exit 1
          fi
          curl -fsS http://127.0.0.1:9202/health | head -c 2000
          echo
          sudo docker inspect gsa-tv-control-plane --format 'Image={{.Config.Image}} Health={{.State.Health.Status}}'
          echo CONTROL_PLANE_UPGRADE_OK
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/gsa-tv-deploy" "$HOME/.ssh/known_hosts"
