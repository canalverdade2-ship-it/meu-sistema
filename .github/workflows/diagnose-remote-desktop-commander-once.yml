name: One-shot Diagnose Remote Desktop Commander

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-remote-desktop-commander-once.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: gsa-tv-production
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.GSA_TV_VPS_HOST }}
      VPS_USER: ${{ secrets.GSA_TV_VPS_USER }}
    steps:
      - name: Configure pinned SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.GSA_TV_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.GSA_TV_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/gsa-tv-deploy"
          chmod 0600 "$HOME/.ssh/gsa-tv-deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Diagnose remote agent
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy"             -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes             "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "=== HOST ==="
          hostname
          id
          echo "=== NODE / NPM ==="
          command -v node || true
          node --version || true
          command -v npm || true
          npm --version || true
          command -v npx || true
          npx --version || true
          echo "=== LATEST DESKTOP COMMANDER PACKAGE ==="
          npm view @wonderwhy-er/desktop-commander version || true
          echo "=== MATCHING PROCESSES ==="
          ps -eo pid=,ppid=,user=,lstart=,args= | grep -Ei '[d]esktop-commander|[r]emote-desktop-commander' || true
          echo "=== SYSTEMD SERVICES ==="
          sudo -n systemctl list-unit-files --type=service --no-pager 2>/dev/null | grep -Ei 'desktop|commander|remote' || true
          sudo -n systemctl list-units --type=service --all --no-pager 2>/dev/null | grep -Ei 'desktop|commander|remote' || true
          echo "=== PM2 ==="
          if command -v pm2 >/dev/null 2>&1; then
            pm2 jlist 2>/dev/null || true
          fi
          echo "=== SCREEN/TMUX ==="
          screen -ls 2>/dev/null || true
          tmux ls 2>/dev/null || true
          echo "DIAGNOSIS_COMPLETE=true"
          REMOTE

      - name: Remove local SSH material
        if: always()
        run: rm -f "$HOME/.ssh/gsa-tv-deploy" "$HOME/.ssh/known_hosts"
