name: Validar Central de Avisos

on:
  push:
    branches:
      - feature/central-avisos-campanhas
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: validate-site-campaigns-once
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/central-avisos-campanhas
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Executar validações e registrar diagnóstico
        shell: bash
        run: |
          mkdir -p .gsa-validation
          set +e
          {
            echo "=== CONTRATOS DA CENTRAL ==="
            npm run test:site-campaigns
            CONTRACT_STATUS=$?
            echo
            echo "=== TYPESCRIPT ==="
            npx tsc --noEmit
            TSC_STATUS=$?
            echo
            echo "=== BUILD ==="
            npm run build
            BUILD_STATUS=$?
            echo
            echo "CONTRACT_STATUS=$CONTRACT_STATUS"
            echo "TSC_STATUS=$TSC_STATUS"
            echo "BUILD_STATUS=$BUILD_STATUS"
          } > .gsa-validation/site-campaigns.log 2>&1
          exit 0
      - name: Publicar artefato de diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: site-campaign-diagnostic
          path: .gsa-validation/site-campaigns.log
          if-no-files-found: error
          retention-days: 1

  report:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Baixar diagnóstico
        uses: actions/download-artifact@v4
        with:
          name: site-campaign-diagnostic
      - name: Exibir diagnóstico completo
        run: cat site-campaigns.log
