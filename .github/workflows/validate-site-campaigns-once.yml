name: Validar Central de Avisos

on:
  push:
    branches:
      - feature/central-avisos-campanhas
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-site-campaigns-once
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/central-avisos-campanhas
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Executar validações e registrar diagnóstico
        shell: bash
        run: |
          mkdir -p .gsa-validation
          set +e
          {
            echo "=== CONTRATOS DA CENTRAL ==="
            npm run test:site-campaigns
            CONTRACT_STATUS=$?
            echo
            echo "=== TYPESCRIPT ==="
            npx tsc --noEmit
            TSC_STATUS=$?
            echo
            echo "=== BUILD ==="
            npm run build
            BUILD_STATUS=$?
            echo
            echo "CONTRACT_STATUS=$CONTRACT_STATUS"
            echo "TSC_STATUS=$TSC_STATUS"
            echo "BUILD_STATUS=$BUILD_STATUS"
          } > .gsa-validation/site-campaigns.log 2>&1
          cat .gsa-validation/site-campaigns.log
          exit 0
      - name: Publicar diagnóstico na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gsa-validation/site-campaigns.log
          git commit -m "Registrar diagnóstico da Central de Avisos" || exit 0
          git push origin HEAD:feature/central-avisos-campanhas
