name: Corrigir e validar Central de Avisos

on:
  push:
    branches:
      - feature/central-avisos-campanhas
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-site-campaigns-once
  cancel-in-progress: false

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/central-avisos-campanhas
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Corrigir contratos de propriedades JSX
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/admin/SiteCampaignAdminModule.tsx')
          content = path.read_text()
          old_box = "function Box({ children, className = '' }: { children: ReactNode; className?: string })"
          new_box = "function Box({ children, className = '' }: { children: ReactNode; className?: string; key?: string | number })"
          old_field = "function Field({ label, children, hint }: { label: string; children: ReactNode; hint?: string })"
          new_field = "function Field({ label, children, hint }: { label: string; children: ReactNode; hint?: string; key?: string | number })"
          if old_box not in content or old_field not in content:
              raise SystemExit('Assinaturas esperadas não encontradas para correção segura.')
          path.write_text(content.replace(old_box, new_box).replace(old_field, new_field))
          PY
      - name: Instalar dependências
        run: npm ci
      - name: Validar contratos da Central
        run: npm run test:site-campaigns
      - name: Validar TypeScript
        run: npx tsc --noEmit
      - name: Gerar build de produção
        run: npm run build
      - name: Remover workflow temporário
        run: rm -f .github/workflows/validate-site-campaigns-once.yml
      - name: Publicar correção validada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/SiteCampaignAdminModule.tsx .github/workflows/validate-site-campaigns-once.yml
          git commit -m "Corrigir tipagem e validar Central de Avisos"
          git push origin HEAD:feature/central-avisos-campanhas
