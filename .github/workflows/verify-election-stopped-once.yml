name: Verify Election Source Stopped

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-election-stopped-once.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: gsa-tv-production
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.GSA_TV_VPS_HOST }}
      VPS_USER: ${{ secrets.GSA_TV_VPS_USER }}
    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.GSA_TV_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.GSA_TV_VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/gsa-tv-deploy"
          chmod 600 "$HOME/.ssh/gsa-tv-deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/gsa-tv-deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          echo "=== PORT 9232 ==="
          ss -ltnp 2>/dev/null | grep ':9232' || true
          echo "=== ELECTION PROCESSES ==="
          ps -eo pid=,ppid=,args= | grep -Ei '[e]lection|9232/stream.mjpg' | sed -E 's#(rtmps?://[^/ ]+/)[^ ]+#\1[PROTECTED]#g' || true
          echo "=== FFP TOP ==="
          docker top gsa-tv-ffplayout -eo pid,ppid,user,args 2>/dev/null | grep -E 'ffplayout|ffmpeg' | sed -E 's#(rtmps?://[^/ ]+/)[^ ]+#\1[PROTECTED]#g' || true
          echo "=== FFP CURRENT MEDIA ==="
          docker logs --since 30s gsa-tv-ffplayout 2>&1 | grep -Ei 'live input ended|switching back to file playback|reinitialize playlist|Play for|filler|idle' | tail -n 50 || true
          echo "=== PM2 ==="
          pm2 list | grep 'gsa-tv-election' || true
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/gsa-tv-deploy" "$HOME/.ssh/known_hosts"
