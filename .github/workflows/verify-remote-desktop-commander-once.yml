name: One-shot Verify Remote Desktop Commander

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-remote-desktop-commander-once.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: gsa-tv-production
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.GSA_TV_VPS_HOST }}
      VPS_USER: ${{ secrets.GSA_TV_VPS_USER }}
    steps:
      - name: Configure pinned SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.GSA_TV_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.GSA_TV_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/gsa-tv-deploy"
          chmod 0600 "$HOME/.ssh/gsa-tv-deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Verify service and sanitized logs
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy"             -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes             "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          SERVICE="desktop-commander-remote.service"
          echo "VERSION=$(node -p "require('/usr/lib/node_modules/@wonderwhy-er/desktop-commander/package.json').version")"
          sudo systemctl show "$SERVICE" -p ActiveState -p SubState -p MainPID -p User -p ExecStart --no-pager
          echo "=== UNIT ==="
          sudo systemctl cat "$SERVICE" --no-pager | sed -E 's/(TOKEN|KEY|SECRET|PASSWORD)=[^ ]+/\1=<REDACTED>/Ig'
          echo "=== PROCESSES ==="
          ps -eo pid=,ppid=,user=,lstart=,args= | grep -Ei '[d]esktop-commander|[r]emote-desktop-commander' || true
          echo "=== SANITIZED RECENT LOGS ==="
          sudo journalctl -u "$SERVICE" --since "10 minutes ago" --no-pager 2>/dev/null             | sed -E 's#https?://[^ ]+#<URL>#g; s/[A-Za-z0-9_-]{32,}/<REDACTED>/g'             | grep -Ei 'desktop|remote|version|ready|connect|auth|session|error|warn|outdated|device|fail'             | tail -n 80 || true
          echo "VERIFY_COMPLETE=true"
          REMOTE

      - name: Remove local SSH material
        if: always()
        run: rm -f "$HOME/.ssh/gsa-tv-deploy" "$HOME/.ssh/known_hosts"
