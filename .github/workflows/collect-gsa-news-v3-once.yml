name: Collect GSA News V3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collect-gsa-news-v3-once.yml"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    environment: gsa-tv-production
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ secrets.GSA_TV_VPS_HOST }}
      VPS_USER: ${{ secrets.GSA_TV_VPS_USER }}
    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.GSA_TV_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.GSA_TV_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/gsa-tv-deploy"
          chmod 600 "$HOME/.ssh/gsa-tv-deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Wait for V3 render
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            if ssh -i "$HOME/.ssh/gsa-tv-deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST"               "test -s /home/opc/gsa-news-eleicoes-v3/GSA-News-Especial-Eleicoes-2026-V3-VIDEO-9x16.mp4 && test -s /home/opc/gsa-news-eleicoes-v3/QC-GSA-News-Especial-Eleicoes-2026-V3.txt"; then
              echo "V3_READY=true"
              exit 0
            fi
            echo "waiting $i"
            sleep 10
          done
          echo "V3 render timeout" >&2
          exit 1

      - name: Validate master
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/gsa-tv-deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST"             "ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -show_entries format=duration,size -of json /home/opc/gsa-news-eleicoes-v3/GSA-News-Especial-Eleicoes-2026-V3-VIDEO-9x16.mp4"

      - name: Fetch V3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          scp -i "$HOME/.ssh/gsa-tv-deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes             "$VPS_USER@$VPS_HOST:/home/opc/gsa-news-eleicoes-v3/GSA-News-Especial-Eleicoes-2026-V3-VIDEO-9x16.mp4" artifact/
          scp -i "$HOME/.ssh/gsa-tv-deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes             "$VPS_USER@$VPS_HOST:/home/opc/gsa-news-eleicoes-v3/QC-GSA-News-Especial-Eleicoes-2026-V3.txt" artifact/
          scp -i "$HOME/.ssh/gsa-tv-deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes             "$VPS_USER@$VPS_HOST:/home/opc/gsa-news-eleicoes-v3/v3-manifest.json" artifact/

      - name: Upload V3
        uses: actions/upload-artifact@v4
        with:
          name: gsa-news-eleicoes-2026-v3-video
          path: artifact/*
          retention-days: 7
          compression-level: 0

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/gsa-tv-deploy" "$HOME/.ssh/known_hosts"
