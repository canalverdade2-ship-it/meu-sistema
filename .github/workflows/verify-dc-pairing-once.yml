name: One-shot Verify DC Pairing

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-dc-pairing-once.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: gsa-tv-production
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.GSA_TV_VPS_HOST }}
      VPS_USER: ${{ secrets.GSA_TV_VPS_USER }}
    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.GSA_TV_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.GSA_TV_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/gsa-tv-deploy"
          chmod 600 "$HOME/.ssh/gsa-tv-deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect and recover pairing
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy"             -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes             "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          SERVICE=desktop-commander-remote.service
          echo "VERSION=$(node -p "require('/usr/lib/node_modules/@wonderwhy-er/desktop-commander/package.json').version")"
          echo "STATE_BEFORE=$(sudo systemctl is-active "$SERVICE" || true)"
          echo "=== RECENT LOGS BEFORE ==="
          sudo journalctl -u "$SERVICE" --since "10 minutes ago" --no-pager | tail -n 120 || true

          if sudo journalctl -u "$SERVICE" --since "10 minutes ago" --no-pager | grep -Eq 'authorization|Authorized|authenticated|Authentication|connected|Connected|device'; then
            :
          fi

          sudo systemctl restart "$SERVICE"
          sleep 8
          echo "STATE_AFTER=$(sudo systemctl is-active "$SERVICE" || true)"
          echo "=== RECENT LOGS AFTER ==="
          sudo journalctl -u "$SERVICE" --since "2 minutes ago" --no-pager | tail -n 120 || true
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/gsa-tv-deploy" "$HOME/.ssh/known_hosts"
