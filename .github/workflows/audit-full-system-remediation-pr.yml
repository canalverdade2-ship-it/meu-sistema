name: Auditoria Completa - PR de Correcao

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: audit-full-system-remediation-pr
  cancel-in-progress: false

jobs:
  repair-and-validate:
    if: github.head_ref == 'audit/full-system-remediation-20260727'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout da branch isolada
        uses: actions/checkout@v4
        with:
          ref: audit/full-system-remediation-20260727
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Aplicar correcoes estruturais idempotentes
        run: node scripts/apply-full-audit-type-fixes.mjs

      - name: Validar integridade do diff
        run: git diff --check

      - name: Registrar correcoes na branch de auditoria
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteracao adicional a registrar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types.ts
          git commit -m "fix(audit): alinhar tipos aos fluxos operacionais"
          git push origin HEAD:audit/full-system-remediation-20260727

      - name: Executar TypeScript e auditoria de producao
        run: npm run lint
