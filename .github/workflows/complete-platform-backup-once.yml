name: Complete Platform Upgrade Backup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/complete-platform-backup-once.yml"

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: gsa-tv-production
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ secrets.GSA_TV_VPS_HOST }}
      VPS_USER: ${{ secrets.GSA_TV_VPS_USER }}
    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.GSA_TV_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.GSA_TV_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/gsa-tv-deploy"
          chmod 600 "$HOME/.ssh/gsa-tv-deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Complete and verify snapshot
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          DIR="$(sudo find /opt/gsa-tv/backups/platform-upgrade -mindepth 1 -maxdepth 1 -type d -printf '%p\n' | sort | tail -n 1)"
          test -n "$DIR"

          sudo -u postgres /usr/pgsql-15/bin/pg_dumpall -p 5433 | gzip | sudo tee "$DIR/host-postgres.sql.gz" >/dev/null
          sudo chmod 0600 "$DIR/host-postgres.sql.gz"

          sudo cp -a /opt/gsa-tv/config/ffplayout/ffplayout.db "$DIR/ffplayout.db" 2>/dev/null || true
          sudo chmod 0600 "$DIR/ffplayout.db" 2>/dev/null || true

          sudo sh -c "cd '$DIR' && sha256sum containers-inspect.json configs.tgz n8n-data.tgz evo-postgres.sql.gz host-postgres.sql.gz ffplayout.db > SHA256SUMS"
          sudo sh -c "cd '$DIR' && sha256sum -c SHA256SUMS"
          echo "BACKUP_DIR=$DIR"
          sudo du -sh "$DIR"
          sudo ls -lh "$DIR" | sed -E 's/[[:space:]]+/ /g'
          echo BACKUP_COMPLETE=true
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/gsa-tv-deploy" "$HOME/.ssh/known_hosts"
