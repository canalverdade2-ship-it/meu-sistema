name: Audit Calculator Pro Voucher and Payment

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-calculator-pro-flows.yml'
      - 'supabase/functions/gsa-free-tools-pro/**'
      - 'supabase/functions/gsa-free-tools-pro-webhook/**'
      - 'supabase/migrations/*calculator_pro*.sql'
      - 'src/components/public/FreeToolsPro*.tsx'
      - 'src/lib/freeToolsProAccess.ts'

permissions:
  contents: read

jobs:
  production-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ocgajvagxagutfvgxwsy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare production access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys" > /tmp/keys.json
          jq -r '.[] | select(.name=="anon") | .api_key' /tmp/keys.json > /tmp/anon-key
          test -s /tmp/anon-key

      - name: Inspect production configuration
        shell: bash
        run: |
          set -euo pipefail
          query="SELECT tool_id, ativo, preco_centavos, duracao_acesso_minutos FROM public.gsa_calculator_pro_products ORDER BY tool_id;
          SELECT status, count(*)::integer AS total FROM public.gsa_calculator_pro_vouchers GROUP BY status ORDER BY status;
          SELECT status, count(*)::integer AS total FROM public.gsa_calculator_pro_payments GROUP BY status ORDER BY status;
          SELECT table_schema, table_name, column_name FROM information_schema.columns WHERE lower(column_name) LIKE '%infinitepay%' OR lower(column_name) IN ('handle','infinitepay_handle') ORDER BY 1,2,3;
          SELECT id, tool_id, status, left(COALESCE(checkout_url,''),120) AS checkout_url_preview FROM public.gsa_calculator_pro_payments WHERE checkout_url IS NOT NULL ORDER BY created_at DESC LIMIT 5;"
          jq -n --arg query "$query" '{query:$query,read_only:true}' > /tmp/query.json
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/query.json \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" | jq -c .

      - name: Inspect required Supabase secrets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/secrets" > /tmp/secrets.json
          for name in INFINITEPAY_HANDLE PUBLIC_SITE_URL ALLOWED_ORIGINS; do
            if jq -e --arg name "$name" '.[] | select(.name==$name)' /tmp/secrets.json >/dev/null; then
              echo "$name=CONFIGURED"
            else
              echo "$name=MISSING"
            fi
          done

      - name: Exercise voucher end to end
        shell: bash
        run: |
          set -euo pipefail
          anon="$(cat /tmp/anon-key)"
          marker="AUDIT_VOUCHER_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          code="GSA-PRO-$(openssl rand -hex 10 | tr '[:lower:]' '[:upper:]')"
          hash="$(printf '%s' "$code" | sha256sum | awk '{print $1}')"
          hint="${code: -6}"
          visitor="gsa_audit_voucher_${GITHUB_RUN_ID}_12345678901234567890"

          query="INSERT INTO public.gsa_calculator_pro_vouchers(code_hash,code_hint,tool_id,status,expires_at,observacoes) VALUES ('$hash','$hint','termination','active',now()+interval '1 hour','$marker') RETURNING id;"
          jq -n --arg query "$query" '{query:$query,read_only:false}' > /tmp/voucher-insert.json
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header 'Content-Type: application/json' \
            --data-binary @/tmp/voucher-insert.json \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" > /tmp/voucher-row.json
          voucher_id="$(jq -r '.[0].id' /tmp/voucher-row.json)"
          test -n "$voucher_id"
          echo "$marker" > /tmp/audit-marker

          jq -n --arg code "$code" --arg visitor "$visitor" '{action:"redeem_voucher",payload:{tool_id:"termination",visitor_token:$visitor,code:$code}}' > /tmp/redeem.json
          first_status="$(curl --silent --show-error --output /tmp/redeem-first.json --write-out '%{http_code}' --request POST \
            --header "apikey: $anon" --header "Authorization: Bearer $anon" --header 'Content-Type: application/json' --header 'Origin: http://localhost:3000' \
            --data-binary @/tmp/redeem.json "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/gsa-free-tools-pro")"
          echo "FIRST_REDEEM_HTTP=$first_status"
          jq -c . /tmp/redeem-first.json
          test "$first_status" = '200'
          jq -e '.success==true and .session.success==true and (.session.token|length)>20' /tmp/redeem-first.json >/dev/null
          token="$(jq -r '.session.token' /tmp/redeem-first.json)"

          jq -n --arg visitor "$visitor" --arg token "$token" '{action:"status",payload:{tool_id:"termination",visitor_token:$visitor,pro_session_token:$token}}' > /tmp/status.json
          curl --fail-with-body --silent --show-error --request POST \
            --header "apikey: $anon" --header "Authorization: Bearer $anon" --header 'Content-Type: application/json' --header 'Origin: http://localhost:3000' \
            --data-binary @/tmp/status.json "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/gsa-free-tools-pro" > /tmp/status-result.json
          jq -c . /tmp/status-result.json
          jq -e '.access==true and .source=="voucher"' /tmp/status-result.json >/dev/null

          second_status="$(curl --silent --show-error --output /tmp/redeem-second.json --write-out '%{http_code}' --request POST \
            --header "apikey: $anon" --header "Authorization: Bearer $anon" --header 'Content-Type: application/json' --header 'Origin: http://localhost:3000' \
            --data-binary @/tmp/redeem.json "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/gsa-free-tools-pro")"
          echo "SECOND_REDEEM_HTTP=$second_status"
          jq -c . /tmp/redeem-second.json
          test "$second_status" = '400'
          jq -e '.error=="voucher_unavailable"' /tmp/redeem-second.json >/dev/null

          query="SELECT v.status,v.used_at,g.max_uses,g.used_count,g.status AS grant_status,count(s.id)::integer AS sessions FROM public.gsa_calculator_pro_vouchers v JOIN public.gsa_calculator_pro_grants g ON g.reference_id=v.id AND g.source='voucher' LEFT JOIN public.gsa_calculator_pro_sessions s ON s.grant_id=g.id WHERE v.id='$voucher_id' GROUP BY v.status,v.used_at,g.max_uses,g.used_count,g.status;"
          jq -n --arg query "$query" '{query:$query,read_only:true}' > /tmp/voucher-check.json
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header 'Content-Type: application/json' \
            --data-binary @/tmp/voucher-check.json \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" > /tmp/voucher-check-result.json
          jq -c . /tmp/voucher-check-result.json
          jq -e '.[0].status=="used" and .[0].max_uses==1 and .[0].used_count==1 and .[0].sessions==1' /tmp/voucher-check-result.json >/dev/null
          echo 'VOUCHER_E2E_OK'

      - name: Inspect checkout creation
        shell: bash
        run: |
          set -euo pipefail
          anon="$(cat /tmp/anon-key)"
          visitor="gsa_audit_checkout_${GITHUB_RUN_ID}_12345678901234567890"
          jq -n --arg visitor "$visitor" '{action:"create_checkout",payload:{tool_id:"termination",visitor_token:$visitor,customer_name:"Auditoria GSA"}}' > /tmp/checkout.json
          status="$(curl --silent --show-error --output /tmp/checkout-result.json --write-out '%{http_code}' --request POST \
            --header "apikey: $anon" --header "Authorization: Bearer $anon" --header 'Content-Type: application/json' --header 'Origin: http://localhost:3000' \
            --data-binary @/tmp/checkout.json "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/gsa-free-tools-pro")"
          echo "CHECKOUT_HTTP=$status"
          jq -c . /tmp/checkout-result.json
          if [ "$status" = '200' ]; then
            jq -e '.success==true and (.checkout_url|startswith("https://"))' /tmp/checkout-result.json >/dev/null
            order="$(jq -r '.order_nsu' /tmp/checkout-result.json)"
            echo "$order" > /tmp/audit-order
            query="SELECT order_nsu,tool_id,valor_centavos,status,checkout_url FROM public.gsa_calculator_pro_payments WHERE order_nsu='$order';"
            jq -n --arg query "$query" '{query:$query,read_only:true}' > /tmp/payment-check.json
            curl --fail-with-body --silent --show-error --request POST \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header 'Content-Type: application/json' \
              --data-binary @/tmp/payment-check.json \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" | tee /tmp/payment-row.json | jq -c .
            jq -e '.[0].status=="pending" and .[0].valor_centavos>0' /tmp/payment-row.json >/dev/null
            echo 'CHECKOUT_CREATION_OK'
          else
            jq -e '.error=="infinitepay_not_configured" or .error=="public_site_url_not_configured" or .error=="checkout_creation_failed"' /tmp/checkout-result.json >/dev/null
            echo 'CHECKOUT_NOT_OPERATIONAL'
          fi

      - name: Clean up audit data
        if: always()
        shell: bash
        run: |
          set +e
          marker="$(cat /tmp/audit-marker 2>/dev/null)"
          order="$(cat /tmp/audit-order 2>/dev/null)"
          query=""
          if [ -n "$marker" ]; then
            query="$query DELETE FROM public.gsa_calculator_pro_events WHERE grant_id IN (SELECT id FROM public.gsa_calculator_pro_grants WHERE reference_id IN (SELECT id FROM public.gsa_calculator_pro_vouchers WHERE observacoes='$marker')); DELETE FROM public.gsa_calculator_pro_sessions WHERE grant_id IN (SELECT id FROM public.gsa_calculator_pro_grants WHERE reference_id IN (SELECT id FROM public.gsa_calculator_pro_vouchers WHERE observacoes='$marker')); DELETE FROM public.gsa_calculator_pro_grants WHERE reference_id IN (SELECT id FROM public.gsa_calculator_pro_vouchers WHERE observacoes='$marker'); DELETE FROM public.gsa_calculator_pro_vouchers WHERE observacoes='$marker';"
          fi
          if [ -n "$order" ]; then
            query="$query DELETE FROM public.gsa_calculator_pro_events WHERE payment_id IN (SELECT id FROM public.gsa_calculator_pro_payments WHERE order_nsu='$order'); DELETE FROM public.gsa_calculator_pro_grants WHERE reference_id IN (SELECT id FROM public.gsa_calculator_pro_payments WHERE order_nsu='$order'); DELETE FROM public.gsa_calculator_pro_payments WHERE order_nsu='$order';"
          fi
          if [ -n "$query" ]; then
            jq -n --arg query "$query" '{query:$query,read_only:false}' > /tmp/cleanup.json
            curl --silent --show-error --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header 'Content-Type: application/json' --data-binary @/tmp/cleanup.json "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" >/dev/null
          fi
