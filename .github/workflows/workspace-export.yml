name: Workspace Export

on:
  push:
    branches:
      - agent/personalidade-completa-sistema
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/personalidade-completa-sistema
          fetch-depth: 0

      - name: Assemble audited package
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/patches/personality-complete.part00 \
            .github/patches/personality-complete.part01 \
            .github/patches/personality-complete.part02 \
            .github/patches/personality-complete.part04 \
            .github/patches/personality-complete.part03 \
            .github/patches/personality-complete.part05 \
            .github/patches/personality-complete.part06 \
            > /tmp/personality-complete.patch.gz.b64
          base64 --decode /tmp/personality-complete.patch.gz.b64 > /tmp/personality-complete.patch.gz
          echo "af274e28ed2271d49863cda93148961e8e8d9b702e51cd01e9901f214922973f  /tmp/personality-complete.patch.gz" | sha256sum --check
          gzip --decompress --stdout /tmp/personality-complete.patch.gz > /tmp/personality-complete.patch

      - name: Apply implementation
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/personality-complete.patch
          git apply /tmp/personality-complete.patch

      - name: Remove temporary delivery files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patches/personality-complete.patch.gz.b64
          rm -f .github/patches/personality-complete.part*
          rm -f .github/patches/apply.trigger
          rm -f .github/workflows/apply-personality-patch.yml
          rm -f .github/workflows/workspace-export.yml
          rmdir .github/patches 2>/dev/null || true

      - name: Validate personality contracts
        run: node scripts/check-page-personality-contracts.mjs

      - name: Validate patch hygiene
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Build complete application
        run: npm run build

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gsa-hub-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Implantar personalidade completa das páginas críticas"
          git push origin HEAD:agent/personalidade-completa-sistema
