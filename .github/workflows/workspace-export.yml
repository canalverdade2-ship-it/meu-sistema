name: Workspace Export

on:
  push:
    branches:
      - agent/personalidade-completa-sistema
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/personalidade-completa-sistema
          fetch-depth: 0

      - name: Apply audited implementation
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE=.github/patches/personality-complete.patch.gz.b64
          if [ ! -f "$PACKAGE" ]; then
            echo "Implementation package already consumed."
            exit 0
          fi

          base64 --decode "$PACKAGE" > /tmp/personality-complete.patch.gz
          echo "af274e28ed2271d49863cda93148961e8e8d9b702e51cd01e9901f214922973f  /tmp/personality-complete.patch.gz" | sha256sum --check
          gzip --decompress --stdout /tmp/personality-complete.patch.gz > /tmp/personality-complete.patch
          git apply --check /tmp/personality-complete.patch
          git apply /tmp/personality-complete.patch

          rm -f "$PACKAGE" .github/patches/apply.trigger
          rm -f .github/workflows/apply-personality-patch.yml
          rm -f .github/workflows/workspace-export.yml
          rmdir .github/patches 2>/dev/null || true

          node scripts/check-page-personality-contracts.mjs
          git diff --check

      - name: Install dependencies
        if: hashFiles('.github/patches/personality-complete.patch.gz.b64') == ''
        run: npm ci

      - name: Build complete application
        if: hashFiles('.github/patches/personality-complete.patch.gz.b64') == ''
        run: npm run build

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git config user.name "gsa-hub-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Implantar personalidade completa das páginas críticas"
          git push origin HEAD:agent/personalidade-completa-sistema
