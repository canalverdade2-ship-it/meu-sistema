name: Temporary Browserslist Lock Refresh

on:
  push:
    branches:
      - "feat/gsa-tv-autopilot-v2"
    paths:
      - ".github/workflows/tmp-browserslist-lock-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Pin patched browserslist and regenerate lock
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json','utf8'));
          p.overrides ||= {};
          p.overrides.browserslist = '4.29.0';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-fund
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Commit deterministic lock refresh
        run: |
          git config user.name "gsa-tv-autopilot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
          else
            git commit -m "security: pin patched browserslist 4.29.0"
            git push origin HEAD:feat/gsa-tv-autopilot-v2
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: browserslist-lock-refresh
          if-no-files-found: error
          path: |
            package.json
            package-lock.json
          retention-days: 1
