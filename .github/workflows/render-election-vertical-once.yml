name: Render Vertical Election Program

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/render-election-vertical-once.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    environment: gsa-tv-production
    timeout-minutes: 60
    env:
      VPS_HOST: ${{ secrets.GSA_TV_VPS_HOST }}
      VPS_USER: ${{ secrets.GSA_TV_VPS_USER }}
    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.GSA_TV_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.GSA_TV_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/gsa-tv-deploy"
          chmod 600 "$HOME/.ssh/gsa-tv-deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Render on VPS
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST"             "python3 /home/opc/render-election-vertical.py"

      - name: Fetch master
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          scp -i "$HOME/.ssh/gsa-tv-deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes             "$VPS_USER@$VPS_HOST:/home/opc/gsa-news-eleicoes-vertical-work/GSA-News-Especial-Eleicoes-2026-9x16.mp4"             "artifact/GSA-News-Especial-Eleicoes-2026-9x16.mp4"
          scp -i "$HOME/.ssh/gsa-tv-deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes             "$VPS_USER@$VPS_HOST:/home/opc/gsa-news-eleicoes-vertical-work/vertical-manifest.json"             "artifact/vertical-manifest.json"
          scp -i "$HOME/.ssh/gsa-tv-deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes             "$VPS_USER@$VPS_HOST:/home/opc/gsa-news-eleicoes-vertical-work/QC-GSA-News-Especial-Eleicoes-2026-9x16.txt"             "artifact/QC-GSA-News-Especial-Eleicoes-2026-9x16.txt"

      - name: Upload master
        uses: actions/upload-artifact@v4
        with:
          name: gsa-news-eleicoes-2026-9x16
          path: artifact/*
          retention-days: 7
          compression-level: 0

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/gsa-tv-deploy" "$HOME/.ssh/known_hosts"

