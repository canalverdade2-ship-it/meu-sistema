name: Apply Calculator Pro Audit Fixes

on:
  push:
    branches: ['audit/calculadoras-pro-voucher-pagamento-20260724']
    paths: ['.github/workflows/apply-calculator-pro-audit-fixes.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/calculadoras-pro-voucher-pagamento-20260724
      - name: Fix administrative panel syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/admin/ConfiguracoesModule.tsx')
          text = path.read_text()
          old = "onChange={(event) => setMethodForm({ ...methodForm, instrucoes: event.target.value)}"
          new = "onChange={(event) => setMethodForm({ ...methodForm, instrucoes: event.target.value })}"
          if old not in text:
              raise SystemExit('configuration syntax pattern not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'GSA Audit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/components/admin/ConfiguracoesModule.tsx
          git commit -m 'Corrigir sintaxe da configuração InfinitePay'
          git push origin HEAD:audit/calculadoras-pro-voucher-pagamento-20260724
