name: Apply Calculator Pro Audit Fixes

on:
  push:
    branches: ['audit/calculadoras-pro-voucher-pagamento-20260724']
    paths: ['.github/workflows/apply-calculator-pro-audit-fixes.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/calculadoras-pro-voucher-pagamento-20260724
      - name: Bind logged client payment to account
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/gsa-free-tools-pro/index.ts')
          text = path.read_text()
          old = """          cliente_id: client?.id || null,\n          visitor_token_hash: visitorHash,\n          valor_centavos: Number(product.preco_centavos),"""
          new = """          cliente_id: client?.id || null,\n          visitor_token_hash: client?.id ? null : visitorHash,\n          valor_centavos: Number(product.preco_centavos),"""
          if old not in text:
              raise SystemExit('payment insert pattern not found')
          text = text.replace(old, new, 1)
          old = """      if (payment.visitor_token_hash && payment.visitor_token_hash !== visitorHash) {\n        return json({ success: false, error: 'payment_identity_mismatch' }, 403, allowedOrigin);\n      }"""
          new = """      if (!payment.cliente_id && payment.visitor_token_hash && payment.visitor_token_hash !== visitorHash) {\n        return json({ success: false, error: 'payment_identity_mismatch' }, 403, allowedOrigin);\n      }"""
          if old not in text:
              raise SystemExit('payment identity pattern not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'GSA Audit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/functions/gsa-free-tools-pro/index.ts
          git commit -m 'Vincular pagamento Pro de cliente à conta'
          git push origin HEAD:audit/calculadoras-pro-voucher-pagamento-20260724
