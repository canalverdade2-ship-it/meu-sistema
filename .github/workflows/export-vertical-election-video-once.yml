name: Export Vertical Election Video
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-vertical-election-video-once.yml"
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    environment: gsa-tv-production
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.GSA_TV_VPS_HOST }}
      VPS_USER: ${{ secrets.GSA_TV_VPS_USER }}
    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.GSA_TV_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.GSA_TV_VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/gsa-tv-deploy"
          chmod 600 "$HOME/.ssh/gsa-tv-deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
      - name: Fetch master
        shell: bash
        run: |
          scp -i "$HOME/.ssh/gsa-tv-deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST:/home/opc/gsa-render/GSA-News-Eleicoes-2026-vertical-9x16.mp4" ./GSA-News-Eleicoes-2026-vertical-9x16.mp4
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GSA-News-Eleicoes-2026-vertical-9x16
          path: GSA-News-Eleicoes-2026-vertical-9x16.mp4
          retention-days: 7
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/gsa-tv-deploy" "$HOME/.ssh/known_hosts"
