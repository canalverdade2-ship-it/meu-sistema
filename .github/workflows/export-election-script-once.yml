name: Export Election Broadcast Script

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-election-script-once.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    environment: gsa-tv-production
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.GSA_TV_VPS_HOST }}
      VPS_USER: ${{ secrets.GSA_TV_VPS_USER }}
    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.GSA_TV_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.GSA_TV_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/gsa-tv-deploy"
          chmod 600 "$HOME/.ssh/gsa-tv-deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Export approved script
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/gsa-tv-deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cat >/tmp/export-election.js <<'NODE'
          const fs=require("fs");
          const {Pool}=require("pg");
          const p=new Pool({connectionString:process.env.DATABASE_URL});
          (async()=>{
            const id="b11672ea-682e-4d51-bcd4-156560350f8d";
            const r=(await p.query("select output from public.gsa_tv_ai_jobs where id=$1",[id])).rows[0];
            const t=String(r?.output?.text||"");
            if(!t) throw new Error("empty generated script");
            const d="/media/1/production/autonomous/2026-10-05";
            fs.mkdirSync(d,{recursive:true});
            fs.writeFileSync(d+"/gsa-news-eleicoes-2026-final-script.txt",t,{mode:0o640});
            const spoken=[...t.matchAll(/^TEXT:\s*(.*(?:\n(?![A-Z_]+:|SCENE\s|---).*)*)/gmi)].map(m=>m[1].trim()).join("\n\n");
            fs.writeFileSync(d+"/gsa-news-eleicoes-2026-narration.txt",spoken,{mode:0o640});
            console.log("SCRIPT_CHARS="+t.length);
            console.log("SCRIPT_WORDS="+t.trim().split(/\s+/u).length);
            console.log("SCENES="+(t.match(/^SCENE\s+/gmi)||[]).length);
            console.log("NARRATION_WORDS="+(spoken.trim()?spoken.trim().split(/\s+/u).length:0));
            await p.end();
          })().catch(async e=>{console.error(e.message);try{await p.end()}catch{};process.exit(1)});
          NODE
          sudo docker exec -i gsa-tv-control-plane node </tmp/export-election.js
          rm -f /tmp/export-election.js
          echo EXPORT_OK=true
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/gsa-tv-deploy" "$HOME/.ssh/known_hosts"
