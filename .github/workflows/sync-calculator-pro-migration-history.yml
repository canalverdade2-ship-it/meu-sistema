name: Sync Calculator Pro Migration History

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sync-calculator-pro-migration-history.yml'

permissions:
  contents: read

jobs:
  inspect-history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ocgajvagxagutfvgxwsy

    steps:
      - name: Inspect migration history table
        shell: bash
        run: |
          set -euo pipefail
          query="SELECT jsonb_build_object('columns',(SELECT jsonb_agg(jsonb_build_object('name',column_name,'type',data_type,'nullable',is_nullable) ORDER BY ordinal_position) FROM information_schema.columns WHERE table_schema='supabase_migrations' AND table_name='schema_migrations'),'calculator_versions',(SELECT COALESCE(jsonb_agg(to_jsonb(m) ORDER BY version),'[]'::jsonb) FROM supabase_migrations.schema_migrations m WHERE version IN ('20260723233000','20260723233500','20260723234000','20260724113000','20260724130000'))) AS history;"
          jq -n --arg query "$query" '{query: $query, read_only: true}' > /tmp/payload.json
          status="$(curl --silent --show-error --output /tmp/result.json --write-out '%{http_code}' --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header 'Content-Type: application/json' --data-binary @/tmp/payload.json "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query")"
          echo "HTTP_STATUS=$status"
          jq -c . /tmp/result.json
          test "$status" = '201'
