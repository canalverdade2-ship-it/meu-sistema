name: Sync Calculator Pro Migration History

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sync-calculator-pro-migration-history.yml'

permissions:
  contents: read

jobs:
  register-and-verify-history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ocgajvagxagutfvgxwsy

    steps:
      - name: Register Calculator Pro migrations in remote history
        shell: bash
        run: |
          set -euo pipefail
          query="INSERT INTO supabase_migrations.schema_migrations (version, statements, name, created_by) VALUES ('20260723233000', ARRAY[]::text[], 'free_tools_pro_access', 'github-actions'), ('20260723233500', ARRAY[]::text[], 'free_tools_pro_service_permissions', 'github-actions'), ('20260723234000', ARRAY[]::text[], 'free_tools_pro_hardening', 'github-actions'), ('20260724113000', ARRAY[]::text[], 'simplify_calculator_pro_eligibility_and_public_promotions', 'github-actions'), ('20260724130000', ARRAY[]::text[], 'repair_calculator_pro_products', 'github-actions') ON CONFLICT (version) DO UPDATE SET name = EXCLUDED.name, created_by = EXCLUDED.created_by;"
          jq -n --arg query "$query" '{query: $query, read_only: false}' > /tmp/payload.json
          status="$(curl --silent --show-error --output /tmp/write-result.json --write-out '%{http_code}' --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header 'Content-Type: application/json' --data-binary @/tmp/payload.json "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query")"
          echo "WRITE_HTTP_STATUS=$status"
          jq -c . /tmp/write-result.json || cat /tmp/write-result.json
          test "$status" = '201'

      - name: Verify five migration history entries
        shell: bash
        run: |
          set -euo pipefail
          query="SELECT version, name, created_by FROM supabase_migrations.schema_migrations WHERE version IN ('20260723233000','20260723233500','20260723234000','20260724113000','20260724130000') ORDER BY version;"
          jq -n --arg query "$query" '{query: $query, read_only: true}' > /tmp/payload.json
          status="$(curl --silent --show-error --output /tmp/result.json --write-out '%{http_code}' --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header 'Content-Type: application/json' --data-binary @/tmp/payload.json "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query")"
          echo "READ_HTTP_STATUS=$status"
          jq -c . /tmp/result.json
          test "$status" = '201'
          test "$(jq 'length' /tmp/result.json)" = '5'
          test "$(jq -r 'map(.version) | join(",")' /tmp/result.json)" = '20260723233000,20260723233500,20260723234000,20260724113000,20260724130000'
          echo 'CALCULATOR_PRO_MIGRATION_HISTORY_SYNCED'
