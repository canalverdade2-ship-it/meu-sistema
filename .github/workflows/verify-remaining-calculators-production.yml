name: Verify Remaining Calculators Production

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/verify-remaining-calculators-production.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ocgajvagxagutfvgxwsy
    steps:
      - name: Load public key
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys" > /tmp/keys.json
          jq -r '.[] | select(.name=="anon") | .api_key' /tmp/keys.json > /tmp/anon-key
          test -s /tmp/anon-key

      - name: Verify six products and migration separately
        shell: bash
        run: |
          set -euo pipefail
          query="SELECT tool_id,nome,ativo,preco_centavos,duracao_acesso_minutos FROM public.gsa_calculator_pro_products WHERE tool_id IN ('termination','retirement','vacation','thirteenth','benefits','bpc') ORDER BY tool_id;"
          jq -n --arg query "$query" '{query:$query,read_only:true}' > /tmp/products.json
          curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header 'Content-Type: application/json' --data-binary @/tmp/products.json "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" > /tmp/products-result.json
          jq -c . /tmp/products-result.json
          test "$(jq 'length' /tmp/products-result.json)" = '6'
          jq -e 'all(.[]; .ativo == true and .preco_centavos >= 0 and .duracao_acesso_minutos >= 15)' /tmp/products-result.json >/dev/null
          jq -e '[.[].tool_id] | sort == ["benefits","bpc","retirement","termination","thirteenth","vacation"]' /tmp/products-result.json >/dev/null

          query="SELECT count(*)::integer AS migration_count FROM supabase_migrations.schema_migrations WHERE version='20260724193000';"
          jq -n --arg query "$query" '{query:$query,read_only:true}' > /tmp/history.json
          curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header 'Content-Type: application/json' --data-binary @/tmp/history.json "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" > /tmp/history-result.json
          jq -c . /tmp/history-result.json
          jq -e '.[0].migration_count==1' /tmp/history-result.json >/dev/null

      - name: Verify three new public tools
        shell: bash
        run: |
          set -euo pipefail
          anon="$(cat /tmp/anon-key)"
          for tool in thirteenth benefits bpc; do
            visitor="gsa_${tool}_${GITHUB_RUN_ID}_12345678901234567890"
            jq -n --arg tool "$tool" --arg visitor "$visitor" '{action:"status",payload:{tool_id:$tool,visitor_token:$visitor}}' > "/tmp/${tool}.json"
            curl --fail-with-body --silent --show-error --request POST --header "apikey: $anon" --header "Authorization: Bearer $anon" --header 'Content-Type: application/json' --header 'Origin: http://localhost:3000' --data-binary @"/tmp/${tool}.json" "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/gsa-free-tools-pro" > "/tmp/${tool}-result.json"
            jq -c . "/tmp/${tool}-result.json"
            jq -e --arg tool "$tool" '.success==true and .available==true and .product.tool_id==$tool' "/tmp/${tool}-result.json" >/dev/null
          done

      - name: Verify 13th salary voucher and session
        shell: bash
        run: |
          set -euo pipefail
          anon="$(cat /tmp/anon-key)"
          marker="AUDIT_NEW_TOOLS_${GITHUB_RUN_ID}"
          code="GSA-PRO-$(openssl rand -hex 10 | tr '[:lower:]' '[:upper:]')"
          hash="$(printf '%s' "$code" | sha256sum | awk '{print $1}')"
          hint="${code: -6}"
          visitor="gsa_thirteenth_voucher_${GITHUB_RUN_ID}_12345678901234567890"
          query="INSERT INTO public.gsa_calculator_pro_vouchers(code_hash,code_hint,tool_id,status,expires_at,observacoes) VALUES ('$hash','$hint','thirteenth','active',now()+interval '1 hour','$marker') RETURNING id;"
          jq -n --arg query "$query" '{query:$query,read_only:false}' > /tmp/voucher.json
          curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header 'Content-Type: application/json' --data-binary @/tmp/voucher.json "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" > /tmp/voucher-result.json
          echo "$marker" > /tmp/marker
          jq -e '(.[0].id|length)>20' /tmp/voucher-result.json >/dev/null

          jq -n --arg code "$code" --arg visitor "$visitor" '{action:"redeem_voucher",payload:{tool_id:"thirteenth",visitor_token:$visitor,code:$code}}' > /tmp/redeem.json
          curl --fail-with-body --silent --show-error --request POST --header "apikey: $anon" --header "Authorization: Bearer $anon" --header 'Content-Type: application/json' --header 'Origin: http://localhost:3000' --data-binary @/tmp/redeem.json "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/gsa-free-tools-pro" > /tmp/redeem-result.json
          jq -c . /tmp/redeem-result.json
          jq -e '.success==true and .session.success==true and .session.source=="voucher" and (.session.token|length)>20' /tmp/redeem-result.json >/dev/null
          token="$(jq -r '.session.token' /tmp/redeem-result.json)"

          jq -n --arg visitor "$visitor" --arg token "$token" '{action:"status",payload:{tool_id:"thirteenth",visitor_token:$visitor,pro_session_token:$token}}' > /tmp/status.json
          curl --fail-with-body --silent --show-error --request POST --header "apikey: $anon" --header "Authorization: Bearer $anon" --header 'Content-Type: application/json' --header 'Origin: http://localhost:3000' --data-binary @/tmp/status.json "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/gsa-free-tools-pro" > /tmp/status-result.json
          jq -c . /tmp/status-result.json
          jq -e '.access==true and .source=="voucher" and .product.tool_id=="thirteenth"' /tmp/status-result.json >/dev/null

      - name: Verify safe checkout state
        shell: bash
        run: |
          set -euo pipefail
          anon="$(cat /tmp/anon-key)"
          visitor="gsa_bpc_checkout_${GITHUB_RUN_ID}_12345678901234567890"
          jq -n --arg visitor "$visitor" '{action:"create_checkout",payload:{tool_id:"bpc",visitor_token:$visitor}}' > /tmp/checkout.json
          http="$(curl --silent --show-error --output /tmp/checkout-result.json --write-out '%{http_code}' --request POST --header "apikey: $anon" --header "Authorization: Bearer $anon" --header 'Content-Type: application/json' --header 'Origin: http://localhost:3000' --data-binary @/tmp/checkout.json "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/gsa-free-tools-pro")"
          jq -c . /tmp/checkout-result.json
          test "$http" = '503'
          jq -e '.error=="infinitepay_not_configured"' /tmp/checkout-result.json >/dev/null
          echo 'REMAINING_CALCULATORS_PRODUCTION_OK'

      - name: Cleanup voucher test
        if: always()
        shell: bash
        run: |
          set +e
          marker="$(cat /tmp/marker 2>/dev/null)"
          if [ -n "$marker" ]; then
            query="DELETE FROM public.gsa_calculator_pro_events WHERE grant_id IN (SELECT g.id FROM public.gsa_calculator_pro_grants g JOIN public.gsa_calculator_pro_vouchers v ON v.id=g.reference_id WHERE v.observacoes='$marker'); DELETE FROM public.gsa_calculator_pro_sessions WHERE grant_id IN (SELECT g.id FROM public.gsa_calculator_pro_grants g JOIN public.gsa_calculator_pro_vouchers v ON v.id=g.reference_id WHERE v.observacoes='$marker'); DELETE FROM public.gsa_calculator_pro_grants WHERE reference_id IN (SELECT id FROM public.gsa_calculator_pro_vouchers WHERE observacoes='$marker'); DELETE FROM public.gsa_calculator_pro_vouchers WHERE observacoes='$marker';"
            jq -n --arg query "$query" '{query:$query,read_only:false}' > /tmp/cleanup.json
            curl --silent --show-error --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header 'Content-Type: application/json' --data-binary @/tmp/cleanup.json "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" >/dev/null
          fi
