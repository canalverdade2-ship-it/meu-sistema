name: Diagnose Calculator Pro TypeScript

on:
  push:
    branches: ['audit/calculadoras-pro-voucher-pagamento-20260724']
    paths: ['.github/workflows/diagnose-calculator-pro-typescript.yml']

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/calculadoras-pro-voucher-pagamento-20260724
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --silent
      - name: Capture TypeScript result
        shell: bash
        run: |
          set +e
          npx tsc --noEmit > /tmp/tsc-result.txt 2>&1
          status=$?
          if [ "$status" = '0' ]; then echo 'TYPESCRIPT_OK' > /tmp/tsc-result.txt; fi
          mkdir -p docs/audit
          cp /tmp/tsc-result.txt docs/audit/calculator-pro-typescript-result.txt
          git config user.name 'GSA Audit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/audit/calculator-pro-typescript-result.txt
          git commit -m 'Registrar diagnóstico TypeScript das Calculadoras Pro'
          git push origin HEAD:audit/calculadoras-pro-voucher-pagamento-20260724
          exit "$status"
