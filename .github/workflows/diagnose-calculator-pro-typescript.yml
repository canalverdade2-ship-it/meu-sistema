name: Validate Calculator Pro Audit

on:
  push:
    branches: ['audit/calculadoras-pro-voucher-pagamento-20260724']
    paths: ['.github/workflows/diagnose-calculator-pro-typescript.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/calculadoras-pro-voucher-pagamento-20260724
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci --silent
      - name: Run and record complete validation
        shell: bash
        run: |
          set +e
          mkdir -p docs/audit /tmp/calculator-pro-validation
          result='docs/audit/calculator-pro-validation-result.txt'
          : > "$result"
          overall=0

          run_check() {
            name="$1"
            shift
            log="/tmp/calculator-pro-validation/${name}.log"
            "$@" > "$log" 2>&1
            status=$?
            if [ "$status" = '0' ]; then
              echo "${name}=OK" >> "$result"
            else
              echo "${name}=FAIL" >> "$result"
              echo "--- ${name} ---" >> "$result"
              tail -80 "$log" >> "$result"
              overall=1
            fi
          }

          run_check TYPESCRIPT npx tsc --noEmit
          run_check FREE_PRO_CONTRACTS npm run test:free-tools
          run_check SECURITY_CONTRACTS npx tsx scripts/check-free-tools-pro-security-contracts.ts
          run_check PANEL_CONTRACTS npx tsx scripts/check-calculator-pro-panel-contracts.ts
          run_check PUBLIC_API_DENO deno check supabase/functions/gsa-free-tools-pro/index.ts
          run_check WEBHOOK_DENO deno check supabase/functions/gsa-free-tools-pro-webhook/index.ts
          run_check PRODUCTION_BUILD npm run build

          git config user.name 'GSA Audit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$result"
          if ! git diff --cached --quiet; then
            git commit -m 'Registrar validação completa das Calculadoras Pro'
            git push origin HEAD:audit/calculadoras-pro-voucher-pagamento-20260724
          fi
          cat "$result"
          exit "$overall"
