name: GSA TV Autopilot V2 Runtime

on:
  push:
    branches:
      - "feat/gsa-tv-autopilot-v2"
    paths:
      - ".github/workflows/gsa-tv-autopilot-runtime.yml"
      - "infrastructure/gsa-tv/scripts/autopilot-runtime-preflight.sh"
      - "infrastructure/gsa-tv/scripts/deploy-autopilot-v2.sh"
      - "infrastructure/gsa-tv/scripts/cutover-autopilot-v2.sh"
      - "infrastructure/gsa-tv/scripts/snapshot-legacy-ffplayout.sh"
      - "infrastructure/gsa-tv/services/playout-api/**"
      - "infrastructure/gsa-tv/services/encoder-engine/**"
      - "infrastructure/gsa-tv/systemd/gsa-tv-autopilot-**"
  workflow_dispatch:
    inputs:
      operation:
        description: "Operação"
        required: true
        type: choice
        options:
          - preflight
          - legacy-snapshot
          - prepare-first-migration
          - deploy
          - cutover
      cutover_scope:
        description: "Escopo do cutover legado"
        required: true
        type: choice
        options:
          - broadcast
          - production
          - all
      confirm_cutover_policy:
        description: "Para cutover, digite CUTOVER-GUARD"
        required: false
        type: string
      confirm_first_migration_policy:
        description: "Digite OFFAIR-GUARD para confirmar que o workflow nunca deve desligar o canal automaticamente"
        required: true
        type: string
      confirm_legacy_snapshot_policy:
        description: "Para legacy-snapshot, digite SNAPSHOT-GUARD"
        required: false
        type: string
      confirm_prepare_policy:
        description: "Para prepare-first-migration, digite PREPARE-FIRST-MIGRATION"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: gsa-tv-autopilot-production
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: ubuntu-latest
    environment: gsa-tv-production
    timeout-minutes: 60
    env:
      VPS_HOST: ${{ secrets.GSA_TV_VPS_HOST }}
      VPS_USER: ${{ secrets.GSA_TV_VPS_USER }}
      RUNTIME_OPERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'preflight' }}
      RUNTIME_CONFIRM_POLICY: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_first_migration_policy || 'OFFAIR-GUARD' }}
      RUNTIME_CUTOVER_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.cutover_scope || 'all' }}
      RUNTIME_CUTOVER_CONFIRM_POLICY: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_cutover_policy || '' }}
      RUNTIME_SNAPSHOT_CONFIRM_POLICY: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_legacy_snapshot_policy || '' }}
      RUNTIME_PREPARE_CONFIRM_POLICY: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_prepare_policy || '' }}
      EXPECTED_PROJECT_ID: ocgajvagxagutfvgxwsy
    steps:
      - uses: actions/checkout@v4

      - name: Guard operation contract
        id: guard
        shell: bash
        env:
          VPS_SSH_KEY_PRESENT: ${{ secrets.GSA_TV_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS_PRESENT: ${{ secrets.GSA_TV_VPS_KNOWN_HOSTS }}
          SUPABASE_ACCESS_TOKEN_PRESENT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD_PRESENT: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID_PRESENT: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          test "${RUNTIME_CONFIRM_POLICY}" = "OFFAIR-GUARD" || {
            echo "Confirmação inválida. O deploy nunca deve desligar a transmissão automaticamente." >&2
            exit 64
          }

          missing=()
          [ -n "${VPS_HOST:-}" ] || missing+=("GSA_TV_VPS_HOST")
          [ -n "${VPS_USER:-}" ] || missing+=("GSA_TV_VPS_USER")
          [ "${#VPS_SSH_KEY_PRESENT}" -ge 100 ] || missing+=("GSA_TV_VPS_SSH_KEY")
          [ "${#VPS_KNOWN_HOSTS_PRESENT}" -ge 20 ] || missing+=("GSA_TV_VPS_KNOWN_HOSTS")

          if [ "${#missing[@]}" -gt 0 ]; then
            if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${RUNTIME_OPERATION}" = "preflight" ]; then
              echo "runtime_configured=false" >> "$GITHUB_OUTPUT"
              echo "RUNTIME_PREFLIGHT_SKIPPED=missing_environment_secrets"
              printf 'Missing runtime secret: %s\n' "${missing[@]}"
              exit 0
            fi
            printf 'Secret obrigatório ausente/inválido: %s\n' "${missing[@]}" >&2
            exit 78
          fi

          echo "runtime_configured=true" >> "$GITHUB_OUTPUT"
          if [ "${RUNTIME_OPERATION}" = "deploy" ] || [ "${RUNTIME_OPERATION}" = "cutover" ]; then
            if [ "${GITHUB_REF_NAME}" != "main" ]; then
              echo "Operação mutante de deploy/cutover permitida somente a partir da branch main." >&2
              exit 65
            fi
          fi

          if [ "${RUNTIME_OPERATION}" = "legacy-snapshot" ]; then
            if [ "${RUNTIME_SNAPSHOT_CONFIRM_POLICY}" != "SNAPSHOT-GUARD" ]; then
              echo "Snapshot legado exige confirmação explícita SNAPSHOT-GUARD." >&2
              exit 64
            fi
            if [ "${GITHUB_REF_NAME}" != "feat/gsa-tv-autopilot-v2" ] && [ "${GITHUB_REF_NAME}" != "main" ]; then
              echo "Snapshot legado permitido somente na branch de rollout ou main." >&2
              exit 65
            fi
          fi

          if [ "${RUNTIME_OPERATION}" = "prepare-first-migration" ]; then
            if [ "${RUNTIME_PREPARE_CONFIRM_POLICY}" != "PREPARE-FIRST-MIGRATION" ]; then
              echo "Preparação da primeira migração exige PREPARE-FIRST-MIGRATION." >&2
              exit 64
            fi
            if [ "${GITHUB_REF_NAME}" != "feat/gsa-tv-autopilot-v2" ] && [ "${GITHUB_REF_NAME}" != "main" ]; then
              echo "Preparação permitida somente na branch de rollout ou main." >&2
              exit 65
            fi
            prep_missing=()
            [ -n "${SUPABASE_ACCESS_TOKEN_PRESENT:-}" ] || prep_missing+=("SUPABASE_ACCESS_TOKEN")
            [ -n "${SUPABASE_DB_PASSWORD_PRESENT:-}" ] || prep_missing+=("SUPABASE_DB_PASSWORD")
            [ -n "${SUPABASE_PROJECT_ID_PRESENT:-}" ] || prep_missing+=("SUPABASE_PROJECT_ID")
            if [ "${#prep_missing[@]}" -gt 0 ]; then
              printf 'Secret Supabase obrigatório ausente: %s\n' "${prep_missing[@]}" >&2
              exit 78
            fi
            if [ "${SUPABASE_PROJECT_ID_PRESENT}" != "${EXPECTED_PROJECT_ID}" ]; then
              echo "Project ref Supabase não corresponde ao projeto autorizado." >&2
              exit 79
            fi
          fi

          if [ "${RUNTIME_OPERATION}" = "cutover" ] && [ "${RUNTIME_CUTOVER_CONFIRM_POLICY}" != "CUTOVER-GUARD" ]; then
            echo "Cutover exige confirmação explícita CUTOVER-GUARD." >&2
            exit 64
          fi

      - name: Configure SSH with pinned host key
        if: ${{ steps.guard.outputs.runtime_configured == 'true' }}
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.GSA_TV_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.GSA_TV_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "${#VPS_SSH_KEY}" -ge 100 || {
            echo "Secret obrigatório ausente/inválido: GSA_TV_VPS_SSH_KEY" >&2
            exit 78
          }
          test "${#VPS_KNOWN_HOSTS}" -ge 20 || {
            echo "Secret obrigatório ausente/inválido: GSA_TV_VPS_KNOWN_HOSTS" >&2
            exit 78
          }
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/gsa-tv-deploy"
          chmod 0600 "$HOME/.ssh/gsa-tv-deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Verify SSH identity and remote prerequisites
        if: ${{ steps.guard.outputs.runtime_configured == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'set -e; hostname; command -v sudo; command -v docker; sudo -n true; docker --version; sudo docker compose version'

      - name: Runtime preflight
        if: ${{ steps.guard.outputs.runtime_configured == 'true' }}
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'sudo bash -s' \
            < infrastructure/gsa-tv/scripts/autopilot-runtime-preflight.sh \
            | tee "$RUNNER_TEMP/gsa-tv-preflight.txt"
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

          if [ "${RUNTIME_OPERATION}" = "cutover" ] && [ "$rc" -ne 0 ]; then
            echo "Cutover exige preflight EXTERNAL_READY (exit 0); recebido rc=$rc." >&2
            exit "$rc"
          fi
          if [ "${RUNTIME_OPERATION}" = "deploy" ] && [ "$rc" -eq 20 ]; then
            echo "Preflight encontrou runtime bloqueado/parcial." >&2
            exit 20
          fi
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 10 ] && [ "$rc" -ne 20 ]; then
            exit "$rc"
          fi

      - name: Stop after read-only preflight
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && env.RUNTIME_OPERATION == 'preflight' }}
        run: |
          echo "Preflight concluído por stdin. Nenhum arquivo de release foi criado na VPS."

      - name: Legacy ffplayout snapshot dry-run
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && env.RUNTIME_OPERATION == 'legacy-snapshot' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'sudo bash -s' \
            < infrastructure/gsa-tv/scripts/snapshot-legacy-ffplayout.sh

      - name: Legacy ffplayout snapshot apply
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && env.RUNTIME_OPERATION == 'legacy-snapshot' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'sudo bash -s -- --apply' \
            < infrastructure/gsa-tv/scripts/snapshot-legacy-ffplayout.sh

      - name: Post-snapshot evidence
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && env.RUNTIME_OPERATION == 'legacy-snapshot' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'sudo bash -s -- --verify-latest' \
            < infrastructure/gsa-tv/scripts/snapshot-legacy-ffplayout.sh

      - name: Package immutable runtime source
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && env.RUNTIME_OPERATION == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gsa-tv-runtime"
          mkdir -p "$dir"
          tar -C "$GITHUB_WORKSPACE" -czf "$dir/source.tgz" \
            infrastructure/gsa-tv \
            docs/gsa-tv-secret-rotation.md \
            supabase/migrations/20260922131000_gsa_tv_autopilot_compile_gate.sql \
            supabase/migrations/20260922132000_gsa_tv_autopilot_duration_swap.sql \
            supabase/migrations/20260922134000_gsa_tv_autopilot_continuity_fallback.sql \
            supabase/migrations/20260922135000_gsa_tv_cinema_duration_contract.sql \
            supabase/migrations/20260922136000_gsa_tv_resolved_production_signature.sql
          (cd "$dir" && sha256sum source.tgz > source.sha256)
          cat "$dir/source.sha256"

      - name: Upload immutable release source
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && env.RUNTIME_OPERATION == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          remote="/opt/gsa-tv/releases/source-${GITHUB_SHA}"
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo install -d -m 0755 '$remote' && sudo chown \"\$(id -u)\":\"\$(id -g)\" '$remote'"
          scp -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/gsa-tv-runtime/source.tgz" \
            "$RUNNER_TEMP/gsa-tv-runtime/source.sha256" \
            "$VPS_USER@$VPS_HOST:$remote/"
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "set -e; cd '$remote'; sha256sum -c source.sha256; tar -xzf source.tgz; chmod -R go-w ."

      - name: Guarded deploy dry-run
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && env.RUNTIME_OPERATION == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          remote="/opt/gsa-tv/releases/source-${GITHUB_SHA}"
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo bash '$remote/infrastructure/gsa-tv/scripts/deploy-autopilot-v2.sh'"

      - name: Guarded deploy apply
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && env.RUNTIME_OPERATION == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          remote="/opt/gsa-tv/releases/source-${GITHUB_SHA}"
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo bash '$remote/infrastructure/gsa-tv/scripts/deploy-autopilot-v2.sh' --apply"

      - name: Post-deploy evidence
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && env.RUNTIME_OPERATION == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'set -e;
             echo "--- preflight ---";
             sudo /opt/gsa-tv/bin/autopilot-runtime-preflight.sh;
             echo "--- containers ---";
             sudo docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}" | grep "gsa-tv-";
             echo "--- timers ---";
             sudo systemctl list-timers --all --no-pager | grep "gsa-tv-autopilot";
             echo "--- readiness ---";
             sudo test -s /opt/gsa-tv/runtime/autopilot/readiness-horizon.json;
             sudo python3 -c "import json; x=json.load(open('/opt/gsa-tv/runtime/autopilot/readiness-horizon.json')); print(json.dumps({'generated_at':x.get('generated_at'),'ready_days':x.get('ready_days'),'days':x.get('days')},ensure_ascii=False))"'

      - name: Guarded cutover dry-run
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && env.RUNTIME_OPERATION == 'cutover' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo bash -s -- --scope=${RUNTIME_CUTOVER_SCOPE}" \
            < infrastructure/gsa-tv/scripts/cutover-autopilot-v2.sh

      - name: Guarded cutover apply
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && env.RUNTIME_OPERATION == 'cutover' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo bash -s -- --apply --scope=${RUNTIME_CUTOVER_SCOPE}" \
            < infrastructure/gsa-tv/scripts/cutover-autopilot-v2.sh

      - name: Post-cutover evidence
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && env.RUNTIME_OPERATION == 'cutover' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'set -e;
             echo "--- autopilot timers ---";
             sudo systemctl list-timers --all --no-pager | grep "gsa-tv-autopilot" || true;
             echo "--- legacy timers ---";
             sudo systemctl list-timers --all --no-pager | grep -E "gsa-tv-(morning-start|signoff|night-factory)" || true;
             echo "--- failed units ---";
             sudo systemctl --failed --no-pager | grep -i "gsa-tv" || true'

      - name: Remove local SSH material
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/gsa-tv-deploy" "$HOME/.ssh/known_hosts"
