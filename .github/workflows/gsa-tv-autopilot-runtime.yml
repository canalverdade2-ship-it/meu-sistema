name: GSA TV Autopilot V2 Runtime

on:
  push:
    branches:
      - "feat/gsa-tv-autopilot-v2"
    paths:
      - ".github/workflows/gsa-tv-autopilot-runtime.yml"
      - "infrastructure/gsa-tv/scripts/autopilot-runtime-preflight.sh"
      - "infrastructure/gsa-tv/scripts/deploy-autopilot-v2.sh"
      - "infrastructure/gsa-tv/scripts/cutover-autopilot-v2.sh"
      - "infrastructure/gsa-tv/scripts/snapshot-legacy-ffplayout.sh"
      - "infrastructure/gsa-tv/scripts/reconcile-stale-offair-state.sh"
      - "infrastructure/gsa-tv/scripts/recover-local-media-cache.sh"
      - "infrastructure/gsa-tv/scripts/autopilot-migration-status.sh"
      - "infrastructure/gsa-tv/scripts/apply-autopilot-migration.sh"
      - "infrastructure/gsa-tv/scripts/backup-full.sh"
      - "supabase/migrations/20260922131000_gsa_tv_autopilot_compile_gate.sql"
      - "supabase/migrations/20260922132000_gsa_tv_autopilot_duration_swap.sql"
      - "supabase/migrations/20260922134000_gsa_tv_autopilot_continuity_fallback.sql"
      - "supabase/migrations/20260922135000_gsa_tv_cinema_duration_contract.sql"
      - "supabase/migrations/20260922136000_gsa_tv_resolved_production_signature.sql"
      - "infrastructure/gsa-tv/services/playout-api/**"
      - "infrastructure/gsa-tv/services/encoder-engine/**"
      - "infrastructure/gsa-tv/systemd/gsa-tv-autopilot-**"
  workflow_dispatch:
    inputs:
      operation:
        description: "Operação"
        required: true
        type: choice
        options:
          - preflight
          - legacy-snapshot
          - prepare-first-migration
          - deploy-dry-run
          - deploy
          - cutover
      cutover_scope:
        description: "Escopo do cutover legado"
        required: true
        type: choice
        options:
          - broadcast
          - production
          - all
      confirm_cutover_policy:
        description: "Para cutover, digite CUTOVER-GUARD"
        required: false
        type: string
      confirm_first_migration_policy:
        description: "Digite OFFAIR-GUARD para confirmar que o workflow nunca deve desligar o canal automaticamente"
        required: true
        type: string
      confirm_legacy_snapshot_policy:
        description: "Para legacy-snapshot, digite SNAPSHOT-GUARD"
        required: false
        type: string
      confirm_prepare_policy:
        description: "Para prepare-first-migration, digite PREPARE-FIRST-MIGRATION"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: gsa-tv-autopilot-production
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: ubuntu-latest
    environment: gsa-tv-production
    timeout-minutes: 60
    env:
      VPS_HOST: ${{ secrets.GSA_TV_VPS_HOST }}
      VPS_USER: ${{ secrets.GSA_TV_VPS_USER }}
      RUNTIME_OPERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'preflight' }}
      RUNTIME_CONFIRM_POLICY: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_first_migration_policy || 'OFFAIR-GUARD' }}
      RUNTIME_CUTOVER_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.cutover_scope || 'all' }}
      RUNTIME_CUTOVER_CONFIRM_POLICY: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_cutover_policy || '' }}
      RUNTIME_SNAPSHOT_CONFIRM_POLICY: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_legacy_snapshot_policy || '' }}
      RUNTIME_PREPARE_CONFIRM_POLICY: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_prepare_policy || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard operation contract
        id: guard
        shell: bash
        env:
          VPS_SSH_KEY_PRESENT: ${{ secrets.GSA_TV_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS_PRESENT: ${{ secrets.GSA_TV_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "${RUNTIME_CONFIRM_POLICY}" = "OFFAIR-GUARD" || {
            echo "Confirmação inválida. O deploy nunca deve desligar a transmissão automaticamente." >&2
            exit 64
          }

          missing=()
          [ -n "${VPS_HOST:-}" ] || missing+=("GSA_TV_VPS_HOST")
          [ -n "${VPS_USER:-}" ] || missing+=("GSA_TV_VPS_USER")
          [ "${#VPS_SSH_KEY_PRESENT}" -ge 100 ] || missing+=("GSA_TV_VPS_SSH_KEY")
          [ "${#VPS_KNOWN_HOSTS_PRESENT}" -ge 20 ] || missing+=("GSA_TV_VPS_KNOWN_HOSTS")

          if [ "${#missing[@]}" -gt 0 ]; then
            if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${RUNTIME_OPERATION}" = "preflight" ]; then
              echo "runtime_configured=false" >> "$GITHUB_OUTPUT"
              echo "RUNTIME_PREFLIGHT_SKIPPED=missing_environment_secrets"
              printf 'Missing runtime secret: %s\n' "${missing[@]}"
              exit 0
            fi
            printf 'Secret obrigatório ausente/inválido: %s\n' "${missing[@]}" >&2
            exit 78
          fi

          echo "runtime_configured=true" >> "$GITHUB_OUTPUT"
          if [ "${RUNTIME_OPERATION}" = "deploy-dry-run" ] &&
             [ "${GITHUB_REF_NAME}" != "feat/gsa-tv-autopilot-v2" ] &&
             [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Dry-run permitido somente na branch de rollout ou main." >&2
            exit 65
          fi
          if [ "${RUNTIME_OPERATION}" = "deploy" ] || [ "${RUNTIME_OPERATION}" = "cutover" ]; then
            if [ "${GITHUB_REF_NAME}" != "main" ]; then
              echo "Operação mutante de deploy/cutover permitida somente a partir da branch main." >&2
              exit 65
            fi
          fi

          if [ "${RUNTIME_OPERATION}" = "legacy-snapshot" ]; then
            if [ "${RUNTIME_SNAPSHOT_CONFIRM_POLICY}" != "SNAPSHOT-GUARD" ]; then
              echo "Snapshot legado exige confirmação explícita SNAPSHOT-GUARD." >&2
              exit 64
            fi
            if [ "${GITHUB_REF_NAME}" != "feat/gsa-tv-autopilot-v2" ] && [ "${GITHUB_REF_NAME}" != "main" ]; then
              echo "Snapshot legado permitido somente na branch de rollout ou main." >&2
              exit 65
            fi
          fi

          if [ "${RUNTIME_OPERATION}" = "prepare-first-migration" ]; then
            if [ "${RUNTIME_PREPARE_CONFIRM_POLICY}" != "PREPARE-FIRST-MIGRATION" ]; then
              echo "Preparação da primeira migração exige PREPARE-FIRST-MIGRATION." >&2
              exit 64
            fi
            if [ "${GITHUB_REF_NAME}" != "feat/gsa-tv-autopilot-v2" ] && [ "${GITHUB_REF_NAME}" != "main" ]; then
              echo "Preparação permitida somente na branch de rollout ou main." >&2
              exit 65
            fi
            echo "PREPARE_DB_TARGET=self_hosted_vps"
          fi

          if [ "${RUNTIME_OPERATION}" = "cutover" ] && [ "${RUNTIME_CUTOVER_CONFIRM_POLICY}" != "CUTOVER-GUARD" ]; then
            echo "Cutover exige confirmação explícita CUTOVER-GUARD." >&2
            exit 64
          fi

      - name: Configure SSH with pinned host key
        if: ${{ steps.guard.outputs.runtime_configured == 'true' }}
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.GSA_TV_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.GSA_TV_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "${#VPS_SSH_KEY}" -ge 100 || {
            echo "Secret obrigatório ausente/inválido: GSA_TV_VPS_SSH_KEY" >&2
            exit 78
          }
          test "${#VPS_KNOWN_HOSTS}" -ge 20 || {
            echo "Secret obrigatório ausente/inválido: GSA_TV_VPS_KNOWN_HOSTS" >&2
            exit 78
          }
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/gsa-tv-deploy"
          chmod 0600 "$HOME/.ssh/gsa-tv-deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Verify SSH identity and remote prerequisites
        if: ${{ steps.guard.outputs.runtime_configured == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'set -e; hostname; command -v sudo; command -v docker; sudo -n true; docker --version; sudo docker compose version'

      - name: Runtime preflight
        if: ${{ steps.guard.outputs.runtime_configured == 'true' }}
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'sudo bash -s' \
            < infrastructure/gsa-tv/scripts/autopilot-runtime-preflight.sh \
            | tee "$RUNNER_TEMP/gsa-tv-preflight.txt"
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

          if [ "${RUNTIME_OPERATION}" = "cutover" ] && [ "$rc" -ne 0 ]; then
            echo "Cutover exige preflight EXTERNAL_READY (exit 0); recebido rc=$rc." >&2
            exit "$rc"
          fi
          if { [ "${RUNTIME_OPERATION}" = "deploy" ] || [ "${RUNTIME_OPERATION}" = "deploy-dry-run" ]; } && [ "$rc" -eq 20 ]; then
            file="$RUNNER_TEMP/gsa-tv-preflight.txt"
            # An absent Control Plane is installable only after verified preparation.
            grep -qx 'STATUS=CONTROL_PLANE_MISSING' "$file"
            if grep -qx 'STATUS=BLOCKED' "$file"; then
              echo "Preflight encontrou runtime bloqueado." >&2
              exit 20
            fi
            grep -qx 'PHYSICAL_OFF_AIR_EVIDENCE=true' "$file"
            grep -qx 'FIRST_MIGRATION_OFFAIR_READY=true' "$file"
            grep -qx 'AUTOPILOT_DB_CONTRACT_READY=true' "$file"
            grep -qx 'AUTOPILOT_MIGRATION_COUNT=5' "$file"
            grep -qx 'LATEST_BACKUP_STATE=restored_test' "$file"
            grep -qx 'LATEST_BACKUP_MANIFEST_OK=true' "$file"
            grep -qx 'MISSING_PATHS=none' "$file"
          fi
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 10 ] && [ "$rc" -ne 20 ]; then
            exit "$rc"
          fi

      - name: Read-only migration status smoke
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && env.RUNTIME_OPERATION == 'preflight' }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'sudo bash -s' \
            < infrastructure/gsa-tv/scripts/autopilot-migration-status.sh \
            | tee "$RUNNER_TEMP/gsa-tv-migration-smoke.txt"
          migration_rc=${PIPESTATUS[0]}
          set -e
          if [ "$migration_rc" -ne 0 ] && [ "$migration_rc" -ne 2 ]; then
            echo "Migration status smoke falhou: rc=$migration_rc" >&2
            exit "$migration_rc"
          fi
          grep -Eq '^MIGRATION_STATE=(pending|ready|inconsistent)$' "$RUNNER_TEMP/gsa-tv-migration-smoke.txt"
          echo "MIGRATION_STATUS_SMOKE_OK=true"

      - name: Stop after read-only preflight
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && env.RUNTIME_OPERATION == 'preflight' }}
        run: |
          echo "Preflight concluído por stdin. Nenhum arquivo de release foi criado na VPS."

      - name: First-migration physical off-air gate
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && env.RUNTIME_OPERATION == 'prepare-first-migration' }}
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/gsa-tv-preflight.txt"
          grep -qx 'PHYSICAL_OFF_AIR_EVIDENCE=true' "$file"
          grep -qx 'HOST_RTMP_FFMPEG_COUNT=0' "$file"
          grep -qx 'FFPLAYOUT_STREAM_SOCKET_COUNT=0' "$file"
          grep -qx 'HOST_SQLITE_BACKUP_PROBE=ok' "$file"
          grep -qx 'FFPLAYOUT_HEALTH=healthy' "$file"

          set +e
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'sudo bash -s' \
            < infrastructure/gsa-tv/scripts/autopilot-migration-status.sh \
            | tee "$RUNNER_TEMP/gsa-tv-migration-before.txt"
          migration_rc=${PIPESTATUS[0]}
          set -e
          if [ "$migration_rc" -ne 0 ] && [ "$migration_rc" -ne 2 ]; then
            echo "Falha inesperada ao ler status de migrations: rc=$migration_rc" >&2
            exit "$migration_rc"
          fi

          if grep -q '^MIGRATION_STATE=inconsistent$' "$RUNNER_TEMP/gsa-tv-migration-before.txt"; then
            inconsistent_count="$(grep -Ec '^MIGRATION_STATUS=.*\|history=t\|contract=f$' "$RUNNER_TEMP/gsa-tv-migration-before.txt" || true)"
            if [ "$inconsistent_count" = "1" ] &&
               grep -qx 'MIGRATION_STATUS=20260922131000|history=t|contract=f' "$RUNNER_TEMP/gsa-tv-migration-before.txt"; then
              echo "MIGRATION_REPAIRABLE_COMPILE_GATE=true"
            else
              echo "Histórico de migrations inconsistente fora do reparo canônico autorizado; abortando antes da primeira mutação." >&2
              exit 80
            fi
          fi

      - name: Validate self-hosted production database
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && env.RUNTIME_OPERATION == 'prepare-first-migration' }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'sudo bash -s' \
            < infrastructure/gsa-tv/scripts/autopilot-migration-status.sh \
            | tee "$RUNNER_TEMP/gsa-tv-self-hosted-db.txt"
          migration_rc=${PIPESTATUS[0]}
          set -e
          if [ "$migration_rc" -ne 0 ] && [ "$migration_rc" -ne 2 ]; then
            echo "Falha inesperada ao validar banco self-hosted: rc=$migration_rc" >&2
            exit "$migration_rc"
          fi

          if grep -Eq '^MIGRATION_STATE=(pending|ready)$' "$RUNNER_TEMP/gsa-tv-self-hosted-db.txt"; then
            :
          elif grep -qx 'MIGRATION_STATE=inconsistent' "$RUNNER_TEMP/gsa-tv-self-hosted-db.txt" &&
               [ "$(grep -Ec '^MIGRATION_STATUS=.*\|history=t\|contract=f$' "$RUNNER_TEMP/gsa-tv-self-hosted-db.txt" || true)" = "1" ] &&
               grep -qx 'MIGRATION_STATUS=20260922131000|history=t|contract=f' "$RUNNER_TEMP/gsa-tv-self-hosted-db.txt"; then
            echo "SELF_HOSTED_DB_REPAIRABLE_COMPILE_GATE=true"
          else
            echo "Estado de migration self-hosted não autorizado para preparação." >&2
            exit 80
          fi
          echo "SELF_HOSTED_DB_ACCESS_OK=true"

      - name: Prepare legacy ffplayout snapshot dry-run
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && env.RUNTIME_OPERATION == 'prepare-first-migration' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'sudo bash -s' \
            < infrastructure/gsa-tv/scripts/snapshot-legacy-ffplayout.sh \
            | tee "$RUNNER_TEMP/gsa-tv-prepare-snapshot-dry.txt"
          grep -qx 'DRY_RUN_OK=true' "$RUNNER_TEMP/gsa-tv-prepare-snapshot-dry.txt"

      - name: Prepare legacy ffplayout snapshot apply
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && env.RUNTIME_OPERATION == 'prepare-first-migration' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'sudo bash -s -- --apply' \
            < infrastructure/gsa-tv/scripts/snapshot-legacy-ffplayout.sh \
            | tee "$RUNNER_TEMP/gsa-tv-prepare-snapshot-apply.txt"
          grep -qx 'SNAPSHOT_APPLIED=true' "$RUNNER_TEMP/gsa-tv-prepare-snapshot-apply.txt"
          grep -qx 'SNAPSHOT_VERIFY_OK=true' "$RUNNER_TEMP/gsa-tv-prepare-snapshot-apply.txt"

      - name: Stage canonical self-hosted migration bundle
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && env.RUNTIME_OPERATION == 'prepare-first-migration' }}
        shell: bash
        run: |
          set -euo pipefail
          local_dir="$RUNNER_TEMP/gsa-tv-first-migration"
          remote_dir="/tmp/gsa-tv-first-migration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$local_dir"
          cp infrastructure/gsa-tv/scripts/apply-autopilot-migration.sh "$local_dir/"
          cp supabase/migrations/20260922131000_gsa_tv_autopilot_compile_gate.sql "$local_dir/"
          cp supabase/migrations/20260922132000_gsa_tv_autopilot_duration_swap.sql "$local_dir/"
          cp supabase/migrations/20260922134000_gsa_tv_autopilot_continuity_fallback.sql "$local_dir/"
          cp supabase/migrations/20260922135000_gsa_tv_cinema_duration_contract.sql "$local_dir/"
          cp supabase/migrations/20260922136000_gsa_tv_resolved_production_signature.sql "$local_dir/"
          (cd "$local_dir" && sha256sum * > manifest.sha256)

          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "set -e; rm -rf '$remote_dir'; install -d -m 0700 '$remote_dir'"

          scp -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$local_dir/"* "$VPS_USER@$VPS_HOST:$remote_dir/"

          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "set -e; cd '$remote_dir'; sha256sum -c manifest.sha256; chmod 0700 apply-autopilot-migration.sh"

          echo "SELF_HOSTED_MIGRATION_REMOTE_DIR=$remote_dir" >> "$GITHUB_ENV"

      - name: Apply only five canonical Autopilot migrations on self-hosted PostgreSQL
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && env.RUNTIME_OPERATION == 'prepare-first-migration' }}
        shell: bash
        run: |
          set -euo pipefail

          remote_status() {
            local out rc
            set +e
            out="$(ssh -i "$HOME/.ssh/gsa-tv-deploy" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              "$VPS_USER@$VPS_HOST" \
              'sudo bash -s' \
              < infrastructure/gsa-tv/scripts/autopilot-migration-status.sh)"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
              echo "Falha inesperada ao ler status remoto de migrations: rc=$rc" >&2
              return "$rc"
            fi
            printf '%s\n' "$out"
          }

          migrations=(
            "20260922131000:gsa_tv_autopilot_compile_gate:20260922131000_gsa_tv_autopilot_compile_gate.sql"
            "20260922132000:gsa_tv_autopilot_duration_swap:20260922132000_gsa_tv_autopilot_duration_swap.sql"
            "20260922134000:gsa_tv_autopilot_continuity_fallback:20260922134000_gsa_tv_autopilot_continuity_fallback.sql"
            "20260922135000:gsa_tv_cinema_duration_contract:20260922135000_gsa_tv_cinema_duration_contract.sql"
            "20260922136000:gsa_tv_resolved_production_signature:20260922136000_gsa_tv_resolved_production_signature.sql"
          )

          for item in "${migrations[@]}"; do
            IFS=: read -r version name filename <<<"$item"
            status="$(remote_status)"
            line="$(printf '%s\n' "$status" | grep "^MIGRATION_STATUS=$version|" || true)"
            [ -n "$line" ] || { echo "Sem status para $version." >&2; exit 81; }
            history="$(sed -n 's/.*|history=\([^|]*\).*/\1/p' <<<"$line")"
            contract="$(sed -n 's/.*|contract=\([^|]*\).*/\1/p' <<<"$line")"

            if [ "$history" = t ] && [ "$contract" = t ]; then
              echo "MIGRATION_SKIP_READY=$version"
              continue
            fi
            if [ "$history" = t ] && [ "$contract" != t ]; then
              if [ "$version" = "20260922131000" ]; then
                mode="repair-contract"
                echo "MIGRATION_REPAIR_CONTRACT=$version"
              else
                echo "Migration $version no histórico sem contrato correspondente." >&2
                exit 82
              fi
            elif [ "$contract" = t ]; then
              mode="repair-history"
              echo "MIGRATION_REPAIR_HISTORY_ONLY=$version"
            else
              mode="apply"
              echo "MIGRATION_APPLY=$version"
            fi

            ssh -i "$HOME/.ssh/gsa-tv-deploy" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              "$VPS_USER@$VPS_HOST" \
              sudo bash "$SELF_HOSTED_MIGRATION_REMOTE_DIR/apply-autopilot-migration.sh" \
                --version "$version" \
                --name "$name" \
                --mode "$mode" \
                --file "$SELF_HOSTED_MIGRATION_REMOTE_DIR/$filename"

            verified="$(remote_status | grep "^MIGRATION_STATUS=$version|" || true)"
            grep -q '|history=t|contract=t$' <<<"$verified" || {
              echo "Migration $version não confirmou history+contract." >&2
              exit 83
            }
          done

          remote_status | tee "$RUNNER_TEMP/gsa-tv-migration-after.txt"
          grep -qx 'MIGRATION_STATE=ready' "$RUNNER_TEMP/gsa-tv-migration-after.txt"

      - name: Remove self-hosted migration staging
        if: ${{ always() && steps.guard.outputs.runtime_configured == 'true' && env.RUNTIME_OPERATION == 'prepare-first-migration' }}
        shell: bash
        run: |
          set -euo pipefail
          remote_dir="/tmp/gsa-tv-first-migration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "rm -rf '$remote_dir'"

      - name: Reconcile stale logical off-air state dry-run
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && env.RUNTIME_OPERATION == 'prepare-first-migration' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'sudo bash -s' \
            < infrastructure/gsa-tv/scripts/reconcile-stale-offair-state.sh \
            | tee "$RUNNER_TEMP/gsa-tv-offair-dry-run.txt"
          grep -qx 'DRY_RUN_OK=true' "$RUNNER_TEMP/gsa-tv-offair-dry-run.txt"

      - name: Reconcile stale logical off-air state apply
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && env.RUNTIME_OPERATION == 'prepare-first-migration' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'sudo bash -s -- --apply' \
            < infrastructure/gsa-tv/scripts/reconcile-stale-offair-state.sh \
            | tee "$RUNNER_TEMP/gsa-tv-offair-apply.txt"
          grep -qx 'OFFAIR_RECONCILE_APPLIED=true' "$RUNNER_TEMP/gsa-tv-offair-apply.txt"

      - name: Recover deterministic local media cache dry-run
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && env.RUNTIME_OPERATION == 'prepare-first-migration' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'sudo bash -s' \
            < infrastructure/gsa-tv/scripts/recover-local-media-cache.sh \
            | tee "$RUNNER_TEMP/gsa-tv-media-recovery-dry-run.txt"
          grep -qx 'DRY_RUN_OK=true' "$RUNNER_TEMP/gsa-tv-media-recovery-dry-run.txt"

      - name: Recover deterministic local media cache apply
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && env.RUNTIME_OPERATION == 'prepare-first-migration' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'sudo bash -s -- --apply' \
            < infrastructure/gsa-tv/scripts/recover-local-media-cache.sh \
            | tee "$RUNNER_TEMP/gsa-tv-media-recovery-apply.txt"
          grep -qx 'RECOVERY_APPLIED=true' "$RUNNER_TEMP/gsa-tv-media-recovery-apply.txt"

      - name: Full verified backup for first migration
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && env.RUNTIME_OPERATION == 'prepare-first-migration' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'sudo bash -s' \
            < infrastructure/gsa-tv/scripts/backup-full.sh \
            | tee "$RUNNER_TEMP/gsa-tv-full-backup.txt"

      - name: Final first-migration preparation evidence
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && env.RUNTIME_OPERATION == 'prepare-first-migration' }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'sudo bash -s' \
            < infrastructure/gsa-tv/scripts/autopilot-runtime-preflight.sh \
            | tee "$RUNNER_TEMP/gsa-tv-preflight-after.txt"
          preflight_rc=${PIPESTATUS[0]}
          set -e

          file="$RUNNER_TEMP/gsa-tv-preflight-after.txt"
          # Preparation precedes installation: a missing Control Plane is expected.
          # Keep transport errors and partially installed runtimes fail-closed.
          case "$preflight_rc" in
            0) grep -qx 'STATUS=EXTERNAL_READY' "$file" ;;
            10) grep -qx 'STATUS=LEGACY_COUPLED' "$file" ;;
            20) grep -qx 'STATUS=CONTROL_PLANE_MISSING' "$file" ;;
            *) exit "$preflight_rc" ;;
          esac
          if grep -qx 'STATUS=BLOCKED' "$file"; then
            echo "Preparation preflight remains blocked." >&2
            exit 20
          fi
          grep -qx 'PHYSICAL_OFF_AIR_EVIDENCE=true' "$file"
          grep -qx 'DESIRED_STATE=stopped' "$file"
          grep -qx 'SIGNAL_STATE=stopped' "$file"
          grep -qx 'PLAYOUT_STATE=off_air' "$file"
          grep -qx 'FIRST_MIGRATION_OFFAIR_READY=true' "$file"
          grep -qx 'AUTOPILOT_DB_CONTRACT_READY=true' "$file"
          grep -qx 'AUTOPILOT_MIGRATION_COUNT=5' "$file"
          grep -qx 'LATEST_BACKUP_STATE=restored_test' "$file"
          grep -qx 'LATEST_BACKUP_MANIFEST_OK=true' "$file"
          grep -qx 'MISSING_PATHS=none' "$file"
          echo "FIRST_MIGRATION_PREP_READY=true"

      - name: Legacy ffplayout snapshot dry-run
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && env.RUNTIME_OPERATION == 'legacy-snapshot' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'sudo bash -s' \
            < infrastructure/gsa-tv/scripts/snapshot-legacy-ffplayout.sh

      - name: Legacy ffplayout snapshot apply
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && env.RUNTIME_OPERATION == 'legacy-snapshot' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'sudo bash -s -- --apply' \
            < infrastructure/gsa-tv/scripts/snapshot-legacy-ffplayout.sh

      - name: Post-snapshot evidence
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && env.RUNTIME_OPERATION == 'legacy-snapshot' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'sudo bash -s -- --verify-latest' \
            < infrastructure/gsa-tv/scripts/snapshot-legacy-ffplayout.sh

      - name: Package immutable runtime source
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && (env.RUNTIME_OPERATION == 'deploy' || env.RUNTIME_OPERATION == 'deploy-dry-run') }}
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gsa-tv-runtime"
          mkdir -p "$dir"
          tar -C "$GITHUB_WORKSPACE" -czf "$dir/source.tgz" \
            infrastructure/gsa-tv \
            docs/gsa-tv-secret-rotation.md \
            supabase/migrations/20260922131000_gsa_tv_autopilot_compile_gate.sql \
            supabase/migrations/20260922132000_gsa_tv_autopilot_duration_swap.sql \
            supabase/migrations/20260922134000_gsa_tv_autopilot_continuity_fallback.sql \
            supabase/migrations/20260922135000_gsa_tv_cinema_duration_contract.sql \
            supabase/migrations/20260922136000_gsa_tv_resolved_production_signature.sql
          (cd "$dir" && sha256sum source.tgz > source.sha256)
          cat "$dir/source.sha256"

      - name: Upload immutable release source
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && (env.RUNTIME_OPERATION == 'deploy' || env.RUNTIME_OPERATION == 'deploy-dry-run') }}
        shell: bash
        run: |
          set -euo pipefail
          remote="/opt/gsa-tv/releases/source-${GITHUB_SHA}"
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo install -d -m 0755 '$remote' && sudo chown \"\$(id -u)\":\"\$(id -g)\" '$remote'"
          scp -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/gsa-tv-runtime/source.tgz" \
            "$RUNNER_TEMP/gsa-tv-runtime/source.sha256" \
            "$VPS_USER@$VPS_HOST:$remote/"
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "set -e; cd '$remote'; sha256sum -c source.sha256; tar -xzf source.tgz; chmod -R go-w ."

      - name: Guarded deploy dry-run
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && (env.RUNTIME_OPERATION == 'deploy' || env.RUNTIME_OPERATION == 'deploy-dry-run') }}
        shell: bash
        run: |
          set -euo pipefail
          remote="/opt/gsa-tv/releases/source-${GITHUB_SHA}"
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo bash '$remote/infrastructure/gsa-tv/scripts/deploy-autopilot-v2.sh'"

      - name: Guarded deploy apply
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && env.RUNTIME_OPERATION == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          remote="/opt/gsa-tv/releases/source-${GITHUB_SHA}"
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo bash '$remote/infrastructure/gsa-tv/scripts/deploy-autopilot-v2.sh' --apply"

      - name: Post-deploy evidence
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && env.RUNTIME_OPERATION == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'set -e;
             echo "--- preflight ---";
             sudo /opt/gsa-tv/bin/autopilot-runtime-preflight.sh;
             echo "--- containers ---";
             sudo docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}" | grep "gsa-tv-";
             echo "--- timers ---";
             sudo systemctl list-timers --all --no-pager | grep "gsa-tv-autopilot";
             echo "--- readiness ---";
             sudo test -s /opt/gsa-tv/runtime/autopilot/readiness-horizon.json;
             sudo python3 -c "import json; x=json.load(open(\"/opt/gsa-tv/runtime/autopilot/readiness-horizon.json\")); print(json.dumps({\"generated_at\":x.get(\"generated_at\"),\"ready_days\":x.get(\"ready_days\"),\"days\":x.get(\"days\")},ensure_ascii=False))"'

      - name: Guarded cutover dry-run
        if: ${{ steps.guard.outputs.runtime_configured == 'true' && env.RUNTIME_OPERATION == 'cutover' }}
        shell: bash
        run: |
          set -euo pipefail
