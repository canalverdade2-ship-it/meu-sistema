name: Stop Election Live Source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stop-election-live-once-v2.yml"

permissions:
  contents: read

jobs:
  stop:
    runs-on: ubuntu-latest
    environment: gsa-tv-production
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.GSA_TV_VPS_HOST }}
      VPS_USER: ${{ secrets.GSA_TV_VPS_USER }}
    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.GSA_TV_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.GSA_TV_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/gsa-tv-deploy"
          chmod 600 "$HOME/.ssh/gsa-tv-deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Stop election source only
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "=== BEFORE ==="
          docker top gsa-tv-ffplayout -eo pid,ppid,user,args 2>/dev/null | grep -E 'ffplayout|ffmpeg' | sed -E 's#(rtmps?://[^/ ]+/)[^ ]+#\1[PROTECTED]#g' || true

          pm2 stop gsa-tv-election-publisher >/dev/null 2>&1 || true
          pm2 stop gsa-tv-election-source >/dev/null 2>&1 || true
          sleep 2
          pm2 delete gsa-tv-election-publisher >/dev/null 2>&1 || true
          pm2 delete gsa-tv-election-source >/dev/null 2>&1 || true
          pm2 save >/dev/null 2>&1 || true

          docker rm -f gsa-tv-election-chromedriver >/dev/null 2>&1 || true
          pkill -f '^python3 /home/opc/gsa-tv-election-' 2>/dev/null || true
          pkill -f '^python3 /tmp/election-' 2>/dev/null || true

          tmp="$(mktemp)"
          crontab -l 2>/dev/null | grep -v 'GSA_TV_ELECTION_PM2_RESURRECT' > "$tmp" || true
          crontab "$tmp"
          rm -f "$tmp"

          docker exec gsa-tv-ffplayout sqlite3 /state/ffplayout.db "UPDATE configurations SET ingest_enable=0 WHERE channel_id=1;" || true

          sleep 6
          echo "=== AFTER ==="
          docker top gsa-tv-ffplayout -eo pid,ppid,user,args 2>/dev/null | grep -E 'ffplayout|ffmpeg' | sed -E 's#(rtmps?://[^/ ]+/)[^ ]+#\1[PROTECTED]#g' || true
          echo "=== SWITCH ==="
          docker logs --since 20s gsa-tv-ffplayout 2>&1 | grep -Ei 'live input ended|switching back to file playback|reinitialize playlist|idle' | tail -n 30 || true
          echo "STOP_ELECTION_COMPLETE=true"
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/gsa-tv-deploy" "$HOME/.ssh/known_hosts"
