name: Force Stop Election FFmpeg

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/force-stop-election-ffmpeg-once.yml"

permissions:
  contents: read

jobs:
  stop:
    runs-on: ubuntu-latest
    environment: gsa-tv-production
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.GSA_TV_VPS_HOST }}
      VPS_USER: ${{ secrets.GSA_TV_VPS_USER }}
    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.GSA_TV_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.GSA_TV_VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/gsa-tv-deploy"
          chmod 600 "$HOME/.ssh/gsa-tv-deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Force stop election ffmpeg only
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          echo "=== TARGETS ==="
          mapfile -t PIDS < <(docker top gsa-tv-ffplayout -eo pid,args 2>/dev/null | awk '/[f]fmpeg/ && /9232\/stream\.mjpg/ {print $1}')
          printf 'COUNT=%s\n' "${#PIDS[@]}"

          for pid in "${PIDS[@]}"; do
            echo "TERM_PID=$pid"
            kill -TERM "$pid" 2>/dev/null || true
          done
          sleep 3

          for pid in "${PIDS[@]}"; do
            if kill -0 "$pid" 2>/dev/null; then
              echo "KILL_PID=$pid"
              kill -KILL "$pid" 2>/dev/null || true
            fi
          done

          sleep 8

          echo "=== AFTER ==="
          docker top gsa-tv-ffplayout -eo pid,ppid,user,args 2>/dev/null             | grep -E 'ffplayout|ffmpeg'             | sed -E 's#(rtmps?://[^/ ]+/)[^ ]+#\1[PROTECTED]#g' || true

          echo "=== LOGS ==="
          docker logs --since 25s gsa-tv-ffplayout 2>&1             | grep -Ei 'live input ended|switching back to file playback|reinitialize playlist|Play for|filler|restart|error'             | tail -n 80 || true

          echo "FORCE_STOP_COMPLETE=true"
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/gsa-tv-deploy" "$HOME/.ssh/known_hosts"
