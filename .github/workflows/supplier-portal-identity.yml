name: Supplier Portal Experience

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/Fornecedor/**'
      - 'src/supplier-portal.css'
      - 'src/main.tsx'
      - 'src/lib/supplierOperations.ts'
      - 'src/types/supplier.ts'
      - 'scripts/check-supplier-procurement-contracts.ts'
  push:
    branches: ['agent/portal-fornecedor-**']
    paths:
      - 'src/pages/Fornecedor/**'
      - 'src/supplier-portal.css'
      - 'src/main.tsx'
      - 'src/lib/supplierOperations.ts'
      - 'src/types/supplier.ts'
      - 'scripts/check-supplier-procurement-contracts.ts'

concurrency:
  group: supplier-portal-experience-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Supplier contracts
        run: npm run test:suppliers

      - name: Production build
        run: npm run build
