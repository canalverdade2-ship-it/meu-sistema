name: Quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: quality-audit-edge-deterministic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.head_ref == 'audit/full-system-remediation-continuation-20260727'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout da branch isolada
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Instalar dependências
        run: npm ci

      - name: Aplicar e persistir correções determinísticas
        shell: bash
        run: |
          node scripts/apply-audit-edge-deterministic-fixes.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/gsa-public-advertising/index.ts supabase/functions/_shared/html_parser.ts supabase/functions/_shared/html_parser_test.ts
          if git diff --cached --quiet; then
            echo "Correções já persistidas."
          else
            git commit -m "fix(audit): corrigir CORS público e parser monetário"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Validar funções e testes corrigidos
        run: |
          deno check supabase/functions/gsa-public-advertising/index.ts supabase/functions/gsa-public-advertising/index_test.ts supabase/functions/_shared/html_parser.ts supabase/functions/_shared/html_parser_test.ts
          deno test --allow-env supabase/functions/gsa-public-advertising/index_test.ts
          deno test supabase/functions/_shared/html_parser_test.ts
          npx tsc --noEmit --pretty false
