name: Quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: quality-audit-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.head_ref == 'audit/full-system-remediation-continuation-20260727'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout da branch isolada
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Aplicar e persistir correção de autenticação
        shell: bash
        run: |
          node scripts/apply-audit-auth-json-fix.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/gsa-auth-session/index.ts
          if git diff --cached --quiet; then
            echo "Correção já persistida."
          else
            git commit -m "fix(audit): corrigir resposta de erro da autenticação"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Validar Edge Function e testes
        run: |
          deno check supabase/functions/gsa-auth-session/index.ts supabase/functions/gsa-auth-session/index_test.ts
          deno test --allow-env supabase/functions/gsa-auth-session/index_test.ts
