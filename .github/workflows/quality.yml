name: Quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: quality-audit-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.head_ref == 'audit/full-system-remediation-continuation-20260727'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout da branch isolada
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Instalar dependências
        run: npm ci

      - name: Aplicar e persistir correção de autenticação
        shell: bash
        run: |
          node scripts/apply-audit-auth-json-fix.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/gsa-auth-session/index.ts
          if git diff --cached --quiet; then
            echo "Correção já persistida."
          else
            git commit -m "fix(audit): corrigir resposta de erro da autenticação"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Capturar check e testes Deno
        id: deno_validation
        shell: bash
        run: |
          set +e
          deno check supabase/functions/gsa-auth-session/index.ts supabase/functions/gsa-auth-session/index_test.ts > deno-check.log 2>&1
          check_exit=$?
          deno test --allow-env supabase/functions/gsa-auth-session/index_test.ts > deno-test.log 2>&1
          test_exit=$?
          set -e
          echo "check_exit=$check_exit" >> "$GITHUB_OUTPUT"
          echo "test_exit=$test_exit" >> "$GITHUB_OUTPUT"
          cat deno-check.log
          cat deno-test.log

      - name: Exportar evidência Deno
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-deno-validation
          path: |
            deno-check.log
            deno-test.log
          if-no-files-found: error
          retention-days: 7

      - name: Encerrar com resultado real
        shell: bash
        run: |
          if [ "${{ steps.deno_validation.outputs.check_exit }}" -ne 0 ] || [ "${{ steps.deno_validation.outputs.test_exit }}" -ne 0 ]; then
            exit 1
          fi
