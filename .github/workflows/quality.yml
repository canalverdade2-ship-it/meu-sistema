name: Quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: quality-audit-checkout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.head_ref == 'audit/full-system-remediation-continuation-20260727'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout da branch isolada
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Aplicar e persistir correção do checkout
        shell: bash
        run: |
          node scripts/apply-audit-checkout-validation-fix.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/client/store/CheckoutModal.tsx
          if git diff --cached --quiet; then
            echo "Correção já persistida."
          else
            git commit -m "fix(audit): alinhar validação segura do checkout"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Validar TypeScript e contrato de produtos
        run: |
          npx tsc --noEmit --pretty false
          npm run test:products-subscriptions
