name: Autopilot V2 One-Shot Cutover

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact SHA to allow cutover"
        required: true
        type: string

jobs:
  cutover:
    name: Perform Cutover
    runs-on: ubuntu-24.04
    environment: gsa-tv-production
    steps:
      - name: Assert Target Commit
        run: |
          if [ "${GITHUB_SHA}" != "${{ inputs.target_sha }}" ]; then
            echo "ERROR: This one-shot workflow is locked to SHA ${{ inputs.target_sha }}."
            echo "Current SHA is ${GITHUB_SHA}."
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.GSA_TV_SSH_KEY }}
          known_hosts: ${{ secrets.GSA_TV_KNOWN_HOSTS }}

      - name: Execute Cutover on VPS
        run: |
          ssh -p 22 opc@147.15.43.141 "sudo bash -c 'cd /opt/gsa-tv && ./bin/cutover-autopilot-v2.sh'"
