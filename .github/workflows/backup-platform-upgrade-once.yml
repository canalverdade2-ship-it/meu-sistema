name: Backup Before Platform Upgrade

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backup-platform-upgrade-once.yml"

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: gsa-tv-production
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ secrets.GSA_TV_VPS_HOST }}
      VPS_USER: ${{ secrets.GSA_TV_VPS_USER }}
    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.GSA_TV_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.GSA_TV_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/gsa-tv-deploy"
          chmod 600 "$HOME/.ssh/gsa-tv-deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Create rollback snapshot
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          TS="$(date +%Y%m%d-%H%M%S)"
          DIR="/opt/gsa-tv/backups/platform-upgrade/$TS"
          sudo install -d -m 0700 "$DIR"

          sudo docker inspect $(sudo docker ps -aq) > /tmp/gsa-containers-inspect.json
          sudo install -m 0600 /tmp/gsa-containers-inspect.json "$DIR/containers-inspect.json"
          rm -f /tmp/gsa-containers-inspect.json

          sudo tar -czf "$DIR/configs.tgz"             --exclude='node_modules'             --exclude='data/profile'             --exclude='data/downloads'             --exclude='cache'             /opt/gsa-tv/control-plane             /opt/gsa-tv/encoder-engine             /opt/gsa-tv/compose             /home/opc/gsa-ai             /home/opc/gsa-hub             /etc/gsa             /etc/systemd/system 2>/dev/null || true
          sudo chmod 0600 "$DIR/configs.tgz"

          if sudo test -d /var/lib/docker/volumes/n8n_data/_data; then
            sudo tar -C /var/lib/docker/volumes/n8n_data/_data -czf "$DIR/n8n-data.tgz" .
            sudo chmod 0600 "$DIR/n8n-data.tgz"
          fi

          if sudo docker ps --format '{{.Names}}' | grep -qx evo-postgres; then
            sudo docker exec evo-postgres sh -lc 'pg_dumpall -U "$POSTGRES_USER"' | gzip | sudo tee "$DIR/evo-postgres.sql.gz" >/dev/null
            sudo chmod 0600 "$DIR/evo-postgres.sql.gz"
          fi

          if sudo systemctl is-active --quiet postgresql-15; then
            sudo -u postgres pg_dumpall | gzip | sudo tee "$DIR/host-postgres.sql.gz" >/dev/null
            sudo chmod 0600 "$DIR/host-postgres.sql.gz"
          fi

          sudo cp -a /opt/gsa-tv/config/ffplayout/ffplayout.db "$DIR/ffplayout.db" 2>/dev/null || true
          sudo chmod 0600 "$DIR/ffplayout.db" 2>/dev/null || true

          sudo sh -c "cd '$DIR' && sha256sum * > SHA256SUMS"
          echo "BACKUP_DIR=$DIR"
          sudo du -sh "$DIR"
          echo BACKUP_COMPLETE=true
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/gsa-tv-deploy" "$HOME/.ssh/known_hosts"
