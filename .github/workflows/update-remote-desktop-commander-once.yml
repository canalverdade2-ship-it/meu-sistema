name: One-shot Update Remote Desktop Commander

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-remote-desktop-commander-once.yml"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    environment: gsa-tv-production
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.GSA_TV_VPS_HOST }}
      VPS_USER: ${{ secrets.GSA_TV_VPS_USER }}
    steps:
      - name: Configure pinned SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.GSA_TV_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.GSA_TV_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/gsa-tv-deploy"
          chmod 0600 "$HOME/.ssh/gsa-tv-deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Update and restart Remote Desktop Commander
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy"             -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes             "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          SERVICE="desktop-commander-remote.service"
          sudo -n true

          node_major="$(node --version | sed 's/^v//' | cut -d. -f1)"
          if [ "$node_major" -lt 18 ]; then
            echo "ERROR: Node.js 18+ required; found $(node --version)" >&2
            exit 18
          fi

          current="$(node -p "require('/usr/lib/node_modules/@wonderwhy-er/desktop-commander/package.json').version" 2>/dev/null || echo unknown)"
          latest="$(npm view @wonderwhy-er/desktop-commander version)"
          echo "CURRENT_VERSION=$current"
          echo "LATEST_VERSION=$latest"

          echo "SERVICE_BEFORE=$(sudo systemctl is-active "$SERVICE" || true)"
          main_before="$(sudo systemctl show "$SERVICE" -p MainPID --value || true)"
          echo "SERVICE_MAINPID_BEFORE=$main_before"

          sudo systemctl stop "$SERVICE"

          # Remove stale/orphaned copies of the same remote agent before restarting.
          sudo pkill -TERM -f '^node /usr/bin/desktop-commander remote$' 2>/dev/null || true
          sleep 2
          sudo pkill -KILL -f '^node /usr/bin/desktop-commander remote$' 2>/dev/null || true

          sudo npm install -g @wonderwhy-er/desktop-commander@latest --no-audit --no-fund

          updated="$(node -p "require('/usr/lib/node_modules/@wonderwhy-er/desktop-commander/package.json').version")"
          echo "UPDATED_VERSION=$updated"
          if [ "$updated" != "$latest" ]; then
            echo "ERROR: package update mismatch ($updated != $latest)" >&2
            exit 52
          fi

          sudo systemctl daemon-reload
          sudo systemctl start "$SERVICE"
          sleep 5
          sudo systemctl is-active --quiet "$SERVICE"

          main_after="$(sudo systemctl show "$SERVICE" -p MainPID --value)"
          echo "SERVICE_MAINPID_AFTER=$main_after"
          echo "SERVICE_AFTER=$(sudo systemctl is-active "$SERVICE")"

          agent_count="$(ps -eo args= | grep -Ec '^node /usr/bin/desktop-commander remote$' || true)"
          echo "REMOTE_PARENT_COUNT=$agent_count"
          if [ "$agent_count" -ne 1 ]; then
            echo "ERROR: expected exactly one Remote Desktop Commander parent process, found $agent_count" >&2
            exit 53
          fi

          echo "REMOTE_DESKTOP_COMMANDER_UPDATE_OK=true"
          REMOTE

      - name: Remove local SSH material
        if: always()
        run: rm -f "$HOME/.ssh/gsa-tv-deploy" "$HOME/.ssh/known_hosts"
