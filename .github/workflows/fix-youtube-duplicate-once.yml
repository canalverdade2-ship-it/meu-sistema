name: One-shot Fix Duplicate YouTube Publisher

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-youtube-duplicate-once.yml"

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    environment: gsa-tv-production
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.GSA_TV_VPS_HOST }}
      VPS_USER: ${{ secrets.GSA_TV_VPS_USER }}
    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.GSA_TV_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.GSA_TV_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/gsa-tv-deploy"
          chmod 600 "$HOME/.ssh/gsa-tv-deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect and remove duplicate YouTube publishers
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy"             -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes             "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          echo "=== ALL YOUTUBE FFMPEG PUBLISHERS ==="
          mapfile -t PIDS < <(ps -eo pid=,args= | awk '/[f]fmpeg/ && /rtmps:\/\/a\.rtmps\.youtube\.com:443/ {print $1}')
          printf 'COUNT=%s\n' "${#PIDS[@]}"

          for pid in "${PIDS[@]}"; do
            ppid="$(ps -o ppid= -p "$pid" | tr -d ' ')"
            cmd="$(ps -o args= -p "$pid" | sed -E 's#(rtmps?://[^/ ]+/)[^ ]+#\1[PROTECTED]#g')"
            echo "PID=$pid PPID=$ppid CMD=$cmd"
          done

          echo "=== FFP PROCESS TREE ==="
          docker top gsa-tv-ffplayout -eo pid,ppid,user,args 2>/dev/null             | sed -E 's#(rtmps?://[^/ ]+/)[^ ]+#\1[PROTECTED]#g'             | grep -E 'ffplayout|ffmpeg' || true

          echo "=== OTHER CONTAINERS WITH YOUTUBE PUBLISHERS ==="
          for c in $(docker ps --format '{{.Names}}'); do
            if [ "$c" = "gsa-tv-ffplayout" ]; then continue; fi
            lines="$(docker top "$c" -eo pid,ppid,user,args 2>/dev/null | grep -E '[f]fmpeg.*rtmps://a\.rtmps\.youtube\.com:443' || true)"
            if [ -n "$lines" ]; then
              echo "CONTAINER=$c"
              printf '%s\n' "$lines" | sed -E 's#(rtmps?://[^/ ]+/)[^ ]+#\1[PROTECTED]#g'
            fi
          done

          # Keep only the YouTube publisher that is a direct child/descendant of ffplayout.
          FFP_PID="$(docker top gsa-tv-ffplayout -eo pid,args 2>/dev/null | awk '/\/usr\/local\/bin\/ffplayout/ {print $1; exit}')"
          echo "FFPLAYOUT_PID=$FFP_PID"

          keep=""
          for pid in "${PIDS[@]}"; do
            cur="$pid"
            for _ in 1 2 3 4 5 6 7 8; do
              [ -n "$cur" ] || break
              [ "$cur" = "1" ] && break
              if [ "$cur" = "$FFP_PID" ]; then
                keep="$pid"
                break 2
              fi
              cur="$(ps -o ppid= -p "$cur" 2>/dev/null | tr -d ' ' || true)"
            done
          done

          if [ -z "$keep" ] && [ "${#PIDS[@]}" -gt 0 ]; then
            keep="${PIDS[0]}"
          fi
          echo "KEEP_PID=$keep"

          killed=0
          for pid in "${PIDS[@]}"; do
            if [ "$pid" != "$keep" ]; then
              echo "KILL_DUPLICATE_PID=$pid"
              kill -TERM "$pid" 2>/dev/null || true
              killed=$((killed+1))
            fi
          done
          sleep 3

          echo "KILLED_COUNT=$killed"
          echo "=== REMAINING YOUTUBE PUBLISHERS ==="
          ps -eo pid=,ppid=,args=             | grep -E '[f]fmpeg.*rtmps://a\.rtmps\.youtube\.com:443'             | sed -E 's#(rtmps?://[^/ ]+/)[^ ]+#\1[PROTECTED]#g' || true

          echo "=== SOURCE HEALTH ==="
          curl -fsS --max-time 4 http://172.20.0.1:9232/health || true
          echo

          echo "DUPLICATE_FIX_COMPLETE=true"
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/gsa-tv-deploy" "$HOME/.ssh/known_hosts"
