name: Dependency Security

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    if: github.head_ref == 'audit/full-system-remediation-continuation-20260727'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout do merge auditado
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar estado atual
        run: npm ci
      - name: Substituir ExcelJS pelo fork mantido
        run: npm install 'exceljs@npm:@excel.js/exceljs@^0.9.0' --save
      - name: Validar segurança e compatibilidade
        shell: bash
        run: |
          npm audit --audit-level=high
          node --input-type=module <<'NODE'
          const imported = await import('exceljs');
          const ExcelJS = imported.default;
          const workbook = new ExcelJS.Workbook();
          const worksheet = workbook.addWorksheet('Auditoria');
          worksheet.getCell('A1').value = 'GSA HUB';
          worksheet.getCell('A1').font = { bold: true };
          const buffer = await workbook.xlsx.writeBuffer();
          if (!buffer || buffer.byteLength < 100) throw new Error('Falha ao gerar planilha com o fork mantido.');
          console.log(`Planilha de compatibilidade gerada: ${buffer.byteLength} bytes.`);
          NODE
          npx tsc --noEmit --pretty false
          npm run test:unit
          npm run build
      - name: Persistir somente os manifests validados
        shell: bash
        run: |
          mkdir -p /tmp/gsa-validated-package
          cp package.json package-lock.json /tmp/gsa-validated-package/
          git fetch origin audit/full-system-remediation-continuation-20260727
          git checkout -B audit/full-system-remediation-continuation-20260727 origin/audit/full-system-remediation-continuation-20260727
          cp /tmp/gsa-validated-package/package.json /tmp/gsa-validated-package/package-lock.json .
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Manifests já estão atualizados."
          else
            git commit -m "fix(security): usar fork mantido do ExcelJS"
            git push origin HEAD:audit/full-system-remediation-continuation-20260727
          fi
