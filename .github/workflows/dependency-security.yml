name: Dependency Security

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'audit/full-system-remediation-continuation-20260727'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout do merge auditado
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar estado atual
        run: npm ci
      - name: Substituir ExcelJS pelo fork mantido
        run: npm install 'exceljs@npm:@excel.js/exceljs@^0.9.0' --save
      - name: Capturar cada validação
        id: validation
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high > dependency-audit.log 2>&1
          audit_exit=$?
          node --input-type=module > exceljs-smoke.log 2>&1 <<'NODE'
          const imported = await import('exceljs');
          const ExcelJS = imported.default;
          const workbook = new ExcelJS.Workbook();
          const worksheet = workbook.addWorksheet('Auditoria');
          worksheet.getCell('A1').value = 'GSA HUB';
          worksheet.getCell('A1').font = { bold: true };
          const buffer = await workbook.xlsx.writeBuffer();
          if (!buffer || buffer.byteLength < 100) throw new Error('Falha ao gerar planilha com o fork mantido.');
          console.log(`Planilha de compatibilidade gerada: ${buffer.byteLength} bytes.`);
          NODE
          smoke_exit=$?
          npx tsc --noEmit --pretty false > typescript.log 2>&1
          tsc_exit=$?
          npm run test:unit > unit-tests.log 2>&1
          unit_exit=$?
          npm run build > build.log 2>&1
          build_exit=$?
          set -e
          echo "audit_exit=$audit_exit" >> "$GITHUB_OUTPUT"
          echo "smoke_exit=$smoke_exit" >> "$GITHUB_OUTPUT"
          echo "tsc_exit=$tsc_exit" >> "$GITHUB_OUTPUT"
          echo "unit_exit=$unit_exit" >> "$GITHUB_OUTPUT"
          echo "build_exit=$build_exit" >> "$GITHUB_OUTPUT"
          printf 'audit=%s smoke=%s tsc=%s unit=%s build=%s\n' "$audit_exit" "$smoke_exit" "$tsc_exit" "$unit_exit" "$build_exit"
      - name: Exportar evidência completa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintained-exceljs-validation
          path: |
            dependency-audit.log
            exceljs-smoke.log
            typescript.log
            unit-tests.log
            build.log
          if-no-files-found: error
          retention-days: 7
      - name: Encerrar com resultado real
        shell: bash
        run: |
          if [ "${{ steps.validation.outputs.audit_exit }}" -ne 0 ] \
            || [ "${{ steps.validation.outputs.smoke_exit }}" -ne 0 ] \
            || [ "${{ steps.validation.outputs.tsc_exit }}" -ne 0 ] \
            || [ "${{ steps.validation.outputs.unit_exit }}" -ne 0 ] \
            || [ "${{ steps.validation.outputs.build_exit }}" -ne 0 ]; then
            exit 1
          fi
