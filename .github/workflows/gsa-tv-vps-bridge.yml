name: GSA TV VPS Read-Only Bridge

on:
  push:
    branches:
      - "ops/gsa-tv-vps-bridge"
    paths:
      - ".github/workflows/gsa-tv-vps-bridge.yml"
      - "ops/gsa-tv-vps-command.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gsa-tv-vps-readonly-bridge
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    environment: gsa-tv-production
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.GSA_TV_VPS_HOST }}
      VPS_USER: ${{ secrets.GSA_TV_VPS_USER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate request and secrets
        id: request
        shell: bash
        env:
          VPS_SSH_KEY_PRESENT: ${{ secrets.GSA_TV_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS_PRESENT: ${{ secrets.GSA_TV_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${VPS_HOST:-}" || { echo "Missing GSA_TV_VPS_HOST" >&2; exit 78; }
          test -n "${VPS_USER:-}" || { echo "Missing GSA_TV_VPS_USER" >&2; exit 78; }
          test "${#VPS_SSH_KEY_PRESENT}" -ge 100 || { echo "Missing/invalid GSA_TV_VPS_SSH_KEY" >&2; exit 78; }
          test "${#VPS_KNOWN_HOSTS_PRESENT}" -ge 20 || { echo "Missing/invalid GSA_TV_VPS_KNOWN_HOSTS" >&2; exit 78; }

          operation="$(python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("ops/gsa-tv-vps-command.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          print(data.get("operation", ""))
          PY
          )"

          case "$operation" in
            status|inventory|backup-status|schedule-now|automation-snapshot|producer-symbols|producer-hooks|producer-contract|audiovisual-hooks|gsa-tech-preflight) ;;
            *)
              echo "Unsupported read-only operation: $operation" >&2
              exit 64
              ;;
          esac
          echo "operation=$operation" >> "$GITHUB_OUTPUT"
          echo "READ_ONLY_OPERATION=$operation"

      - name: Configure pinned SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.GSA_TV_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.GSA_TV_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/gsa-tv-deploy"
          chmod 0600 "$HOME/.ssh/gsa-tv-deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Verify SSH
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy"             -o BatchMode=yes             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=yes             "$VPS_USER@$VPS_HOST"             'set -e; printf "SSH_OK=true\n"; hostname; id -un; command -v sudo >/dev/null; sudo -n true'

      - name: Run read-only GSA TV probe
        shell: bash
        env:
          OPERATION: ${{ steps.request.outputs.operation }}
        run: |
          set -euo pipefail

          case "$OPERATION" in
            status)
              cat > "$RUNNER_TEMP/remote-probe.sh" <<'REMOTE'
          set -euo pipefail
          echo "=== GSA_TV_VPS_STATUS ==="
          printf 'HOSTNAME='; hostname
          printf 'UTC_NOW='; date -u +%Y-%m-%dT%H:%M:%SZ
          printf 'UPTIME='; uptime -p || true
          echo "--- root filesystem ---"
          df -h / || true
          echo "--- GSA TV / ffplayout containers ---"
          sudo docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' 2>/dev/null | grep -Ei '(^NAMES|gsa-tv|ffplayout)' || true
          echo "--- GSA TV services ---"
          sudo systemctl list-units --type=service --all --no-pager 2>/dev/null | grep -Ei 'gsa-tv|ffplayout' || true
          echo "--- GSA TV timers ---"
          sudo systemctl list-timers --all --no-pager 2>/dev/null | grep -Ei 'gsa-tv|ffplayout' || true
          echo "--- failed GSA TV units ---"
          sudo systemctl --failed --no-pager 2>/dev/null | grep -Ei '(^UNIT|gsa-tv|ffplayout)' || true
          echo "--- /opt/gsa-tv top-level ---"
          sudo find /opt/gsa-tv -mindepth 1 -maxdepth 2 -printf '%y %p\n' 2>/dev/null | sort | head -250 || true
          REMOTE
              ;;
            gsa-tech-preflight)
              cat > "$RUNNER_TEMP/remote-probe.sh" <<'REMOTE'
          set -u
          echo "=== GSA_TECH_PREFLIGHT_DIAGNOSTIC ==="
          for cmd in python3 ffmpeg ffprobe docker; do
            if command -v "$cmd" >/dev/null 2>&1; then echo "CMD_$cmd=present"; else echo "CMD_$cmd=missing"; fi
          done
          if python3 -c 'import requests' >/dev/null 2>&1; then echo "PY_REQUESTS=present"; else echo "PY_REQUESTS=missing"; fi
          if [ -f /home/opc/gsa-program-builder/builder.py ]; then echo "FISH_BUILDER=present"; else echo "FISH_BUILDER=missing"; fi
          if [ -d /opt/gsa-tv/cache/media/1/identity/audio/sfx ]; then
            echo "SFX_DIR=present"
            find /opt/gsa-tv/cache/media/1/identity/audio/sfx -maxdepth 1 -type f \( -name '*.wav' -o -name '*.mp3' -o -name '*.m4a' \) 2>/dev/null | wc -l | awk '{print "SFX_COUNT="$1}'
          else
            echo "SFX_DIR=missing"
          fi
          sudo docker exec gsa-tv-control-plane sh -lc 'if [ -n "${PEXELS_API_KEY:-}" ]; then echo PEXELS_KEY=present; else echo PEXELS_KEY=missing; fi; if [ -n "${PIXABAY_API_KEY:-}" ]; then echo PIXABAY_KEY=present; else echo PIXABAY_KEY=missing; fi' 2>/dev/null || echo "CONTROL_PLANE_ENV_CHECK=failed"
          df -Pk /opt/gsa-tv | awk 'NR==2{print "FREE_KB="$4}'
          OUT=/opt/gsa-tv/cache/media/1/program-masters/GSA_Tech_2026-09-29_EP001_IA_Apps_Inovacao_MASTER.mp4
          if [ -e "$OUT" ]; then echo "MASTER_EXISTS=yes"; else echo "MASTER_EXISTS=no"; fi
          REMOTE
              ;;
            audiovisual-hooks)
              cat > "$RUNNER_TEMP/remote-probe.sh" <<'REMOTE'
          set -euo pipefail
          echo "=== GSA_TV_AUDIOVISUAL_HOOKS ==="
          sudo grep -RInE 'requires_approved_package|production_package_ready|audiovisual_generation|production_package_path|editorial-plan|source-manifest'             /opt/gsa-tv/control-plane/src /opt/gsa-tv/bin /opt/gsa-tv/n8n/workflows 2>/dev/null | head -300 || true
          REMOTE
              ;;
            producer-contract)
              cat > "$RUNNER_TEMP/remote-probe.sh" <<'REMOTE'
          set -euo pipefail
          echo "=== GSA_TV_PRODUCER_CONTRACT ==="
          echo "--- editorial-production lines 98-165 ---"
          sudo sed -n '98,165p' /opt/gsa-tv/control-plane/src/editorial-production.js 2>/dev/null || true
          echo "--- production-package lines 45-140 ---"
          sudo sed -n '45,140p' /opt/gsa-tv/control-plane/src/production-package.js 2>/dev/null || true
          echo "--- app automation jobs lines 3770-3820 ---"
          sudo sed -n '3770,3820p' /opt/gsa-tv/control-plane/src/app.js 2>/dev/null || true
          REMOTE
              ;;
            producer-hooks)
              cat > "$RUNNER_TEMP/remote-probe.sh" <<'REMOTE'
          set -euo pipefail
          echo "=== GSA_TV_PRODUCER_HOOKS ==="
          f=/opt/gsa-tv/control-plane/src/app.js
          sudo grep -nE 'prepareEditorialProjects|prepareProductionPackages|production-package|editorial-production|fish-editorial|prepare.*project|prepare.*package' "$f" 2>/dev/null | head -160 || true
          REMOTE
              ;;
            producer-symbols)
              cat > "$RUNNER_TEMP/remote-probe.sh" <<'REMOTE'
          set -euo pipefail
          echo "=== GSA_TV_PRODUCER_SYMBOLS ==="
          for f in /opt/gsa-tv/control-plane/src/production-package.js /opt/gsa-tv/control-plane/src/editorial-production.js /opt/gsa-tv/releases/fish-editorial-20260928/fish.js; do
            echo "--- $f ---"
            if [ -f "$f" ]; then
              sudo grep -nE 'module\.exports|export |async function|function |router|pathname|production|package|render|fish|tts|voice|media|program|asset' "$f" 2>/dev/null | head -220 || true
            else
              echo "MISSING"
            fi
          done
          REMOTE
              ;;
            automation-snapshot)
              cat > "$RUNNER_TEMP/remote-probe.sh" <<'REMOTE'
          set -euo pipefail
          echo "=== GSA_TV_AUTOMATION_SNAPSHOT ==="
          sudo docker exec gsa-tv-control-plane node -e 'fetch("http://127.0.0.1:9202/automation/snapshot",{headers:{Authorization:"Bearer "+process.env.INTERNAL_API_TOKEN}}).then(async r=>{const t=await r.text();if(!r.ok){console.error(t);process.exit(2)};process.stdout.write(t)}).catch(e=>{console.error(e);process.exit(3)})'             | python3 -c 'import sys,json; d=json.load(sys.stdin); print(json.dumps({"server_time":d.get("server_time"),"ai_ready":d.get("ai_ready",[]),"ai_jobs_24h":d.get("ai_jobs_24h",[]),"media_pending":d.get("media_pending",[]),"schedule_versions":d.get("schedule_versions",[])},ensure_ascii=False))'
          REMOTE
              ;;
            inventory)
              cat > "$RUNNER_TEMP/remote-probe.sh" <<'REMOTE'
          set -euo pipefail
          echo "=== GSA_TV_VPS_INVENTORY ==="
          echo "--- containers ---"
          sudo docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' 2>/dev/null | grep -Ei '(^NAMES|gsa-tv|ffplayout)' || true
          echo "--- service unit files ---"
          sudo systemctl list-unit-files --no-pager 2>/dev/null | grep -Ei 'gsa-tv|ffplayout' || true
          echo "--- /opt/gsa-tv tree ---"
          sudo find /opt/gsa-tv -mindepth 1 -maxdepth 3 -printf '%y %p\n' 2>/dev/null | sort | head -500 || true
          echo "--- likely GSA TV directories under /home/opc ---"
          find /home/opc -mindepth 1 -maxdepth 3 -type d 2>/dev/null | grep -Ei 'gsa.?tv|ffplayout' | sort | head -200 || true
          REMOTE
              ;;
            schedule-now)
              cat > "$RUNNER_TEMP/remote-probe.sh" <<'REMOTE'
          set -euo pipefail
          BASE="${GSA_TV_BASE:-/opt/gsa-tv}"
          ENV_FILE="${GSA_TV_ENV_FILE:-$BASE/control-plane/.env}"
          [ -f "$ENV_FILE" ] || { echo "SCHEDULE_ERROR=env_file_missing"; exit 78; }
          DB_URL="$(awk -F= '$1=="DATABASE_URL"{sub(/^[^=]*=/,"");print;exit}' "$ENV_FILE")"
          [ -n "$DB_URL" ] || { echo "SCHEDULE_ERROR=database_url_missing"; exit 78; }
          echo "=== GSA_TV_SCHEDULE_NOW ==="
          psql "$DB_URL" -X -qAt -F '|' -v ON_ERROR_STOP=1 <<'SQL'
          with ctx as (
            select
              (now() at time zone 'America/Sao_Paulo')::date as local_date,
              extract(epoch from ((now() at time zone 'America/Sao_Paulo')::time))::int as sec_now,
              to_char(now() at time zone 'America/Sao_Paulo','YYYY-MM-DD HH24:MI:SS') as local_now
          ),
          version as (
            select v.id,v.title,v.version,v.broadcast_date
            from public.gsa_tv_schedule_versions v, ctx
            where v.state='published'
              and v.broadcast_date=ctx.local_date
            order by v.version desc
            limit 1
          ),
          blocks as (
            select
              b.id,
              b.block_type,
              b.position,
              b.planned_start_offset_s,
              b.planned_duration_s,
              coalesce(m.title,e.title,p.name,'Continuidade GSA TV') as title,
              case
                when b.planned_start_offset_s <= ctx.sec_now
                 and b.planned_start_offset_s + b.planned_duration_s > ctx.sec_now then 'NOW'
                when b.planned_start_offset_s > ctx.sec_now then 'NEXT'
                else 'PAST'
              end as relation
            from version v
            join public.gsa_tv_program_blocks b on b.schedule_version_id=v.id
            left join public.gsa_tv_media_items m on m.id=b.media_item_id
            left join public.gsa_tv_episodes e on e.id=b.episode_id
            left join public.gsa_tv_programs p on p.id=b.program_id
            cross join ctx
          )
          select 'LOCAL_NOW',ctx.local_now,'','','' from ctx
          union all
          select 'SCHEDULE',coalesce(v.title,''),v.broadcast_date::text,v.version::text,'' from version v
          union all
          select
            relation,
            title,
            to_char(time '00:00:00' + make_interval(secs => planned_start_offset_s),'HH24:MI:SS'),
            to_char(time '00:00:00' + make_interval(secs => planned_start_offset_s + planned_duration_s),'HH24:MI:SS'),
            block_type
          from blocks
          where relation in ('NOW','NEXT')
          order by 1 desc,3
          limit 8;
          SQL
          REMOTE
              ;;
            backup-status)
              cat > "$RUNNER_TEMP/remote-probe.sh" <<'REMOTE'
          set -euo pipefail
          echo "=== GSA_TV_BACKUP_STATUS ==="
          echo "--- backup directories ---"
          for d in /home/opc/backups /opt/gsa-tv/backups /opt/gsa-tv/backup; do
            if [ -d "$d" ]; then
              echo "DIR=$d"
              sudo find "$d" -maxdepth 2 -type f -printf '%TY-%Tm-%TdT%TH:%TM:%TS %s %p\n' 2>/dev/null | sort -r | head -100 || true
            fi
          done
          echo "--- backup-related systemd units ---"
          sudo systemctl list-unit-files --no-pager 2>/dev/null | grep -Ei 'gsa-tv.*backup|backup.*gsa-tv' || true
          REMOTE
              ;;
          esac

          ssh -i "$HOME/.ssh/gsa-tv-deploy"             -o BatchMode=yes             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=yes             "$VPS_USER@$VPS_HOST"             'sudo bash -s' < "$RUNNER_TEMP/remote-probe.sh"

      - name: Remove local SSH material
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/gsa-tv-deploy" "$HOME/.ssh/known_hosts"
