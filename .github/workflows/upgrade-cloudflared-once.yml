name: Upgrade Cloudflared and Refresh Remote Agent

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upgrade-cloudflared-once.yml"

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-latest
    environment: gsa-tv-production
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.GSA_TV_VPS_HOST }}
      VPS_USER: ${{ secrets.GSA_TV_VPS_USER }}
    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.GSA_TV_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.GSA_TV_VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/gsa-tv-deploy"
          chmod 600 "$HOME/.ssh/gsa-tv-deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upgrade cloudflared
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true

          sudo cp -a /usr/local/bin/cloudflared /usr/local/bin/cloudflared.pre-2026.9.3
          sudo install -m 0755 /tmp/cloudflared-2026.9.3 /usr/local/bin/cloudflared
          sudo systemctl restart cloudflared-tunnel.service
          sleep 4
          sudo systemctl is-active --quiet cloudflared-tunnel.service

          OLD_ID="$(sudo docker inspect mytunnel --format '{{.Image}}')"
          sudo docker tag "$OLD_ID" gsa-rollback/cloudflared:pre-2026.9.3
          mapfile -t CMD < <(sudo docker inspect mytunnel --format '{{range .Config.Cmd}}{{println .}}{{end}}')

          sudo docker stop mytunnel >/dev/null
          sudo docker rm mytunnel >/dev/null
          sudo docker run -d --name mytunnel --restart unless-stopped --network gsa-network cloudflare/cloudflared:latest "${CMD[@]}" >/dev/null
          sleep 6

          if [ "$(sudo docker inspect mytunnel --format '{{.State.Running}}')" != "true" ]; then
            sudo docker rm -f mytunnel >/dev/null 2>&1 || true
            sudo docker run -d --name mytunnel --restart unless-stopped --network gsa-network gsa-rollback/cloudflared:pre-2026.9.3 "${CMD[@]}" >/dev/null
            sudo cp -a /usr/local/bin/cloudflared.pre-2026.9.3 /usr/local/bin/cloudflared
            sudo systemctl restart cloudflared-tunnel.service
            exit 1
          fi

          echo "HOST_CLOUDFLARED=$(/usr/local/bin/cloudflared --version)"
          echo "DOCKER_CLOUDFLARED=$(sudo docker exec mytunnel cloudflared --version 2>/dev/null || sudo docker run --rm cloudflare/cloudflared:latest --version)"
          echo "QUICK_TUNNEL=$(sudo systemctl is-active cloudflared-tunnel.service)"
          echo "NAMED_TUNNEL=$(sudo docker inspect mytunnel --format '{{.State.Status}}')"

          sudo systemctl restart desktop-commander-remote.service || true
          echo CLOUDFLARED_UPGRADE_OK=true
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/gsa-tv-deploy" "$HOME/.ssh/known_hosts"
