name: GSA TV Autopilot V2

on:
  pull_request:
    paths:
      - "gsa-tv-night-controller.sh"
      - "infrastructure/gsa-tv/**"
      - "docs/gsa-tv-secret-rotation.md"
      - "supabase/migrations/*gsa_tv_autopilot*.sql"
      - ".github/workflows/gsa-tv-autopilot*.yml"
  push:
    branches:
      - "feat/gsa-tv-autopilot-v2"
    paths:
      - "gsa-tv-night-controller.sh"
      - "infrastructure/gsa-tv/**"
      - "docs/gsa-tv-secret-rotation.md"
      - "supabase/migrations/*gsa_tv_autopilot*.sql"
      - ".github/workflows/gsa-tv-autopilot*.yml"

permissions:
  contents: read

jobs:
  autopilot-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax
        run: |
          python -m py_compile \
            infrastructure/gsa-tv/scripts/autopilot-readiness.py \
            infrastructure/gsa-tv/scripts/autopilot-content-factory.py \
            infrastructure/gsa-tv/scripts/autopilot-broadcast-controller.py \
            infrastructure/gsa-tv/scripts/autopilot-duration-engine.py \
            infrastructure/gsa-tv/scripts/autopilot-fallback-engine.py \
            infrastructure/gsa-tv/scripts/night-production.py \
            infrastructure/gsa-tv/scripts/render-generic-program.py \
            infrastructure/gsa-tv/scripts/daily-scripts.py \
            infrastructure/gsa-tv/scripts/test_autopilot_content_factory.py \
            infrastructure/gsa-tv/scripts/test_autopilot_broadcast_controller.py \
            infrastructure/gsa-tv/scripts/test_autopilot_duration_engine.py \
            infrastructure/gsa-tv/scripts/test_autopilot_fallback_engine.py \
            infrastructure/gsa-tv/scripts/test_render_generic_program.py

      - name: Autopilot unit tests
        run: |
          python infrastructure/gsa-tv/scripts/test_autopilot_content_factory.py
          python infrastructure/gsa-tv/scripts/test_autopilot_broadcast_controller.py
          python infrastructure/gsa-tv/scripts/test_autopilot_duration_engine.py
          python infrastructure/gsa-tv/scripts/test_autopilot_fallback_engine.py
          python infrastructure/gsa-tv/scripts/test_render_generic_program.py

      - name: Runtime JavaScript syntax
        run: |
          node --check infrastructure/gsa-tv/scripts/autonomous-script.cjs
          node --check infrastructure/gsa-tv/services/playout-api/src/app.js
          node --check infrastructure/gsa-tv/services/encoder-engine/src/app.js
          node --check infrastructure/gsa-tv/services/encoder-engine/encoder-client.js

      - name: Runtime shell syntax
        run: |
          bash -n infrastructure/gsa-tv/scripts/autopilot-runtime-preflight.sh
          bash -n infrastructure/gsa-tv/scripts/deploy-autopilot-v2.sh
          bash -n infrastructure/gsa-tv/tests/run-live-test-suite.sh
          bash -n infrastructure/gsa-tv/tests/test-control-plane-restart-continuity.sh

      - name: Runtime Docker build smoke
        run: |
          docker build -t gsa-tv/control-plane:ci infrastructure/gsa-tv/services/playout-api
          docker build -t gsa-tv/encoder-engine:ci infrastructure/gsa-tv/services/encoder-engine

      - name: Runtime contract assertions
        shell: python
        run: |
          from pathlib import Path

          control = Path("infrastructure/gsa-tv/services/playout-api/src/app.js").read_text()
          encoder = Path("infrastructure/gsa-tv/services/encoder-engine/src/app.js").read_text()
          compose = Path("infrastructure/gsa-tv/services/playout-api/compose.production.yml").read_text()
          deploy = Path("infrastructure/gsa-tv/scripts/deploy-autopilot-v2.sh").read_text()
          preflight = Path("infrastructure/gsa-tv/scripts/autopilot-runtime-preflight.sh").read_text()
          factory_service = Path("infrastructure/gsa-tv/systemd/gsa-tv-autopilot-content-factory.service").read_text()
          broadcast_service = Path("infrastructure/gsa-tv/systemd/gsa-tv-autopilot-broadcast-controller.service").read_text()
          broadcast_controller = Path("infrastructure/gsa-tv/scripts/autopilot-broadcast-controller.py").read_text()
          autonomous = Path("infrastructure/gsa-tv/scripts/autonomous-script.cjs").read_text()
          night_production = Path("infrastructure/gsa-tv/scripts/night-production.py").read_text()
          renderer = Path("infrastructure/gsa-tv/scripts/render-generic-program.py").read_text()
          readiness = Path("infrastructure/gsa-tv/scripts/autopilot-readiness.py").read_text()
          gemini = Path("infrastructure/gsa-tv/services/playout-api/src/gemini.js").read_text()

          required_control = [
              "ENCODER_ENGINE_URL",
              "encoderEngineRequest",
              "control_plane_shutdown_encoder_preserved",
              "control_plane_restore_external_encoder_preserved",
              "autopilotSnapshot",
              "fallback_engine",
              "broadcast_controller",
          ]
          for marker in required_control:
              assert marker in control, f"Control Plane contract missing: {marker}"

          for marker in [
              "Grade versionada publicada obrigatória",
              "usa mídia sem aprovação editorial",
              "allow_continuity_fill",
              "required_slot_duration_s",
              "requirePublished: true",
          ]:
              assert marker in control, f"Published schedule safety contract missing: {marker}"

          assert 'case "stream_start"' in control
          assert 'case "stream_resume"' in control
          assert 'case "live_return"' in control
          assert 'compilePlaylist(localClock(new Date()).date, { requirePublished: true })' in control
          assert 'encoder.outer_running && encoder.producer_running' in control
          assert '"control_plane_restore_external_encoder_preserved"' in control
          assert 'await encoderEngineStatus()' in control

          for marker in ["encryptState", "decryptState", "aes-256-gcm", "redact("]:
              assert marker in encoder, f"Encoder security contract missing: {marker}"

          assert "GSA_TV_AUTOPILOT_AUTO_APPROVE" in autonomous
          assert "approvalState = automatedApproval ? 'approved' : 'pending'" in autonomous
          assert "visual_review_passed: visualPassed" in autonomous
          assert "gemini.reviewImages" in autonomous
          assert "source_bound_program" in autonomous
          assert "reviewImages" in gemini
          assert "GSA_TV_AUTOPILOT_AUTO_APPROVE" in night_production
          assert "approval_state = 'approved' if automated_approval else 'pending'" in night_production
          assert "def compute_timing(" in renderer
          assert "source_bound_program" in renderer
          assert "visual_provenance = []" in renderer
          assert "autopilot-fallback-engine.py" in deploy
          assert "GSA_TV_AUTOPILOT_AUTO_APPROVE=false" in deploy
          assert "EnvironmentFile=-/opt/gsa-tv/autopilot/autopilot.env" in factory_service
          assert "EnvironmentFile=-/opt/gsa-tv/autopilot/autopilot.env" in broadcast_service
          assert "GSA_TV_BROADCAST_AUTOMATION_ENABLED=false" in broadcast_service
          assert "GSA_TV_BROADCAST_AUTOMATION_ENABLED=false" in deploy
          assert '"stream_standby"' not in broadcast_controller
          assert '"stream_start"' in broadcast_controller
          assert '"stream_stop"' in broadcast_controller
          assert "hold_manual_pause" in broadcast_controller
          assert "hold_manual_live_overtime" in broadcast_controller
          assert "legacy_broadcast_automation_active" in broadcast_controller
          assert "legacy_production_automation_active" in content_factory
          assert "autopilot-broadcast-controller.py" in deploy
          assert "gsa-tv-autopilot-broadcast-controller.timer" in deploy
          assert "docker run --rm --network host postgres:15-alpine" not in deploy
          assert "docker run --rm --network host postgres:15-alpine" not in preflight
          assert '[ "$desired" != "stopped" ] || [ "$signal" != "stopped" ] || [ "$playout" != "off_air" ]' in deploy
          assert 'cp -a "$ENV_FILE" "$BACKUP_DIR/control-plane.env"' in deploy
          assert 'cp -f "$BACKUP_DIR/control-plane.env" "$ENV_FILE"' in deploy
          assert 'Control Plane existente sem compose local para rollback seguro' in deploy
          assert 'Encoder Engine existente sem compose local para rollback seguro' in deploy
          assert 'deploy exige backup full restaurado/testado e íntegro' in deploy
          assert 'backup_manifest_ok' in deploy
          assert 'GSA_TV_DEPLOY_BACKUP_MAX_AGE_S' in deploy
          assert 'FIRST_MIGRATION_OFFAIR_READY=$first_migration_offair_ready' in preflight
          assert 'LATEST_BACKUP_MANIFEST_OK=$latest_backup_manifest_ok' in preflight
          assert 'LEGACY_BROADCAST_AUTOMATION_ACTIVE=' in preflight
          assert 'LEGACY_PRODUCTION_AUTOMATION_ACTIVE=' in preflight
          assert 'playout_state' in preflight
          assert "slot_duration_contract_violation" in readiness
          assert "library_composition_required" in readiness
          assert "authorized_continuity_fill_s" in readiness
          assert "required_slot_duration_s" in readiness
          assert "allow_continuity_fill" in night_production
          assert "allow_trim" in night_production

          assert "gsa-tv/control-plane:1.8.0" in compose
          assert "ENCODER_ENGINE_URL: http://127.0.0.1:9210" in compose

          migrations = [
              "20260922131000_gsa_tv_autopilot_compile_gate.sql",
              "20260922132000_gsa_tv_autopilot_duration_swap.sql",
              "20260922134000_gsa_tv_autopilot_continuity_fallback.sql",
              "20260922135000_gsa_tv_cinema_duration_contract.sql",
          ]
          for migration in migrations:
              assert Path("supabase/migrations", migration).is_file(), f"Missing migration: {migration}"
              assert migration in deploy, f"Deploy contract does not require: {migration}"

      - name: Active GSA TV secret guard
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          files = [
              Path("gsa-tv-night-controller.sh"),
              *Path("infrastructure/gsa-tv").rglob("*"),
          ]
          text_files = [
              p for p in files
              if p.is_file()
              and p.suffix.lower() in {".py",".js",".cjs",".mjs",".sh",".yml",".yaml",".json",".md",".conf",".service",".timer"}
              and "__pycache__" not in p.parts
          ]

          checks = [
              ("postgres_password_uri", re.compile(r"postgres(?:ql)?://[^\s\"'/:]+:[^@\s\"']+@", re.I)),
              ("literal_private_key", re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----")),
              ("literal_long_secret", re.compile(r"(?:TOKEN|SECRET|PASSWORD|API[_-]?KEY)\s*=\s*[\"'][A-Za-z0-9._~+/=-]{24,}[\"']", re.I)),
          ]

          failures = []
          for path in text_files:
              try:
                  content = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for name, pattern in checks:
                  if pattern.search(content):
                      failures.append(f"{path}: {name}")

          if failures:
              print("Potential active GSA TV secrets detected:")
              print("\n".join(failures))
              sys.exit(1)
          print(f"Secret guard passed across {len(text_files)} active GSA TV text files.")
