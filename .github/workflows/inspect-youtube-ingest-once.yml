name: One-shot Inspect YouTube Ingest Sessions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-youtube-ingest-once.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: gsa-tv-production
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.GSA_TV_VPS_HOST }}
      VPS_USER: ${{ secrets.GSA_TV_VPS_USER }}
    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.GSA_TV_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.GSA_TV_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/gsa-tv-deploy"
          chmod 600 "$HOME/.ssh/gsa-tv-deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inspect
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/gsa-tv-deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          echo "=== ALL PROCESS ARGS WITH YOUTUBE ==="
          ps -eo pid=,ppid=,user=,etime=,args= | grep -i '[y]outube' | sed -E 's#(rtmps?://[^/ ]+/)[^ ]+#\1[PROTECTED]#g' || true
          echo "=== ESTABLISHED TLS CONNECTIONS ==="
          ss -ntp state established 2>/dev/null | grep ':443' | head -n 100 || true
          echo "=== FFP YOUTUBE CHILD ==="
          docker top gsa-tv-ffplayout -eo pid,ppid,user,args 2>/dev/null | grep -E 'youtube|ffplayout' | sed -E 's#(rtmps?://[^/ ]+/)[^ ]+#\1[PROTECTED]#g' || true
          echo "=== FFP RECENT ERRORS ==="
          docker logs --since 5m gsa-tv-ffplayout 2>&1 | grep -Ei 'youtube|rtmps|broken pipe|connection|error|failed|disconnect' | tail -n 120 | sed -E 's#(rtmps?://[^/ ]+/)[^ ]+#\1[PROTECTED]#g' || true
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/gsa-tv-deploy" "$HOME/.ssh/known_hosts"
