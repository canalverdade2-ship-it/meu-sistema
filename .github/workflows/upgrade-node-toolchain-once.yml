name: Upgrade VPS Node Toolchain

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upgrade-node-toolchain-once.yml"

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-latest
    environment: gsa-tv-production
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.GSA_TV_VPS_HOST }}
      VPS_USER: ${{ secrets.GSA_TV_VPS_USER }}
    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.GSA_TV_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.GSA_TV_VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/gsa-tv-deploy"
          chmod 600 "$HOME/.ssh/gsa-tv-deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upgrade node global tools
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n npm install -g npm@12.2.0 corepack@0.36.0 pm2@7.0.4 @wonderwhy-er/desktop-commander@0.2.52

          if pm2 describe postgrest >/dev/null 2>&1; then
            status="$(pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);const p=a.find(x=>x.name==="postgrest");console.log(p?.pm2_env?.status||"")})')"
            if [ "$status" = "errored" ] || [ "$status" = "stopped" ]; then
              pm2 delete postgrest >/dev/null || true
            fi
          fi
          pm2 save >/dev/null
          pm2 update >/dev/null
          sleep 3

          echo "NODE=$(node -v)"
          echo "NPM=$(npm -v)"
          echo "COREPACK=$(corepack --version)"
          echo "PM2=$(pm2 -v)"
          echo "DESKTOP_COMMANDER=$(npm -g ls @wonderwhy-er/desktop-commander --depth=0 2>/dev/null | tail -n 1)"
          pm2 list
          echo TOOLCHAIN_UPGRADE_OK=true
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/gsa-tv-deploy" "$HOME/.ssh/known_hosts"
