name: Kill Election Ingest Publishers

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kill-election-ingest-once.yml"

permissions:
  contents: read

jobs:
  stop:
    runs-on: ubuntu-latest
    environment: gsa-tv-production
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.GSA_TV_VPS_HOST }}
      VPS_USER: ${{ secrets.GSA_TV_VPS_USER }}
    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.GSA_TV_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.GSA_TV_VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/gsa-tv-deploy"
          chmod 600 "$HOME/.ssh/gsa-tv-deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Stop only election RTMP ingest publishers
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          echo "=== ELECTION INGEST PUBLISHERS BEFORE ==="
          mapfile -t PIDS < <(docker top gsa-tv-ffplayout -eo pid,args 2>/dev/null | awk '/[f]fmpeg/ && /rtmp:\/\/127\.0\.0\.1:1936\/live\/stream/ {print $1}')
          printf 'COUNT=%s\n' "${#PIDS[@]}"
          for pid in "${PIDS[@]}"; do
            echo "STOP_PID=$pid"
            kill -TERM "$pid" 2>/dev/null || true
          done

          sleep 8

          echo "=== FFP PROCESSES AFTER ==="
          docker top gsa-tv-ffplayout -eo pid,ppid,user,args 2>/dev/null             | grep -E 'ffplayout|ffmpeg'             | sed -E 's#(rtmps?://[^/ ]+/)[^ ]+#\1[PROTECTED]#g' || true

          echo "=== SWITCH LOG ==="
          docker logs --since 20s gsa-tv-ffplayout 2>&1             | grep -Ei 'live input ended|switching back to file playback|reinitialize playlist|idle|disconnected'             | tail -n 40 || true

          echo "ELECTION_INGEST_STOPPED=true"
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/gsa-tv-deploy" "$HOME/.ssh/known_hosts"
