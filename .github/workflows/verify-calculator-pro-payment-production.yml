name: Verify Calculator Pro Payment Production

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/verify-calculator-pro-payment-production.yml']

permissions:
  contents: read

jobs:
  verify-payment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ocgajvagxagutfvgxwsy
    steps:
      - name: Prepare identifiers and API key
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys" > /tmp/keys.json
          jq -r '.[] | select(.name=="anon") | .api_key' /tmp/keys.json > /tmp/anon-key
          test -s /tmp/anon-key
          echo "gsa_payment_verify_${GITHUB_RUN_ID}_12345678901234567890" > /tmp/visitor
          cat /proc/sys/kernel/random/uuid > /tmp/order
          echo "AUDIT-TXN-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" > /tmp/transaction
          echo "AUDIT_PAYMENT_VERIFY_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" > /tmp/marker

      - name: Create and finalize synthetic payment
        shell: bash
        run: |
          set -euo pipefail
          visitor="$(cat /tmp/visitor)"; visitor_hash="$(printf '%s' "$visitor" | sha256sum | awk '{print $1}')"
          order="$(cat /tmp/order)"; transaction="$(cat /tmp/transaction)"; marker="$(cat /tmp/marker)"
          query="WITH inserted AS (
            INSERT INTO public.gsa_calculator_pro_payments(order_nsu,tool_id,visitor_token_hash,valor_centavos,duracao_acesso_minutos,status,expires_at,raw_payload)
            VALUES ('$order','termination','$visitor_hash',1234,37,'pending',now()+interval '1 hour',jsonb_build_object('audit_marker','$marker'))
            RETURNING order_nsu
          )
          SELECT public.gsa_calculator_finalize_payment_internal(order_nsu,'$transaction','audit-slug',NULL,'audit',1234,jsonb_build_object('audit',true)) AS result FROM inserted;"
          jq -n --arg query "$query" '{query:$query,read_only:false}' > /tmp/finalize.json
          curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header 'Content-Type: application/json' --data-binary @/tmp/finalize.json "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" > /tmp/finalize-result.json
          jq -c . /tmp/finalize-result.json
          jq -e '.[0].result.success==true and (.[0].result.grant_id|length)>20 and .[0].result.duration_minutes==37' /tmp/finalize-result.json >/dev/null

      - name: Verify persisted payment and grant duration
        shell: bash
        run: |
          set -euo pipefail
          order="$(cat /tmp/order)"
          query="SELECT p.status,p.duracao_acesso_minutos,p.transaction_nsu,g.status AS grant_status,round(extract(epoch from (g.valid_until-p.paid_at))/60)::integer AS granted_minutes FROM public.gsa_calculator_pro_payments p JOIN public.gsa_calculator_pro_grants g ON g.reference_id=p.id AND g.source='payment' WHERE p.order_nsu='$order';"
          jq -n --arg query "$query" '{query:$query,read_only:true}' > /tmp/check.json
          curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header 'Content-Type: application/json' --data-binary @/tmp/check.json "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" > /tmp/check-result.json
          jq -c . /tmp/check-result.json
          jq -e '.[0].status=="paid" and .[0].duracao_acesso_minutos==37 and .[0].grant_status=="active" and (.[0].granted_minutes>=36 and .[0].granted_minutes<=37)' /tmp/check-result.json >/dev/null

      - name: Verify public access and session activation
        shell: bash
        run: |
          set -euo pipefail
          anon="$(cat /tmp/anon-key)"; visitor="$(cat /tmp/visitor)"
          jq -n --arg visitor "$visitor" '{action:"status",payload:{tool_id:"termination",visitor_token:$visitor}}' > /tmp/status.json
          curl --fail-with-body --silent --show-error --request POST --header "apikey: $anon" --header "Authorization: Bearer $anon" --header 'Content-Type: application/json' --header 'Origin: http://localhost:3000' --data-binary @/tmp/status.json "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/gsa-free-tools-pro" > /tmp/status-result.json
          jq -c . /tmp/status-result.json
          jq -e '.access==true and .source=="payment"' /tmp/status-result.json >/dev/null
          jq -n --arg visitor "$visitor" '{action:"activate",payload:{tool_id:"termination",visitor_token:$visitor}}' > /tmp/activate.json
          curl --fail-with-body --silent --show-error --request POST --header "apikey: $anon" --header "Authorization: Bearer $anon" --header 'Content-Type: application/json' --header 'Origin: http://localhost:3000' --data-binary @/tmp/activate.json "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/gsa-free-tools-pro" > /tmp/activate-result.json
          jq -c . /tmp/activate-result.json
          jq -e '.success==true and (.token|length)>20' /tmp/activate-result.json >/dev/null

      - name: Verify transaction NSU cannot unlock another order
        shell: bash
        run: |
          set -euo pipefail
          order2="$(cat /proc/sys/kernel/random/uuid)"; transaction="$(cat /tmp/transaction)"; marker2="AUDIT_DUP_VERIFY_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          echo "$marker2" > /tmp/marker2
          query="WITH inserted AS (
            INSERT INTO public.gsa_calculator_pro_payments(order_nsu,tool_id,visitor_token_hash,valor_centavos,duracao_acesso_minutos,status,expires_at,raw_payload)
            VALUES ('$order2','termination',encode(digest('duplicate','sha256'),'hex'),1234,37,'pending',now()+interval '1 hour',jsonb_build_object('audit_marker','$marker2'))
            RETURNING order_nsu
          )
          SELECT public.gsa_calculator_finalize_payment_internal(order_nsu,'$transaction','audit-slug-2',NULL,'audit',1234,'{}'::jsonb) AS result FROM inserted;"
          jq -n --arg query "$query" '{query:$query,read_only:false}' > /tmp/duplicate.json
          curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header 'Content-Type: application/json' --data-binary @/tmp/duplicate.json "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" > /tmp/duplicate-result.json
          jq -c . /tmp/duplicate-result.json
          jq -e '.[0].result.success==false and .[0].result.error=="transaction_already_used"' /tmp/duplicate-result.json >/dev/null

      - name: Verify webhook failure requests retry and checkout stays safely disabled
        shell: bash
        run: |
          set -euo pipefail
          webhook_http="$(curl --silent --show-error --output /tmp/webhook.json --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{"order_nsu":"unknown-audit","transaction_nsu":"unknown","slug":"unknown"}' "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/gsa-free-tools-pro-webhook")"
          echo "WEBHOOK_HTTP=$webhook_http"; jq -c . /tmp/webhook.json
          test "$webhook_http" = '400'; jq -e '.success==false' /tmp/webhook.json >/dev/null
          anon="$(cat /tmp/anon-key)"; visitor="gsa_checkout_verify_${GITHUB_RUN_ID}_12345678901234567890"
          jq -n --arg visitor "$visitor" '{action:"status",payload:{tool_id:"termination",visitor_token:$visitor}}' > /tmp/checkout.json
          curl --fail-with-body --silent --show-error --request POST --header "apikey: $anon" --header "Authorization: Bearer $anon" --header 'Content-Type: application/json' --header 'Origin: http://localhost:3000' --data-binary @/tmp/checkout.json "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/gsa-free-tools-pro" > /tmp/checkout-result.json
          jq -c . /tmp/checkout-result.json
          jq -e '.checkout_available==false' /tmp/checkout-result.json >/dev/null
          echo 'PAYMENT_PRODUCTION_FLOW_OK_CHECKOUT_WAITING_INFINITETAG'

      - name: Cleanup synthetic records
        if: always()
        shell: bash
        run: |
          set +e
          marker="$(cat /tmp/marker 2>/dev/null)"; marker2="$(cat /tmp/marker2 2>/dev/null)"
          query=""
          for item in "$marker" "$marker2"; do
            if [ -n "$item" ]; then
              query="$query DELETE FROM public.gsa_calculator_pro_events WHERE payment_id IN (SELECT id FROM public.gsa_calculator_pro_payments WHERE raw_payload->>'audit_marker'='$item') OR grant_id IN (SELECT g.id FROM public.gsa_calculator_pro_grants g JOIN public.gsa_calculator_pro_payments p ON p.id=g.reference_id WHERE p.raw_payload->>'audit_marker'='$item'); DELETE FROM public.gsa_calculator_pro_sessions WHERE grant_id IN (SELECT g.id FROM public.gsa_calculator_pro_grants g JOIN public.gsa_calculator_pro_payments p ON p.id=g.reference_id WHERE p.raw_payload->>'audit_marker'='$item'); DELETE FROM public.gsa_calculator_pro_grants WHERE reference_id IN (SELECT id FROM public.gsa_calculator_pro_payments WHERE raw_payload->>'audit_marker'='$item'); DELETE FROM public.gsa_calculator_pro_payments WHERE raw_payload->>'audit_marker'='$item';"
            fi
          done
          if [ -n "$query" ]; then
            jq -n --arg query "$query" '{query:$query,read_only:false}' > /tmp/cleanup.json
            curl --silent --show-error --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header 'Content-Type: application/json' --data-binary @/tmp/cleanup.json "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" >/dev/null
          fi
