name: GSA TV First Migration Prep

on:
  workflow_dispatch:
    inputs:
      confirm_prepare:
        description: "Digite PREPARE-FIRST-MIGRATION para autorizar snapshot, 5 migrations, reconciliação off-air, recuperação local determinística e backup full"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gsa-tv-first-migration-prep-production
  cancel-in-progress: false

jobs:
  prepare:
    name: first-migration-prep
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: gsa-tv-production
    env:
      EXPECTED_PROJECT_ID: ocgajvagxagutfvgxwsy
      VPS_HOST: ${{ secrets.GSA_TV_VPS_HOST }}
      VPS_USER: ${{ secrets.GSA_TV_VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.GSA_TV_VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.GSA_TV_VPS_KNOWN_HOSTS }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard explicit production preparation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirm_prepare }}" = "PREPARE-FIRST-MIGRATION" || {
            echo "Confirmação inválida." >&2
            exit 64
          }

          missing=()
          [ -n "${VPS_HOST:-}" ] || missing+=("GSA_TV_VPS_HOST")
          [ -n "${VPS_USER:-}" ] || missing+=("GSA_TV_VPS_USER")
          [ "${#VPS_SSH_KEY}" -ge 100 ] || missing+=("GSA_TV_VPS_SSH_KEY")
          [ "${#VPS_KNOWN_HOSTS}" -ge 20 ] || missing+=("GSA_TV_VPS_KNOWN_HOSTS")
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || missing+=("SUPABASE_ACCESS_TOKEN")
          [ -n "${SUPABASE_DB_PASSWORD:-}" ] || missing+=("SUPABASE_DB_PASSWORD")
          [ -n "${SUPABASE_PROJECT_ID:-}" ] || missing+=("SUPABASE_PROJECT_ID")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Secret obrigatório ausente: %s\n' "${missing[@]}" >&2
            exit 78
          fi
          [ "$SUPABASE_PROJECT_ID" = "$EXPECTED_PROJECT_ID" ] || {
            echo "Project ref Supabase não corresponde ao projeto autorizado." >&2
            exit 79
          }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configure pinned SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/gsa-tv-deploy"
          chmod 0600 "$HOME/.ssh/gsa-tv-deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Verify remote identity and prerequisites
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy"             -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes             "$VPS_USER@$VPS_HOST"             'set -euo pipefail; sudo -n true; command -v docker >/dev/null; command -v psql >/dev/null; command -v python3 >/dev/null; docker inspect gsa-tv-ffplayout >/dev/null'

      - name: Physical off-air preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy"             -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes             "$VPS_USER@$VPS_HOST"             'sudo bash -s'             < infrastructure/gsa-tv/scripts/autopilot-runtime-preflight.sh             | tee preflight-before.txt

          grep -qx 'PHYSICAL_OFF_AIR_EVIDENCE=true' preflight-before.txt
          grep -qx 'HOST_RTMP_FFMPEG_COUNT=0' preflight-before.txt
          grep -qx 'FFPLAYOUT_STREAM_SOCKET_COUNT=0' preflight-before.txt
          grep -qx 'HOST_SQLITE_BACKUP_PROBE=ok' preflight-before.txt
          grep -qx 'FFPLAYOUT_HEALTH=healthy' preflight-before.txt

      - name: Inspect canonical migration status
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy"             -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes             "$VPS_USER@$VPS_HOST"             'sudo bash -s'             < infrastructure/gsa-tv/scripts/autopilot-migration-status.sh             | tee migration-before.txt

          if grep -q '^MIGRATION_STATE=inconsistent$' migration-before.txt; then
            echo "Histórico de migrations inconsistente; abortando antes de qualquer mutação." >&2
            exit 80
          fi

      - name: Legacy ffplayout snapshot dry-run
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy"             -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes             "$VPS_USER@$VPS_HOST"             'sudo bash -s'             < infrastructure/gsa-tv/scripts/snapshot-legacy-ffplayout.sh             | tee snapshot-dry-run.txt
          grep -qx 'DRY_RUN_OK=true' snapshot-dry-run.txt

      - name: Legacy ffplayout snapshot apply
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy"             -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes             "$VPS_USER@$VPS_HOST"             'sudo bash -s -- --apply'             < infrastructure/gsa-tv/scripts/snapshot-legacy-ffplayout.sh             | tee snapshot-apply.txt
          grep -qx 'SNAPSHOT_APPLIED=true' snapshot-apply.txt
          grep -qx 'SNAPSHOT_VERIFY_OK=true' snapshot-apply.txt

      - name: Link authorized Supabase project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply only the five canonical Autopilot migrations
        shell: bash
        run: |
          set -euo pipefail

          remote_status() {
            ssh -i "$HOME/.ssh/gsa-tv-deploy"               -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes               "$VPS_USER@$VPS_HOST"               'sudo bash -s'               < infrastructure/gsa-tv/scripts/autopilot-migration-status.sh
          }

          migrations=(
            "20260922131000:supabase/migrations/20260922131000_gsa_tv_autopilot_compile_gate.sql"
            "20260922132000:supabase/migrations/20260922132000_gsa_tv_autopilot_duration_swap.sql"
            "20260922134000:supabase/migrations/20260922134000_gsa_tv_autopilot_continuity_fallback.sql"
            "20260922135000:supabase/migrations/20260922135000_gsa_tv_cinema_duration_contract.sql"
            "20260922136000:supabase/migrations/20260922136000_gsa_tv_resolved_production_signature.sql"
          )

          for item in "${migrations[@]}"; do
            version="${item%%:*}"
            file="${item#*:}"
            status="$(remote_status)"
            line="$(printf '%s\n' "$status" | grep "^MIGRATION_STATUS=$version|" || true)"
            [ -n "$line" ] || {
              echo "Sem status para migration $version." >&2
              exit 81
            }

            history="$(sed -n 's/.*|history=\([^|]*\).*/\1/p' <<<"$line")"
            contract="$(sed -n 's/.*|contract=\([^|]*\).*/\1/p' <<<"$line")"

            if [ "$history" = t ] && [ "$contract" = t ]; then
              echo "MIGRATION_SKIP_READY=$version"
              continue
            fi
            if [ "$history" = t ] && [ "$contract" != t ]; then
              echo "Migration $version consta no histórico sem contrato correspondente." >&2
              exit 82
            fi

            if [ "$contract" != t ]; then
              echo "MIGRATION_APPLY=$version"
              supabase db query --linked --file "$file"
            else
              echo "MIGRATION_REPAIR_HISTORY_ONLY=$version"
            fi

            supabase migration repair --status applied "$version"

            verified="$(remote_status | grep "^MIGRATION_STATUS=$version|" || true)"
            grep -q '|history=t|contract=t$' <<<"$verified" || {
              echo "Migration $version não confirmou history+contract após aplicação." >&2
              exit 83
            }
          done

          remote_status | tee migration-after.txt
          grep -qx 'MIGRATION_STATE=ready' migration-after.txt

      - name: Reconcile stale logical off-air state dry-run
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy"             -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes             "$VPS_USER@$VPS_HOST"             'sudo bash -s'             < infrastructure/gsa-tv/scripts/reconcile-stale-offair-state.sh             | tee offair-dry-run.txt
          grep -qx 'DRY_RUN_OK=true' offair-dry-run.txt

      - name: Reconcile stale logical off-air state apply
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy"             -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes             "$VPS_USER@$VPS_HOST"             'sudo bash -s -- --apply'             < infrastructure/gsa-tv/scripts/reconcile-stale-offair-state.sh             | tee offair-apply.txt
          grep -qx 'OFFAIR_RECONCILE_APPLIED=true' offair-apply.txt

      - name: Recover deterministic local media cache dry-run
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy"             -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes             "$VPS_USER@$VPS_HOST"             'sudo bash -s'             < infrastructure/gsa-tv/scripts/recover-local-media-cache.sh             | tee media-recovery-dry-run.txt
          grep -qx 'DRY_RUN_OK=true' media-recovery-dry-run.txt

      - name: Recover deterministic local media cache apply
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy"             -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes             "$VPS_USER@$VPS_HOST"             'sudo bash -s -- --apply'             < infrastructure/gsa-tv/scripts/recover-local-media-cache.sh             | tee media-recovery-apply.txt
          grep -qx 'RECOVERY_APPLIED=true' media-recovery-apply.txt

      - name: Full verified backup
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy"             -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes             "$VPS_USER@$VPS_HOST"             'sudo bash -s'             < infrastructure/gsa-tv/scripts/backup-full.sh             | tee full-backup.txt

      - name: Final preparation evidence
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gsa-tv-deploy"             -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes             "$VPS_USER@$VPS_HOST"             'sudo bash -s'             < infrastructure/gsa-tv/scripts/autopilot-runtime-preflight.sh             | tee preflight-after.txt

          grep -qx 'PHYSICAL_OFF_AIR_EVIDENCE=true' preflight-after.txt
          grep -qx 'DESIRED_STATE=stopped' preflight-after.txt
          grep -qx 'SIGNAL_STATE=stopped' preflight-after.txt
          grep -qx 'PLAYOUT_STATE=off_air' preflight-after.txt
          grep -qx 'FIRST_MIGRATION_OFFAIR_READY=true' preflight-after.txt
          grep -qx 'AUTOPILOT_DB_CONTRACT_READY=true' preflight-after.txt
          grep -qx 'AUTOPILOT_MIGRATION_COUNT=5' preflight-after.txt
          grep -qx 'LATEST_BACKUP_STATE=restored_test' preflight-after.txt
          grep -qx 'LATEST_BACKUP_MANIFEST_OK=true' preflight-after.txt
          grep -qx 'MISSING_PATHS=none' preflight-after.txt

      - name: Upload preparation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsa-tv-first-migration-prep-${{ github.run_id }}
          path: |
            preflight-before.txt
            migration-before.txt
            snapshot-dry-run.txt
            snapshot-apply.txt
            migration-after.txt
            offair-dry-run.txt
            offair-apply.txt
            media-recovery-dry-run.txt
            media-recovery-apply.txt
            full-backup.txt
            preflight-after.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove local SSH material
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/gsa-tv-deploy" "$HOME/.ssh/known_hosts"
