<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GSA TV — Estamos apresentando / Estamos de volta</title><style>:root{color-scheme:dark;--g:#d9ac43;--p:#111827;--l:#293246}*{box-sizing:border-box}body{margin:0;background:#070a10;color:#f6f7f9;font-family:Arial,sans-serif}header{padding:28px 5vw;background:linear-gradient(130deg,#080c14,#211707);border-bottom:1px solid var(--l)}h1{margin:0;color:var(--g);font-size:clamp(25px,4vw,42px)}header p{color:#b7bfcb;line-height:1.5}main{padding:22px 5vw 46px;display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:15px}article{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:17px}h2{margin:0 0 13px;font-size:18px}.row{margin:10px 0}.row span{display:block;color:var(--g);font-size:12px;font-weight:bold;margin-bottom:5px}audio{width:100%;height:39px}footer{padding:0 5vw 30px;color:#9ea7b5}</style></head><body><header><h1>GSA TV · Vinhetas de continuidade</h1><p>Pacote completo com versões masterizadas: “Estamos apresentando” e “Estamos de volta”. As locuções limpas também estão preservadas na pasta <strong>dry</strong>.</p></header><main id="grid"></main><footer>Produção: Fish Audio s2.1-pro-free · 25 programas · 50 vinhetas masterizadas.</footer><script>
const programs=[['GSA Manhã News','gsa-manha-news'],['GSA Meio-Dia News','gsa-meio-dia-news'],['GSA News Noite','gsa-news-noite'],['GSA Mercado','gsa-mercado'],['GSA Tempo','gsa-tempo'],['GSA Cidadania','gsa-cidadania'],['GSA Business','gsa-business'],['GSA Tech','gsa-tech'],['GSA Motor','gsa-motor'],['GSA Agro','gsa-agro'],['GSA Mundo','gsa-mundo'],['GSA Destinos','gsa-destinos'],['GSA Bem Viver','gsa-bem-viver'],['GSA Sabor','gsa-sabor'],['GSA Em Fé','gsa-em-fe'],['GSA Hora da Palavra','gsa-hora-da-palavra'],['GSA Tá na Rede','gsa-ta-na-rede'],['GSA Esportes','gsa-esportes'],['GSA Mistérios','gsa-misterios'],['GSA Music','gsa-music'],['GSA Cinema','gsa-cinema'],['GSA Sessão Pipoca','gsa-sessao-pipoca'],['GSA Planeta Terra','gsa-planeta-terra'],['GSA Histórias da Bíblia','gsa-historias-da-biblia'],['GSA Desenhos','gsa-desenhos']];
document.querySelector('#grid').innerHTML=programs.map(([n,s])=>`<article><h2>${n}</h2><div class="row"><span>ESTAMOS APRESENTANDO</span><audio controls preload="none" src="${s}--apresentando.mp3"></audio></div><div class="row"><span>ESTAMOS DE VOLTA</span><audio controls preload="none" src="${s}--de-volta.mp3"></audio></div></article>`).join('');
</script></body></html>
