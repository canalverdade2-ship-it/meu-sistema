# GSA TV — Nginx: preview HLS interno protegido
# Inclua este arquivo no bloco http do nginx.conf principal com:
#   include /etc/nginx/conf.d/gsa-tv-preview.conf;
#
# Pré-requisito: o GSA Hub já expõe um endpoint de verificação de sessão em
#   /internal/auth/verify  (retorna 200 se sessão válida, 401 caso contrário)
#
# SEGURANÇA:
#   - Acesso somente a usuários autenticados no GSA Hub.
#   - Sem listagem de diretório.
#   - Headers anti-cache e anti-framing aplicados.
#   - Segmentos HLS servidos com Cache-Control: no-store.

# Upstream: GSA Hub para verificação de sessão
upstream gsa_hub_auth {
    # Ajustar para a porta real do GSA Hub se diferente
    server 127.0.0.1:3000;
    keepalive 4;
}

# Rate limiting para o endpoint de preview (evitar flooding de segmentos)
limit_req_zone $binary_remote_addr zone=gsa_tv_preview:10m rate=30r/s;

server {
    # O bloco SSL e server_name são herdados da configuração principal do GSA Hub.
    # Este arquivo define apenas as locations adicionais.
    # Se usado em servidor virtual separado, adicionar:
    #   listen 443 ssl http2;
    #   server_name seu.dominio.com;
    #   ssl_certificate ...;
    #   ssl_certificate_key ...;

    # ─── Preview HLS: playlist e segmentos ───────────────────────────────────
    location /gsa-tv/preview/ {
        # Verificar autenticação antes de servir qualquer arquivo
        auth_request /gsa-tv-auth-verify;

        # Em caso de erro de autenticação, redirecionar para o painel
        error_page 401 = @gsa_tv_auth_required;
        error_page 403 = @gsa_tv_forbidden;

        # Rate limit
        limit_req zone=gsa_tv_preview burst=60 nodelay;

        # Servir arquivos do diretório de preview HLS
        alias /opt/gsa-tv/preview/hls/;

        # Sem listagem de diretório
        autoindex off;

        # Headers de segurança
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        # CORS: somente origem interna do GSA Hub
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Range" always;

        # Playlist M3U8
        location ~* \.m3u8$ {
            add_header Content-Type "application/vnd.apple.mpegurl" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        # Segmentos TS
        location ~* \.ts$ {
            add_header Content-Type "video/mp2t" always;
            add_header Cache-Control "no-store" always;
        }
    }

    # ─── Sub-request de autenticação (interna, não acessível diretamente) ────
    location = /gsa-tv-auth-verify {
        internal;

        proxy_pass              http://gsa_hub_auth/internal/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        X-Original-URI $request_uri;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        Host $host;

        # Cookie de sessão do GSA Hub é passado automaticamente
        proxy_set_header        Cookie $http_cookie;

        proxy_connect_timeout   5s;
        proxy_read_timeout      5s;
        proxy_send_timeout      5s;
    }

    # ─── Respostas de erro de autenticação ───────────────────────────────────
    location @gsa_tv_auth_required {
        return 302 /admin/login?redirect=$request_uri;
    }

    location @gsa_tv_forbidden {
        return 403 "Acesso negado ao preview da GSA TV";
    }

    # ─── Health check do HLS (para Uptime Kuma — sem auth) ───────────────────
    location = /gsa-tv/preview/health {
        # Verificar se o arquivo de playlist existe
        alias /opt/gsa-tv/preview/hls/;
        try_files playlist.m3u8 =503;
        add_header Content-Type "text/plain" always;
        return 200 "ok";
    }
}
