services:
  ffplayout-poc:
    build:
      context: ../..
      dockerfile: infrastructure/gsa-tv/Dockerfile.ffplayout
      args:
        FFPLAYOUT_VERSION: "2.1.0"
        FFPLAYOUT_RPM_SHA256: "60d00d5a676d45cb3265aa0bf3f411c33b72e5f9a93258282c3fb2b1268e0171"
    image: gsa-tv/ffplayout:2.1.0-arm64-poc
    container_name: gsa-tv-ffplayout-poc
    command: ["--help"]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - gsa-tv-net
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 6G

networks:
  gsa-tv-net:
    external: true
