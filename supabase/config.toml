[functions.import-products-from-file]
enabled = true
verify_jwt = false
import_map = "./functions/import-products-from-file/deno.json"
entrypoint = "./functions/import-products-from-file/index.ts"

# Publicidade consolidada: rotas públicas possuem CORS/rate limit/segredo de cron
# e o handler administrativo valida sessão/HMAC internamente quando aplicável.
[functions.gsa-ads-public]
enabled = true
verify_jwt = false

[functions.gsa-ads-admin]
enabled = true
verify_jwt = false

# Acesso público Free/Pro. A função reconfirma pagamento, voucher, sessão e identidade no servidor.
[functions.gsa-free-tools-pro]
enabled = true
verify_jwt = false

# Webhook público da InfinitePay. O evento nunca libera acesso sem payment_check no servidor.
[functions.gsa-free-tools-pro-webhook]
enabled = true
verify_jwt = false

